<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Terceirão · Física CIB</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#123E8C">
<meta name="description" content="Listas interativas de Física para a reta final do ENEM, 3ª série do Colégio Israelita Brasileiro.">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Terceirão">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
--bg:#EDF0F3; --surface:#FFFFFF; --ink:#141B22; --muted:#55616D; --line:#D2D9E0;
--sign:#1D4E89; --sign-ink:#FFFFFF; --lane:#F2B705; --road:#2A3037; --road-ink:#F3F5F7;
--ok:#1B7A45; --ok-bg:#E2F2E8; --bad:#B23A25; --bad-bg:#FAE8E3;
--tip-bg:#FFF5D6; --tip-ink:#5E4500; --mark-ok:#2FA463; --mark-bad:#D9553B;
--eq-bg:#F3F5F8;
--f-display:'Barlow Condensed','Arial Narrow',sans-serif;
--f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
--f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){
--bg:#0F141A; --surface:#17202A; --ink:#E6ECF2; --muted:#98A5B2; --line:#2A3542;
--sign:#2C63A8; --sign-ink:#FFFFFF; --lane:#F2C230; --road:#0A0E12; --road-ink:#F3F5F7;
--ok:#5CCB8D; --ok-bg:#15301F; --bad:#F28C74; --bad-bg:#3A1C16;
--tip-bg:#2D2610; --tip-ink:#F2D27A; --mark-ok:#2FA463; --mark-bad:#D9553B;
--eq-bg:#111922; color-scheme:dark;
}
}
:root[data-theme="dark"]{
--bg:#0F141A; --surface:#17202A; --ink:#E6ECF2; --muted:#98A5B2; --line:#2A3542;
--sign:#2C63A8; --sign-ink:#FFFFFF; --lane:#F2C230; --road:#0A0E12; --road-ink:#F3F5F7;
--ok:#5CCB8D; --ok-bg:#15301F; --bad:#F28C74; --bad-bg:#3A1C16;
--tip-bg:#2D2610; --tip-ink:#F2D27A; --mark-ok:#2FA463; --mark-bad:#D9553B;
--eq-bg:#111922; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--lane);outline-offset:2px}
.plate{background:var(--sign);color:var(--sign-ink);border-radius:12px;padding:6px}
.plate-inner{border:2px solid var(--sign-ink);border-radius:8px;padding:14px 18px 16px;display:flex;flex-direction:column;gap:2px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.plate h1{font-family:var(--f-display);font-weight:700;font-size:clamp(38px,9vw,52px);line-height:1;margin:6px 0 0;letter-spacing:.01em;text-wrap:balance}
.plate p{margin:4px 0 0;font-size:17px;opacity:.95}
.road{background:var(--road);color:var(--road-ink);border-radius:10px;padding:10px 10px 12px;position:relative;overflow:hidden}
.road-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.85;margin-bottom:6px}
.lane{position:relative;height:26px}
.lane::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;transform:translateY(-50%);background:repeating-linear-gradient(90deg,var(--lane) 0 14px,transparent 14px 26px);opacity:.9}
.car{position:absolute;top:50%;transform:translate(-50%,-50%);transition:left .5s ease;width:34px;height:20px}
.marks{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:6px}
.mk{height:32px;border-radius:5px;border:1.5px solid rgba(243,245,247,.35);background:transparent;color:var(--road-ink);font-family:var(--f-mono);font-size:13px;font-weight:600;padding:0;min-width:0}
.mk.ok{background:var(--mark-ok);border-color:var(--mark-ok)}
.mk.bad{background:var(--mark-bad);border-color:var(--mark-bad)}
.mk.cur{outline:2.5px solid var(--lane);outline-offset:1px}
.tools{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.tools summary{padding:14px 18px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
.tools summary::-webkit-details-marker{display:none}
.tools summary .chev{font-family:var(--f-mono);color:var(--muted);transition:transform .2s}
.tools[open] summary .chev{transform:rotate(90deg)}
.tools-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px;padding:0 18px 18px}
.tool{background:var(--eq-bg);border-radius:8px;padding:12px 14px;min-width:0}
.tool h4{margin:0 0 6px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tool div{font-size:16px;line-height:1.9}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qnum{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1}
.qnum span{color:var(--muted);font-weight:600}
.src{font-family:var(--f-mono);font-size:12.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.stmt{margin:0;font-size:18px;line-height:1.6}
.opts{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--sign)}
.opt:disabled{cursor:default}
.letter{flex:none;width:30px;height:30px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:14px;background:var(--eq-bg);color:var(--ink)}
.opt.is-correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.is-correct .letter{background:var(--ok);color:var(--surface)}
.opt.is-wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.is-wrong .letter{background:var(--bad);color:var(--surface)}
.opt.is-dim{opacity:.55}
.opt .tag{margin-left:auto;font-size:13px;font-weight:700;white-space:nowrap}
.opt.is-correct .tag{color:var(--ok)}
.opt.is-wrong .tag{color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border-radius:9px;padding:11px 18px;font-weight:700;border:1.5px solid var(--line);background:var(--surface)}
.btn:hover{border-color:var(--sign)}
.btn.primary{background:var(--sign);color:var(--sign-ink);border-color:var(--sign)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding-inline:8px;text-decoration:underline;text-underline-offset:3px}
.spacer{flex:1}
.tip{background:var(--tip-bg);color:var(--tip-ink);border-radius:10px;padding:12px 16px;font-size:16px}
.tip b{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:2px}
.feedback{border-radius:10px;padding:12px 16px;font-weight:700;display:flex;gap:10px;align-items:center}
.feedback.good{background:var(--ok-bg);color:var(--ok)}
.feedback.bad{background:var(--bad-bg);color:var(--bad)}
.feedback .ico{font-family:var(--f-mono);font-size:18px}
.sol{border-top:2px dashed var(--line);padding-top:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sol h3{font-family:var(--f-display);font-size:28px;margin:0;line-height:1}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:st}
.step{display:grid;grid-template-columns:30px 1fr;gap:12px;counter-increment:st;min-width:0}
.step::before{content:counter(st);width:30px;height:30px;border-radius:50%;background:var(--sign);color:var(--sign-ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:14px}
.step-body{min-width:0}
.step-label{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:4px 0 4px}
.step-body p{margin:0 0 8px}
.step-body p:last-child{margin-bottom:0}
.step-body ul{margin:0;padding-left:20px}
.eq{background:var(--eq-bg);border-radius:8px;padding:10px 14px;margin:8px 0;overflow-x:auto;white-space:nowrap;font-size:17px;line-height:2.3;font-variant-numeric:tabular-nums}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.25;margin:0 .15em}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .3em 1px}
.frac>span:last-child{padding:2px .3em 0}
.hl{background:var(--tip-bg);color:var(--tip-ink);padding:0 .25em;border-radius:3px;font-weight:700}
.answer{display:flex;align-items:center;gap:12px;background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:12px 16px;font-weight:700}
.answer .letter{background:var(--ok);color:var(--surface)}
.alt{border:1.5px solid var(--line);border-radius:10px;padding:12px 16px;font-size:16px}
.alt b.lbl,.warn b.lbl{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:4px}
.alt b.lbl{color:var(--sign)}
.warn{background:var(--bad-bg);border-radius:10px;padding:12px 16px;font-size:16px}
.warn b.lbl{color:var(--bad)}
.tblwrap{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px;min-width:100%}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:center;white-space:nowrap}
th{background:var(--eq-bg);font-weight:700}
td.meet{background:var(--ok-bg);color:var(--ok);font-weight:700}
.intro p{margin:0}
.intro ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.score{font-family:var(--f-display);font-size:72px;line-height:.9;font-weight:700}
.score span{color:var(--muted);font-size:40px}
.reslist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px}
.res{display:flex;align-items:center;gap:8px;width:100%;border:1.5px solid var(--line);border-radius:9px;padding:9px 12px;background:var(--surface);text-align:left}
.res:hover{border-color:var(--sign)}
.res .st{margin-left:auto;font-family:var(--f-mono);font-weight:600;font-size:13px}
.res.ok .st{color:var(--ok)} .res.bad .st{color:var(--bad)} .res.none .st{color:var(--muted)}
.small{font-size:14px;color:var(--muted)}
@media (max-width:480px){
body{font-size:16px}
.card{padding:18px 16px}
.stmt{font-size:17px}
.mk{font-size:11.5px;height:30px}
.marks{gap:3px}
}
@media (prefers-reduced-motion: reduce){ .car,.tools summary .chev{transition:none} }
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12.5px;letter-spacing:.04em;color:var(--muted)}
.crumbs button{background:none;border:0;padding:4px 2px;color:var(--sign);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.crumbs .sep{opacity:.6}
.crumbs .here{color:var(--ink);font-weight:600}
.sect-label{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
.cards{display:flex;flex-direction:column;gap:12px}
.tile{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--sign)}
.tile:active{transform:scale(.99)}
.tile .ico{width:52px;height:52px;border-radius:10px;background:var(--sign);color:var(--sign-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px;border:2px solid var(--sign-ink);outline:3px solid var(--sign)}
.tile .ico.lane{background:var(--road);color:var(--lane);outline-color:var(--road);border-color:var(--lane);font-family:var(--f-mono);font-size:16px}
.tile .tt{display:block;margin:0;font-family:var(--f-display);font-size:24px;line-height:1.05}
.tile .ds{display:block;margin:4px 0 0;font-size:15px;color:var(--muted);line-height:1.4}
.tile .go{font-family:var(--f-mono);font-weight:600;color:var(--sign);font-size:20px}
.tile .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-family:var(--f-mono);font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.note{font-size:14.5px;color:var(--muted);margin:0}
@media (max-width:480px){.tile{grid-template-columns:44px 1fr auto;padding:14px}.tile .ico{width:44px;height:44px;font-size:20px}.tile .tt{display:block;font-size:21px}}
:root{--lvi-bg:#E1EAF6;--lvi-ink:#1D4E89;--lva-bg:#2A3037;--lva-ink:#F2B705;--plot2:#B4540A;--lvb-line:#F2B705;--lvi-line:#8DB6EA;--lva-line:#F3F5F7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--lvi-bg:#1A2B44;--lvi-ink:#9CC0EE;--lva-bg:#0A0E12;--lva-ink:#F2C230;--plot2:#F2A65A}}
:root[data-theme="dark"]{--lvi-bg:#1A2B44;--lvi-ink:#9CC0EE;--lva-bg:#0A0E12;--lva-ink:#F2C230;--plot2:#F2A65A}
.lvl{font-family:var(--f-mono);font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;letter-spacing:.02em}
.lvl-b{background:var(--tip-bg);color:var(--tip-ink)}
.lvl-i{background:var(--lvi-bg);color:var(--lvi-ink)}
.lvl-a{background:var(--lva-bg);color:var(--lva-ink);box-shadow:inset 0 0 0 1px var(--lva-ink)}
.lvrow{display:grid;gap:4px;margin-top:6px}
.lvrow span{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;text-align:center;padding-top:4px;border-top:2px solid;color:var(--road-ink);opacity:.85;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv-b{border-color:var(--lvb-line)}.lv-i{border-color:var(--lvi-line)}.lv-a{border-color:var(--lva-line)}
.stmt{display:block}
.stmt>.fig,.stmt>.tblwrap{margin:12px 0}
.fig{margin:4px 0 0;background:var(--eq-bg);border-radius:10px;padding:10px 8px 6px;max-width:400px;width:100%}
.plot{display:block;width:100%;height:auto}
.plot .pt{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.plot .pt-strong{fill:var(--ink);font-weight:600}
.plot .pt-lab{font-size:14px;font-weight:600}
.plot .pt-car{fill:#FFFFFF;font-size:12px;font-weight:600}
.step-body .fig{margin:8px 0}
.fld{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px}
.fld input,.fld select{font:inherit;font-weight:400;font-size:17px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%}
.fld input:focus,.fld select:focus{outline:3px solid var(--lane);outline-offset:1px;border-color:var(--sign)}
#loginErro{color:var(--bad);min-height:1em;margin:0}
.fld-dica{font-weight:400;color:var(--muted);font-size:13.5px}
.emailbox{display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.emailbox:focus-within{outline:3px solid var(--lane);outline-offset:1px;border-color:var(--sign)}
.fld .emailbox input{border:0;border-radius:0;outline:none}
.fld .emailbox input:focus{outline:none}
.emailbox .dom{font-size:14px;font-weight:700;color:var(--muted);background:var(--eq-bg);padding:9px 14px;border-top:1px solid var(--line);overflow-wrap:anywhere}
.note b{overflow-wrap:anywhere}
/* ===== 3ª série CIB: identidade por tema ===== */
:root{--sign:#123E8C;--ray:#B85C00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sign:#2552A8;--ray:#FFC24A}}
:root[data-theme="dark"]{--sign:#2552A8;--ray:#FFC24A}
.th-enem, :root.th-enem{--sign:#123E8C;--lane:#8FC1FF;--road:#0B1B3A;--road-ink:#EEF3FB;--lvb-line:#8FC1FF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]).th-enem, :root:not([data-theme="light"]) .th-enem{--sign:#2552A8;--road:#060F22}}
:root[data-theme="dark"].th-enem, :root[data-theme="dark"] .th-enem{--sign:#2552A8;--road:#060F22}
.th-inducao, :root.th-inducao{--sign:#8F4618;--lane:#F2B00A;--road:#23170F;--road-ink:#F8EFE6;--lvb-line:#F2B00A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]).th-inducao, :root:not([data-theme="light"]) .th-inducao{--sign:#A9561F;--road:#140C07}}
:root[data-theme="dark"].th-inducao, :root[data-theme="dark"] .th-inducao{--sign:#A9561F;--road:#140C07}
.th-form, :root.th-form{--sign:#1F4E5F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]).th-form, :root:not([data-theme="light"]) .th-form{--sign:#2B6A80}}
:root[data-theme="dark"].th-form, :root[data-theme="dark"] .th-form{--sign:#2B6A80}
.plate{position:relative;overflow:hidden}
.plate-inner{position:relative;z-index:1}
.plate-deco{position:absolute;right:10px;bottom:8px;width:min(44%,220px);color:var(--sign-ink);opacity:.32;pointer-events:none}
.plate-deco svg{display:block;width:100%;height:auto}
.th-inducao .plate-deco{opacity:.5}
/* Trilhas de progresso: onda numa corda e raio de luz */
.lane2{position:relative;height:30px;margin:0 6px 0 22px;--p:0}
.lane2 svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lane2 .ln-base line{stroke:var(--road-ink);stroke-width:2;opacity:.3;vector-effect:non-scaling-stroke}
.ln-raio .ln-base line{stroke-dasharray:4 6}
.lane2 .ln-fill{clip-path:inset(0 100% 0 0);transition:clip-path .6s ease}
.ln-onda .ln-fill path{fill:none;stroke:var(--lane);stroke-width:3;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.ln-raio .ln-fill line{stroke:var(--lane);stroke-width:4;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 3px var(--lane))}
.ln-head{position:absolute;top:50%;left:calc(var(--p) * 1%);transition:left .6s ease}
.ln-onda .ln-head{width:12px;height:12px;border-radius:50%;background:var(--lane);transform:translate(-50%,-50%);box-shadow:0 0 0 4px rgba(255,255,255,.12)}
.ln-raio .ln-head{width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:12px solid var(--lane);transform:translate(-30%,-50%)}
.ln-src{position:absolute;left:-18px;top:50%;transform:translateY(-50%)}
.ln-onda .ln-src{width:4px;height:24px;border-radius:2px;background:var(--road-ink);opacity:.7}
.ln-raio .ln-src{width:12px;height:12px;border-radius:50%;background:var(--lane);box-shadow:0 0 8px 2px var(--lane)}
@media (prefers-reduced-motion: reduce){.lane2 .ln-fill,.ln-head{transition:none}}
/* Revisão do professor */
.mod{border:1.5px dashed var(--muted);border-radius:10px;padding:10px 14px;font-size:15px;color:var(--muted)}
.mod b{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:2px;color:var(--ink)}
.tbl-txt td,.tbl-txt th{white-space:normal}
.tbl-txt table{min-width:0;width:100%}
.tbl-esq td:last-child{text-align:left}

@media (max-width:480px){.tbl-txt table{font-size:13.5px}.tbl-txt td,.tbl-txt th{padding:6px 7px}}

/* Nível Básico+ */
:root{--lvbp-bg:#FDEECD;--lvbp-ink:#7D5200;--lvbp-line:#F7C97A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--lvbp-bg:#33270C;--lvbp-ink:#F5C566}}
:root[data-theme="dark"]{--lvbp-bg:#33270C;--lvbp-ink:#F5C566}

/* Figuras com fundo claro (imagens e esquemas coloridos), legíveis também no tema escuro */
.fig.figw{background:#FFFFFF;border:1px solid var(--line);padding:8px;margin-left:auto;margin-right:auto}

.erros{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}

/* Tabelas das listas de indução */
.dtab{width:auto;min-width:0;margin:0 auto}
/* Formulário */
.formnav{gap:10px}

.tile.th-form .ico{background:var(--sign);outline-color:var(--sign);font-style:italic;font-family:Georgia,serif}
/* Contas longas quebram a linha no celular, em vez de ficarem escondidas */
.eq{white-space:normal;overflow-wrap:anywhere}
/* ===== Identidade de cada lista do ENEM ===== */
.th-eletr, :root.th-eletr{--sign:#4C2A85;--lane:#FFD43B;--road:#160D2B;--road-ink:#EEF2FF;--lvb-line:#FFD43B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]).th-eletr, :root:not([data-theme="light"]) .th-eletr{--sign:#6440A6;--road:#0C0718}}

.th-calor, :root.th-calor{--sign:#A9381A;--lane:#FF9F40;--road:#2A120B;--road-ink:#FFF1EA;--lvb-line:#FF9F40}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]).th-calor, :root:not([data-theme="light"]) .th-calor{--sign:#C24A26;--road:#180A06}}

/* Trilha "circuito": a corrente percorre o fio e acende a lâmpada */
.ln-circ{margin-right:30px}
.ln-circ .ln-base line{stroke-dasharray:none;opacity:.35}
.ln-circ .ln-fill line{stroke:var(--lane);stroke-width:3.5;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 3px var(--lane))}
.ln-circ .ln-head{width:8px;height:8px;border-radius:50%;background:#FFFFFF;transform:translate(-50%,-50%);box-shadow:0 0 6px 2px var(--lane)}
.ln-circ .ln-src{width:12px;height:20px;left:-20px;border-left:3px solid var(--road-ink);border-right:3px solid var(--road-ink);opacity:.8;transform:translateY(-50%) scaleX(.6)}
.ln-lamp{position:absolute;right:-26px;top:50%;width:20px;height:20px;border-radius:50%;border:2px solid var(--road-ink);transform:translateY(-50%);opacity:.9}
.ln-lamp i{position:absolute;inset:2px;border-radius:50%;background:var(--lane);opacity:calc(var(--p) / 100);box-shadow:0 0 12px 4px var(--lane);transition:opacity .6s ease}
/* Trilha "espectro": a onda passa do infravermelho ao violeta */
.ln-esp .ln-fill path{stroke:url(#gEsp);stroke-width:3}
.ln-esp .ln-head{background:#FFFFFF}
.ln-esp .ln-src{background:var(--lane)}
@media (prefers-reduced-motion: reduce){.ln-lamp i{transition:none}}
/* Trilha "bloco": uma força empurra o bloco pela superfície */
.ln-bloco .ln-base line{stroke:var(--road-ink);stroke-width:2;opacity:.35;vector-effect:non-scaling-stroke}

.ln-bloco .ln-head::after{content:"";position:absolute;left:21px;top:6px;width:12px;height:2.5px;background:var(--road-ink)}
.ln-bloco .ln-head::before{content:"";position:absolute;left:31px;top:2.5px;border-top:4.75px solid transparent;border-bottom:4.75px solid transparent;border-left:7px solid var(--road-ink)}
.ln-bloco{margin-right:30px}
.ln-bloco .ln-src{width:4px;height:22px;left:-12px;top:13px;transform:translateY(-50%);background:repeating-linear-gradient(180deg,var(--road-ink) 0 2px,transparent 2px 5px);opacity:.6}
/* Formulário: essenciais em destaque; complementares recolhidas e mais discretas */
:root{--main-bg:#E3ECFA;--main-line:#123E8C;--extra-line:#9AA7B6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--main-bg:#14254A;--main-line:#6F9BE8;--extra-line:#4A5868}}

/* ===== Mini calculadora flutuante ===== */
body.com-calc .wrap{padding-bottom:96px}
.calc-fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:60;width:54px;height:54px;border-radius:50%;border:2px solid var(--sign-ink);background:var(--sign);color:var(--sign-ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer;padding:0}
.calc-fab svg{width:26px;height:26px}
.calc-fab.on{background:var(--lane);color:#141B22;border-color:var(--lane)}
.calc-fab:focus-visible{outline:3px solid var(--lane);outline-offset:3px}
.calc{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(max(16px,env(safe-area-inset-bottom,0px)) + 66px);z-index:60;width:min(272px,calc(100vw - 32px));background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.30);padding:10px;font-family:var(--f-body)}
.calc-top{display:flex;align-items:center;justify-content:space-between;padding:0 2px 6px}
.calc-tit{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.calc-x{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;width:32px;height:32px;border-radius:8px;cursor:pointer}
.calc-x:hover{background:var(--eq-bg);color:var(--ink)}
.calc-tela{background:var(--eq-bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:right;margin-bottom:8px;min-height:62px;display:flex;flex-direction:column;justify-content:flex-end}
.calc-exp{font-family:var(--f-mono);font-size:19px;font-weight:600;word-break:break-all;line-height:1.3}
.calc-exp.calc-final{font-size:24px;color:var(--sign)}
.calc-res{font-family:var(--f-mono);font-size:14px;color:var(--muted);min-height:18px}
.calc-teclas{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc-teclas button{height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--f-mono);font-size:19px;font-weight:600;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.calc-teclas button:active{transform:scale(.96)}

.calc-teclas .k-eq{grid-row:span 2;height:auto;background:var(--sign);color:var(--sign-ink);border-color:var(--sign)}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .calc-exp.calc-final{color:var(--lane)}}
@media print{.calc,.calc-fab{display:none!important}}

/* ===== Formulário: fórmula nunca quebra no meio; legenda dos símbolos ===== */

<body>
<div class="wrap">
<header class="plate"><div class="plate-deco" id="deco" aria-hidden="true"></div><div class="plate-inner"><div class="eyebrow" id="eyebrow"></div><h1 id="ptitle"></h1><p id="psub"></p></div></header>
<nav class="crumbs" id="crumbs" aria-label="Você está em" hidden></nav>
<main id="view" style="display:flex;flex-direction:column;gap:18px"></main>
</div>
<script>
/* ===== Ajudantes usados em todas as listas ===== */
const f = (n, d) => `<span class="frac"><span>${n}</span><span>${d}</span></span>`;
const L = ['A','B','C','D','E'];
const nf = v => String(v).replace('.', ',');
let _uid = 0;

/* Figura SVG genérica (segue o tema claro/escuro). vb = "0 0 L A" */
const fig = (vb, aria, inner, w) => `<figure class="fig"${w ? ` style="max-width:${w}px"` : ''}><svg viewBox="${vb}" class="plot" role="img" aria-label="${aria}">${inner}</svg></figure>`;
/* Ponta de seta: devolve [defs, url] com id único */
function seta(cor){ const id = 'sa' + (++_uid); return [`<defs><marker id="${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="${cor}"/></marker></defs>`, `url(#${id})`]; }

/* Pontos de uma senoide: y = A·sen(2π(x − x0)/λ + fase) */
function sen(A, lam, xa, xb, fase, n){ n = n || 120; fase = fase || 0; const p = []; for (let k = 0; k <= n; k++){ const x = xa + (xb - xa) * k / n; p.push([+x.toFixed(4), +(A * Math.sin(2 * Math.PI * x / lam + fase)).toFixed(4)]); } return p; }

/* Gráfico cartesiano. o = {aria, xmin, xmax, ymin, ymax, xt, yt, xl, yl, L:[{p, c, dash, w, lab, lp}], pts, ann:[[x,y,txt,anchor,cor]], dims:[[x1,y1,x2,y2,txt,dx,dy]], H, W} */
function plot(o){
  const W = o.W || 340, H = o.H || 236, l = o.l || 46, r = 18, t = 28, b = 40;
  const x0 = o.xmin || 0, y0 = o.ymin || 0;
  const sx = x => +(l + (x - x0) / (o.xmax - x0) * (W - l - r)).toFixed(1);
  const sy = y => +(H - b - (y - y0) / (o.ymax - y0) * (H - t - b)).toFixed(1);
  const [defs, mk] = seta('var(--ink)');
  let s = `<svg viewBox="0 0 ${W} ${H}" class="plot" role="img" aria-label="${o.aria}">${defs}`;
  (o.xt || []).forEach(x => { s += `<line x1="${sx(x)}" y1="${sy(y0)}" x2="${sx(x)}" y2="${sy(o.ymax)}" stroke="var(--line)"/>`; if (!o.noxl) s += `<text x="${sx(x)}" y="${sy(y0)+16}" text-anchor="middle" class="pt">${nf(x)}</text>`; });
  (o.yt || []).forEach(y => { s += `<line x1="${sx(x0)}" y1="${sy(y)}" x2="${sx(o.xmax)}" y2="${sy(y)}" stroke="var(--line)"/><text x="${sx(x0)-7}" y="${sy(y)+4}" text-anchor="end" class="pt">${nf(y)}</text>`; });
  const yax = (y0 < 0 && o.ymax > 0) ? 0 : y0;
  s += `<line x1="${sx(x0)}" y1="${sy(yax)}" x2="${sx(o.xmax)}" y2="${sy(yax)}" stroke="var(--muted)" stroke-width="1.5"/><line x1="${sx(x0)}" y1="${sy(y0)}" x2="${sx(x0)}" y2="${sy(o.ymax)}" stroke="var(--muted)" stroke-width="1.5"/>`;
  s += `<text x="${W-r}" y="${H-6}" text-anchor="end" class="pt">${o.xl}</text><text x="${sx(x0)}" y="16" text-anchor="middle" class="pt">${o.yl}</text>`;
  o.L.forEach(ln => {
    s += `<polyline points="${ln.p.map(([x,y]) => sx(x)+','+sy(y)).join(' ')}" fill="none" stroke="${ln.c}" stroke-width="${ln.w || 3}" stroke-linecap="round" stroke-linejoin="round"${ln.dash ? ` stroke-dasharray="${ln.dash}"` : ''}/>`;
    if (ln.lab){ const [x, y] = ln.lp || ln.p[ln.p.length-1]; s += `<text x="${sx(x)}" y="${sy(y)}" class="pt pt-lab" fill="${ln.c}">${ln.lab}</text>`; }
  });
  (o.dims || []).forEach(([xa, ya, xb, yb, txt, dx, dy]) => {
    s += `<line x1="${sx(xa)}" y1="${sy(ya)}" x2="${sx(xb)}" y2="${sy(yb)}" stroke="var(--ink)" stroke-width="1.4" marker-start="${mk}" marker-end="${mk}"/>`;
    if (txt) s += `<text x="${(sx(xa)+sx(xb))/2 + (dx||0)}" y="${(sy(ya)+sy(yb))/2 + (dy||-6)}" text-anchor="middle" class="pt pt-strong">${txt}</text>`;
  });
  (o.pts || []).forEach(([x, y]) => { s += `<circle cx="${sx(x)}" cy="${sy(y)}" r="4.5" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/>`; });
  (o.ann || []).forEach(([x, y, txt, a, c]) => { s += `<text x="${sx(x)}" y="${sy(y)}" text-anchor="${a || 'middle'}" class="pt pt-strong"${c ? ` fill="${c}"` : ''}>${txt}</text>`; });
  return `<figure class="fig">${s}</svg></figure>`;
}

/* Tabela simples: cab = [..], linhas = [[..],[..]] */
const tabela = (cab, linhas, esq) => `<div class="tblwrap tbl-txt${esq ? ' tbl-esq' : ''}"><table>${cab ? `<tr>${cab.map(c => `<th>${c}</th>`).join('')}</tr>` : ''}${linhas.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;

/* ===== Revisão ENEM · lista impressa (3 listas de 10, por área) ===== */
/* Figura em imagem (pasta img/) com fundo claro, legível nos dois temas */
const foto = (n, aria, w) => `<figure class="fig figw"${w ? ` style="max-width:${w}px"` : ''}><img src="img/${n}.png" alt="${aria}" loading="lazy"></figure>`;
/* Pegadinha: de onde vem cada alternativa errada (gabarito comentado do professor) */
const erros = linhas => `De onde vem cada alternativa errada:<ul class="erros">${linhas.map(([a, t]) => `<li><b>${a}</b> ${t}</li>`).join('')}</ul>`;
const src = n => `Lista impressa · Q${String(n).padStart(2, '0')}`;

/* ---------- Lista 1 · Eletricidade e energia ---------- */
const TOOLS_E1 = [
  ['Leis de Ohm', `U = R · i<br>R = ρ · ${f('L','A')}`],
  ['Potência e energia', `P = U · i = R · i² = ${f('U²','R')}<br>E = P · Δt (kWh: P em kW, Δt em h)`],
  ['Associação de resistores', `Série: R<sub>eq</sub> = R₁ + R₂ + …<br>Paralelo: ${f('1','R<sub>eq</sub>')} = ${f('1','R₁')} + ${f('1','R₂')} + …`],
  ['Transformador ideal', `${f('U₁','U₂')} = ${f('N₁','N₂')} = ${f('i₂','i₁')}`],

{ src: src(3), nivel: 'intermediário',
  text: `<p>A corrente elétrica que atravessa o corpo humano depende da tensão aplicada e da resistência elétrica do corpo, que diminui muito quando a pele está molhada. O quadro relaciona a intensidade da corrente aos danos físicos.</p>
${tabela(['Corrente elétrica','Dano físico'],[['Até 10 mA','Dor e contração muscular'],['De 10 mA até 20 mA','Aumento das contrações musculares'],['De 20 mA até 100 mA','Parada respiratória'],['De 100 mA até 3 A','Fibrilação ventricular'],['Acima de 3 A','Parada cardíaca e queimaduras']], true)}

<p>Um técnico, com as mãos molhadas, toca ao mesmo tempo os terminais extremos de um conjunto de baterias de 9 V associadas em série. Considere que, com a pele molhada, a resistência elétrica do corpo entre as mãos seja de 1 kΩ. Qual é o número mínimo de baterias para que o choque já possa provocar parada respiratória?</p>`,

  steps: [['Limite', '<p>A parada respiratória começa em 20 mA = 0,020 A.</p>'],
          ['Tensão mínima', '<div class="eq">U = R · i = 1 000 × 0,020 = 20 V</div>'],

  text: '<p>A resistência de um chuveiro é um fio metálico enrolado em espiral, com três terminais. Na posição verão, a corrente percorre o fio inteiro, cuja resistência é 22 Ω. Na posição inverno, a corrente percorre apenas metade do comprimento do mesmo fio. O chuveiro é ligado em 220 V. Qual é a potência do chuveiro na posição inverno?</p>',

{ src: src(8), nivel: 'intermediário',
  text: `<p>Em uma aula experimental de calorimetria, um professor queimou completamente 2,0 g de amendoim para aquecer 200 g de água, em um recipiente que reduz as perdas de calor. A embalagem do amendoim traz a informação nutricional abaixo.</p>
${tabela(['Porção','Valor energético'],[['20 g','120 kcal']])}
<p>Ao medir a temperatura da água no fim do experimento, ele concluiu que apenas 40% da energia do alimento foi aproveitada no aquecimento. O calor específico da água é 1 cal/(g·°C), e sua temperatura inicial era 20 °C. Qual foi a temperatura final da água?</p>`,
  opts: ['24 °C','44 °C','56 °C','60 °C','80 °C'], ans: 1,
  hint: 'Descubra a energia de 2,0 g de amendoim em calorias, aplique os 40% e use Q = m · c · ΔT. A pergunta é a temperatura final, não a variação.',
  steps: [['Energia do amendoim', '<p>120 kcal/20 g = 6 kcal/g. Em 2,0 g: 12 kcal = 12 000 cal.</p>'],
          ['Energia aproveitada', '<div class="eq">0,40 × 12 000 = 4 800 cal</div>'],
          ['Aquecimento', '<div class="eq">4 800 = 200 × 1 × ΔT → ΔT = 24 °C</div><p>Temperatura final: 20 + 24 = <b>44 °C</b>.</p>']],
  alt: 'Sem perdas, os 12 000 cal aqueceriam a água em 60 °C. Como só 40% foram aproveitados: 0,4 × 60 = 24 °C de aumento, de 20 °C para 44 °C.',
  warn: erros([['A) 24 °C:','responde a variação, não a temperatura final.'],['C) 56 °C:','usa os 60% perdidos no lugar dos 40% aproveitados.'],['D) 60 °C:','ignora o rendimento e dá só a variação.'],['E) 80 °C:','ignora o rendimento (100% aproveitado).']]) },

{ src: src(11), nivel: 'intermediário',
  text: '<p>Rótulos de aerossóis trazem o aviso: não perfure nem exponha ao calor. Considere uma lata fechada, de volume constante, com gás a 3,0 atm e 27 °C, deixada perto de uma churrasqueira, onde atinge 127 °C. Tratando o conteúdo como gás ideal, a pressão interna passa a ser</p>',
  opts: ['0,64 atm.','2,25 atm.','3,0 atm.','4,0 atm.','14 atm.'], ans: 3,
  hint: 'Com volume constante, p/T é constante, com T em kelvin.',
  steps: [['Temperaturas em kelvin', '<p>27 °C = 300 K e 127 °C = 400 K.</p>'],
          ['Lei dos gases', `<div class="eq">${f('p₁','T₁')} = ${f('p₂','T₂')} → p₂ = 3,0 × ${f('400','300')} = 4,0 atm</div>`]],
  alt: 'A temperatura absoluta aumentou 1/3 (de 300 K para 400 K); a pressão aumenta na mesma proporção: 3,0 + 1,0 = 4,0 atm.',
  warn: erros([['A) 0,64 atm:','usa Celsius e inverte a proporção (3 × 27/127).'],['B) 2,25 atm:','inverte a proporção (3 × 300/400).'],['C) 3,0 atm:','acha que a pressão não muda com volume constante.'],['E) 14 atm:','usa temperaturas em Celsius (3 × 127/27).']]) },

{ src: src(15), nivel: 'intermediário',
  text: `<p>Em um instrumento de cordas, a parte vibrante de uma corda mede 50 cm e, tocada solta, emite a nota lá de 440 Hz no modo fundamental, ilustrado na figura. O músico então pressiona a corda contra o braço do instrumento, reduzindo o comprimento vibrante para 40 cm, sem alterar a tensão.</p>
${foto('q15', 'Corda vibrando no modo fundamental: um único ventre entre dois nós, nas extremidades, separados por L = 50 cm.', 380)}
<p>A nova frequência fundamental emitida pela corda é</p>`,
  opts: ['352 Hz.','440 Hz.','550 Hz.','687,5 Hz.','880 Hz.'], ans: 2,
  hint: 'Mesma corda e mesma tensão: a velocidade da onda não muda. No modo fundamental, λ = 2L.',
  steps: [['Velocidade na corda', '<div class="eq">λ = 2 × 0,50 = 1,0 m → v = 1,0 × 440 = 440 m/s</div>'],
          ['Novo comprimento de onda', '<div class="eq">λ′ = 2 × 0,40 = 0,80 m</div>'],
          ['Nova frequência', `<div class="eq">f′ = ${f('v','λ′')} = ${f('440','0,80')} = 550 Hz</div>`]],
  alt: 'Com v fixa, f é inversamente proporcional a L: f′ = 440 × 50/40 = 550 Hz. Corda mais curta, som mais agudo, como ao apertar uma casa do violão.',
  warn: erros([['A) 352 Hz:','acha que f é proporcional a L (440 × 40/50).'],['B) 440 Hz:','acha que a frequência depende só da corda, não do comprimento.'],['D) 687,5 Hz:','acha que f é proporcional a 1/L².'],['E) 880 Hz:','confunde com o segundo harmônico (dobro da frequência).']]) },

{ src: src(21), nivel: 'intermediário',
  text: `<p>Discos ópticos guardam dados em cavidades microscópicas, lidas por um laser. Quanto menores as cavidades, mais dados cabem na mesma área do disco. O fator limitante é o espalhamento da luz por difração, que se torna importante quando as cavidades têm dimensões da ordem do comprimento de onda do laser. Por isso, cada nova geração de disco passou a usar lasers de comprimento de onda menor.</p>
${tabela(['Tecnologia','Comprimento de onda do laser'],[['CD','780 nm'],['DVD','650 nm'],['Blu-ray','405 nm']])}
<p>Considere c = 3,0 × 10⁸ m/s. A tecnologia que permite armazenar mais dados na mesma área e a frequência aproximada de seu laser são</p>`,
  opts: ['CD; 3,8 × 10¹⁴ Hz.','DVD; 4,6 × 10¹⁴ Hz.','Blu-ray; 7,4 × 10¹⁴ Hz.','Blu-ray; 1,35 × 10⁻¹⁵ Hz.','CD; 7,4 × 10¹⁴ Hz.'], ans: 2,
  hint: 'Menor λ permite cavidades menores. Depois use c = λ · f, com λ em metros (1 nm = 10⁻⁹ m).',
  steps: [['Tecnologia', '<p>Menor comprimento de onda, cavidades menores, mais dados: <b>Blu-ray</b> (405 nm).</p>'],
          ['Frequência', `<div class="eq">f = ${f('c','λ')} = ${f('3,0 × 10⁸','405 × 10⁻⁹')} ≈ 7,4 × 10¹⁴ Hz</div>`]],
  alt: 'Frequência e comprimento de onda são inversamente proporcionais: o laser de menor λ tem, obrigatoriamente, a maior frequência. A alternativa E erra justamente ao associar a maior frequência ao CD, que tem o maior λ.',
  warn: erros([['A) CD; 3,8 × 10¹⁴ Hz:','acha que maior λ lê cavidades menores.'],['B) DVD; 4,6 × 10¹⁴ Hz:','escolhe a tecnologia intermediária.'],['D) Blu-ray; 1,35 × 10⁻¹⁵ Hz:','divide λ por c (inverte a fórmula).'],['E) CD; 7,4 × 10¹⁴ Hz:','calcula certo a frequência, mas associa ao disco errado.']]) },

{ src: src(9), nivel: 'avançado',
  text: '<p>Para preparar um chá, uma pessoa aquece em um forno de micro-ondas 400 g de água em uma caneca de vidro de 200 g. A caneca e a água estavam a 10 °C e chegaram a 60 °C após 2 min, com o forno funcionando a 1 000 W. Considere os calores específicos do vidro e da água iguais a 0,2 cal/(g·°C) e 1,0 cal/(g·°C), respectivamente, e 1 cal = 4,2 J. Que percentual da energia consumida pelo forno foi efetivamente usado no aquecimento?</p>',
  opts: ['18%','70%','77%','92%','130%'], ans: 2,
  hint: 'Some o calor recebido pela água e pela caneca, converta para joules e compare com a energia que o forno consumiu (P · Δt).',
  steps: [['Calor útil', '<p>Água: 400 × 1,0 × 50 = 20 000 cal · Caneca: 200 × 0,2 × 50 = 2 000 cal</p><div class="eq">Q = 22 000 cal = 92 400 J</div>'],
          ['Energia consumida', '<div class="eq">E = P · Δt = 1 000 × 120 = 120 000 J</div>'],
          ['Rendimento', `<div class="eq">${f('92 400','120 000')} = 0,77 = 77%</div>`]],
  alt: 'Rendimento nunca passa de 100%: um resultado como 130% denuncia a razão invertida. E calor e energia elétrica precisam estar na mesma unidade (J) antes da divisão.',
  warn: erros([['A) 18%:','não converte calorias em joules.'],['B) 70%:','esquece o calor absorvido pela caneca.'],['D) 92%:','usa ΔT = 60 °C (ignora a temperatura inicial).'],['E) 130%:','inverte a razão (total/útil).']]) },

{ src: src(10), nivel: 'avançado',
  text: `<p>Materiais de mudança de fase são usados em embalagens que mantêm refeições quentes: ao se solidificarem, liberam calor sem variar a temperatura. Para caracterizar um desses materiais, um laboratório aqueceu 200 g de uma amostra sólida, inicialmente a 20 °C, e registrou a temperatura em função do calor recebido.</p>
${foto('q10', 'Gráfico de temperatura, em graus Celsius, em função do calor recebido Q, em calorias. A temperatura sobe de 20 °C a 80 °C entre 0 e 2 400 cal, fica constante em 80 °C entre 2 400 e 6 400 cal e depois sobe até 100 °C em 8 400 cal.', 400)}
<p>O calor latente de fusão e o calor específico do material no estado sólido são, respectivamente,</p>`,
  opts: ['12 cal/g e 0,20 cal/(g·°C).','20 cal/g e 0,15 cal/(g·°C).','32 cal/g e 0,20 cal/(g·°C).','32 cal/g e 0,15 cal/(g·°C).','20 cal/g e 0,20 cal/(g·°C).'], ans: 4,
  hint: 'O patamar horizontal é a fusão: o calor recebido nele é m · L. O primeiro trecho inclinado é o sólido esquentando.',
  steps: [['Calor latente', '<p>Patamar a 80 °C, de 2 400 cal a 6 400 cal: Q = 4 000 cal.</p><div class="eq">L = 4 000/200 = 20 cal/g</div>'],
          ['Calor específico do sólido', '<p>De 20 °C a 80 °C (ΔT = 60 °C) com 2 400 cal:</p><div class="eq">2 400 = 200 × c × 60 → c = 0,20 cal/(g·°C)</div>']],
  alt: 'Em um gráfico T × Q, o calor de cada etapa é a “largura” do trecho no eixo Q, não o valor onde o trecho termina. O patamar vai de 2 400 a 6 400: largura de 4 000 cal.',
  warn: erros([['A) 12 cal/g e 0,20:','usa o trecho do sólido (2 400/200) como calor latente.'],['B) 20 cal/g e 0,15:','usa ΔT = 80 °C, lendo a temperatura a partir de zero.'],['C) 32 cal/g e 0,20:','usa 6 400 cal sem descontar o aquecimento do sólido.'],['D) 32 cal/g e 0,15:','comete os dois erros anteriores.']]) },

{ src: src(12), nivel: 'avançado',
  text: `<p>Em uma usina termelétrica, o vapor produzido na caldeira a 527 °C movimenta uma turbina ligada a um gerador. Ao sair da turbina, o vapor é condensado com água de um rio, a 27 °C, que volta mais quente ao leito, um impacto ambiental conhecido como poluição térmica. O esquema mostra o fluxo de energia a cada segundo.</p>
${foto('q12', 'Esquema: a caldeira, fonte quente a 527 °C, fornece Q1 = 1 000 MW à turbina; a turbina entrega W = 350 MW à rede elétrica e rejeita Q2, desconhecido, para o rio, fonte fria a 27 °C.', 360)}
<p>A potência térmica rejeitada para o rio e o rendimento máximo teórico (de Carnot) para essas temperaturas são, respectivamente,</p>`,
  opts: ['650 MW e 62,5%.','650 MW e 95%.','350 MW e 62,5%.','650 MW e 35%.','1 350 MW e 37,5%.'], ans: 0,
  hint: 'O calor rejeitado sai da conservação da energia. No rendimento de Carnot, as temperaturas têm de estar em kelvin.',
  steps: [['Calor rejeitado', '<div class="eq">Q₂ = Q₁ − W = 1 000 − 350 = 650 MW</div>'],
          ['Carnot', `<p>800 K e 300 K:</p><div class="eq">η = 1 − ${f('300','800')} = 0,625 = 62,5%</div>`],
          ['Coerência', '<p>O rendimento real (350/1 000 = 35%) fica abaixo do máximo teórico, como exige a segunda lei.</p>']],
  alt: 'Toda máquina térmica rejeita calor para a fonte fria. É esse calor (650 MW, quase o dobro da energia elétrica gerada) que esquenta o rio: a poluição térmica do enunciado.',
  warn: erros([['B) 650 MW e 95%:','usa Celsius no rendimento de Carnot (1 − 27/527).'],['C) 350 MW e 62,5%:','confunde o calor rejeitado com o trabalho útil.'],['D) 650 MW e 35%:','dá o rendimento real, não o máximo teórico.'],['E) 1 350 MW e 37,5%:','soma Q₁ e W e calcula T<sub>fria</sub>/T<sub>quente</sub>.']]) }
];

{ src: src(19), nivel: 'básico',
  text: `<p>Um professor lança uma esfera verticalmente para cima e a apanha de volta no ponto de lançamento. Desprezando a resistência do ar, ele pede aos alunos que analisem as grandezas cinemáticas no instante em que a esfera, já descendo, passa pela metade da altura máxima. Para isso, apresenta o quadro de possibilidades.</p>
${tabela(['Grandeza','Módulo','Sentido'],[['Velocidade (v)','nulo (v = 0) ou não nulo (v ≠ 0)','para cima ou para baixo'],['Aceleração (a)','nulo (a = 0) ou não nulo (a ≠ 0)','para cima ou para baixo']])}
<p>Grandezas com módulo nulo não têm sentido definido. A combinação correta para esse instante é</p>`,
  opts: ['v ≠ 0 para baixo e a ≠ 0 para baixo.','v ≠ 0 para baixo e a = 0.','v = 0 e a ≠ 0 para baixo, como no ponto mais alto.','v ≠ 0 para cima e a ≠ 0 para baixo.','v ≠ 0 para baixo e a ≠ 0 para cima.'], ans: 0,

{ src: src(22), nivel: 'básico',
  text: `<p>Um raio de luz monocromática passa do ar para um bloco de plástico transparente de índice de refração √2, incidindo com ângulo de 45° em relação à normal, como mostra a figura.</p>
${foto('q22', 'Raio de luz no ar incidindo na superfície de um bloco de plástico com índice de refração raiz de 2, formando 45 graus com a normal; o raio refratado está indicado com interrogação.', 300)}

{ src: src(17), nivel: 'básico',
  text: '<p>Um ciclista vai de casa até um parque, a 12 km de distância, mantendo 24 km/h. Na volta, cansado e contra o vento, faz o mesmo trajeto a 12 km/h. A velocidade escalar média do ciclista no percurso de ida e volta foi</p>',
  opts: ['12 km/h.','16 km/h.','18 km/h.','24 km/h.','36 km/h.'], ans: 1,
  hint: 'Velocidade média é a distância total dividida pelo tempo total. Calcule o tempo de cada trecho.',
  steps: [['Tempos', '<p>Ida: 12/24 = 0,5 h · Volta: 12/12 = 1,0 h</p>'],
          ['Velocidade média', `<div class="eq">v<sub>m</sub> = ${f('24 km','1,5 h')} = 16 km/h</div>`]],
  alt: 'O ciclista passa o dobro do tempo no trecho lento, por isso a média fica mais perto de 12 do que de 24. A média aritmética (18 km/h) daria o mesmo peso aos dois trechos.',
  warn: erros([['A) 12 km/h:','usa só a velocidade da volta.'],['C) 18 km/h:','faz a média aritmética das velocidades.'],['D) 24 km/h:','usa só a velocidade da ida.'],['E) 36 km/h:','soma as velocidades.']]) },

{ src: src(23), nivel: 'intermediário',
  text: '<p>Ao fazer um exame de vista, uma estudante descobriu que enxerga bem objetos próximos, mas só vê com nitidez objetos até 50 cm de distância (seu ponto remoto). A lente corretiva deve formar, de um objeto muito distante, uma imagem virtual nesse ponto remoto. O defeito da estudante e a lente indicada na receita são</p>',
  opts: ['hipermetropia, corrigida com lente convergente de +2,0 di.','miopia, corrigida com lente convergente de +2,0 di.','hipermetropia, corrigida com lente divergente de −2,0 di.','miopia, corrigida com lente divergente de −0,5 di.','miopia, corrigida com lente divergente de −2,0 di.'], ans: 4,
  hint: 'Vê bem de perto e mal de longe: qual é o defeito? Depois, a lente deve ter o foco no ponto remoto, e a vergência usa f em metros.',
  steps: [['Defeito', '<p>Ponto remoto próximo do olho (50 cm) caracteriza a <b>miopia</b>.</p>'],
          ['Lente', '<p>Para um objeto no infinito, a imagem fica no foco: foco virtual a 50 cm, f = −0,50 m (lente divergente).</p>'],
          ['Vergência', `<div class="eq">V = ${f('1','f')} = ${f('1','−0,50')} = −2,0 di</div><p>É o “−2,00 graus” da receita.</p>`]],
  alt: 'Grau negativo na receita é sempre lente divergente, a marca da miopia. O número sai de 1 dividido pelo ponto remoto em metros: 1/0,5 = 2.',
  warn: erros([['A)','confunde o defeito e o tipo de lente.'],['B)','acerta o defeito, mas usa lente convergente.'],['C)','acerta a lente, mas troca o defeito.'],['D)','responde a distância focal (0,5 m) no lugar da vergência.']]) },

{ src: src(24), nivel: 'intermediário',
  text: `<p>Em um dia sem vento, um paraquedista salta de um avião e cai verticalmente até atingir uma velocidade limite. No instante t₁, ele abre o paraquedas, e sua velocidade de queda diminui até o instante t₂, a partir do qual passa a cair com uma nova velocidade constante, bem menor, que permite um pouso seguro. O gráfico representa a velocidade de queda ao longo do tempo.</p>
${foto('q24', 'Gráfico da velocidade de queda em função do tempo: a velocidade cresce e se estabiliza; em t1 cai rapidamente e, a partir de t2, fica constante em um valor bem menor.', 400)}
<p>Entre os instantes t₁ e t₂, a força de resistência do ar sobre o conjunto paraquedista + paraquedas é</p>`,
  opts: ['maior que o peso, com resultante para cima.','menor que o peso, com resultante para baixo.','igual ao peso, com resultante nula.','maior que o peso, com resultante para baixo.','menor que o peso, com resultante para cima.'], ans: 0,
  hint: 'Entre t₁ e t₂ o conjunto continua descendo, mas cada vez mais devagar. Para que lado aponta a aceleração?',
  steps: [['Aceleração', '<p>A velocidade de queda diminui: a aceleração aponta <b>para cima</b>.</p>'],
          ['Segunda lei de Newton', '<p>A resultante tem o sentido da aceleração. Resultante para cima: a resistência do ar é <b>maior que o peso</b>.</p>'],
          ['Comparação', '<p>Nos trechos de velocidade constante (velocidade limite), a resistência do ar se iguala ao peso e a resultante é nula.</p>']],
  alt: 'É como numa freada de carro: o carro ainda anda para a frente, mas a força resultante aponta para trás. Aqui, o paraquedista ainda desce, mas a resultante aponta para cima.',
  warn: erros([['B)','acha que, se ainda desce, a resultante aponta para baixo.'],['C)','confunde o trecho de frenagem com o de velocidade constante.'],['D)','associa a resultante ao sentido do movimento.'],['E)','combinação impossível: com resistência menor que o peso, a resultante seria para baixo.']]) },

{ src: src(25), nivel: 'intermediário',
  text: '<p>Um carro trafega a 72 km/h por uma pista horizontal quando o motorista freia bruscamente e as rodas travam. Nesse caso, a força que faz o carro parar é o atrito cinético entre os pneus e o asfalto. Com a pista seca, o coeficiente de atrito cinético é 0,8; com a pista molhada, cai para 0,4. Considere g = 10 m/s². Na pista molhada, a distância percorrida desde o travamento das rodas até a parada é</p>',
  opts: ['5,0 m.','25 m.','50 m.','100 m.','500 m.'], ans: 2,
  hint: 'A desaceleração causada pelo atrito é a = μ · g (a massa se cancela). Converta 72 km/h para m/s e use Torricelli.',
  steps: [['Desaceleração', '<div class="eq">F<sub>at</sub> = μ · m · g = m · a → a = μ · g = 0,4 × 10 = 4 m/s²</div>'],

{ src: 'Inédita', nivel: 'básico',
  text: '<p>Em uma manhã fria, uma pessoa sai da cama descalça, pisa no piso de cerâmica do quarto e, em seguida, no tapete de lã ao lado da cama. O piso e o tapete estão no mesmo ambiente há horas, mas ela tem a nítida sensação de que a cerâmica está muito mais fria que o tapete.</p><p>Essa sensação ocorre porque</p>',

          ['Condutividade', '<p>A condutividade térmica k é uma propriedade constante de cada material. A da cerâmica é muito maior que a da lã (que ainda prende ar, ótimo isolante): o fluxo de calor do pé para a cerâmica é maior, e a sensação é de mais frio.</p>']],

  opts: ['transporta matéria de um ponto a outro da arquibancada.','transporta energia sem transportar matéria.','só se propaga em meios sólidos, como a arquibancada.','tem velocidade igual à velocidade de cada torcedor.','depende do vento para se deslocar ao longo de todo o estádio.'], ans: 1,
  hint: 'Os torcedores saem do lugar? Então o que é que realmente “anda” pela arquibancada?',
  steps: [['O que se move', '<p>Cada torcedor só sobe e desce no próprio lugar. Quem dá a volta no estádio é a <b>perturbação</b>, o movimento passado de um para o outro.</p>'],
          ['Conclusão', '<p>Toda onda transporta <b>energia</b> (e informação) de um ponto a outro <b>sem transportar a matéria</b> do meio.</p>']],
  alt: 'Uma boia no mar sobe e desce quando a onda passa, mas não é levada até a praia. O mesmo vale para o ar, quando o som passa: as moléculas oscilam em volta de onde estão.',
  warn: erros([['A)','os torcedores não mudam de lugar; o que se desloca é a perturbação.'],['C)','ondas se propagam em sólidos, líquidos e gases (e as eletromagnéticas, até no vácuo).'],['D)','cada torcedor só sobe e desce; a velocidade da ola é outra coisa.'],['E)','a ola é feita pelas pessoas, não pelo vento.']]) },

{ src: 'Inédita', nivel: 'básico',
  text: '<p>Morcegos caçam insetos no escuro emitindo sons de frequência muito alta (ultrassons). Pelo tempo que o som leva para voltar e pelas mudanças que ele sofre, o morcego localiza a presa com grande precisão. A mesma ideia é usada nos sonares de navios e nos sensores de estacionamento dos carros.</p><p>O fenômeno ondulatório essencial para esse tipo de localização é a</p>',
  opts: ['refração.','difração.','interferência.','reflexão.','polarização.'], ans: 3,
  hint: 'O morcego ouve o próprio som depois que ele “bate” no inseto. Que fenômeno faz a onda voltar?',
  steps: [['O que acontece com o som', '<p>O ultrassom bate no inseto (ou no obstáculo) e <b>volta</b> para o morcego: é um eco.</p>'],
          ['Fenômeno', '<p>A volta da onda ao encontrar um obstáculo é a <b>reflexão</b>. Pelo tempo de ida e volta, o morcego estima a distância (ecolocalização).</p>']],
  alt: 'Sempre que o enunciado falar em eco, sonar, ecolocalização ou ultrassonografia, a primeira pista é reflexão. Os outros fenômenos podem aparecer junto, mas sem a onda voltar não há eco.',
  warn: erros([['A)','refração é a mudança de velocidade ao trocar de meio, não a volta da onda.'],['B)','difração é contornar obstáculos; aqui o som precisa voltar.'],['C)','interferência é a soma de duas ondas; não é o que permite localizar a presa.'],['E)','o som no ar é longitudinal e nem pode ser polarizado.']]) },

{ src: 'Inédita', nivel: 'básico',
  text: `<p>Em um programa de TV, uma cantora quebra uma taça de cristal apenas com a voz, sem tocá-la. Antes, um técnico bateu de leve na taça com uma colher e mediu o som produzido. O gráfico mostra como a amplitude de vibração da taça varia com a frequência do som que chega até ela.</p>
${plot({aria:'Amplitude de vibração da taça, em unidades arbitrárias, em função da frequência do som, de 600 a 1 160 Hz. A curva tem um pico estreito em 880 Hz.', xmin:600, xmax:1160, ymin:0, ymax:1.15, xt:[600,740,880,1020,1160], yt:[], xl:'f (Hz)', yl:'amplitude', L:[{p:lorentz(880, 25, 600, 1160), c:'#0B6477'}], ann:[[880,1.08,'880 Hz']]})}
<p>A cantora consegue quebrar a taça quando sustenta uma nota de cerca de 880 Hz porque</p>`,
  opts: ['a frequência da voz coincide com a frequência natural da taça.','a voz humana tem amplitude maior que a de qualquer instrumento.','o som de 880 Hz é um ultrassom, que o cristal não suporta.','a onda sonora sofre refração ao entrar no cristal e se concentra no centro.','a velocidade do som no cristal é maior que no ar, e a energia fica presa dentro da taça.'], ans: 0,
  hint: 'Olhe o gráfico: em que frequência a taça vibra muito mais do que nas outras? O que essa frequência tem de especial?',
  steps: [['Leitura do gráfico', '<p>A taça vibra pouco na maioria das frequências e muito perto de 880 Hz: é a sua <b>frequência natural</b> (o mesmo som que ela faz ao ser batida com a colher).</p>'],
          ['Fenômeno', '<p>Quando a frequência que chega coincide com a natural, a taça absorve energia a cada ciclo, e a amplitude cresce até o cristal se romper: <b>ressonância</b>.</p>']],
  alt: 'É como empurrar alguém num balanço: empurrões pequenos, mas no ritmo certo, fazem a amplitude crescer muito. Fora do ritmo, não adianta empurrar com força.',
  warn: erros([['B)','não é a força da voz, e sim a frequência certa; fora de 880 Hz, a taça quase não vibra.'],['C)','880 Hz é um som audível (ultrassom é acima de 20 000 Hz).'],['D)','refração não explica o aumento da vibração justo em uma frequência.'],['E)','a velocidade no cristal não “prende” energia; o que importa é a coincidência de frequências.']]) },

{ src: 'Inédita', nivel: 'básico',
  text: `<p>Durante um intervalo, um estudante está atrás do muro da quadra e ouve claramente a conversa de dois colegas do outro lado, mas não consegue vê-los, como no esquema. Tanto o som quanto a luz são ondas, mas eles se comportam de modo diferente diante do muro.</p>
${FIG_MURO}
<p>Ele ouve sem ver porque</p>`,
  opts: ['o som se propaga mais rápido que a luz.','a luz sofre difração ao passar pelo muro, e o som não.','o som, de comprimento de onda bem maior, contorna o muro por difração.','o som é refletido pelo chão e chega por cima do muro com mais intensidade que a luz.','a luz é uma onda mecânica e precisa de um meio para se propagar.'], ans: 2,
  hint: 'Compare os comprimentos de onda: o da voz é da ordem de centímetros a metros; o da luz, de centenésimos de milésimo de milímetro. Qual deles “enxerga” o muro como um obstáculo pequeno?',
  steps: [['Comprimentos de onda', '<p>Voz humana: λ de algumas dezenas de centímetros a alguns metros. Luz visível: λ ≈ 0,0000005 m (500 nm).</p>'],
          ['Difração', '<p>Uma onda contorna bem obstáculos e bordas com tamanho parecido com o seu comprimento de onda. O som, com λ comparável ao muro, <b>difrata</b> e chega ao outro lado; a luz praticamente não.</p>']],
  alt: 'O mesmo vale para a porta entreaberta: você ouve a TV da sala no corredor, mas só vê a tela se estiver alinhado com a abertura.',
  warn: erros([['A)','a luz é cerca de um milhão de vezes mais rápida que o som.'],['B)','é o contrário: o som é que difrata de forma perceptível.'],['D)','reflexões podem ajudar, mas não explicam a diferença entre som e luz.'],['E)','a luz é eletromagnética: atravessa até o vácuo.']]) },

{ src: 'Inédita', nivel: 'intermediário',
  text: `<p>Fotos aéreas de praias mostram que, longe da costa, as ondas do mar podem vir em várias direções, mas, ao se aproximarem da areia, as frentes de onda se curvam e chegam quase paralelas à linha da praia, como no esquema.</p>
${FIG_PRAIA}
<p>Esse comportamento se deve à</p>`,
  opts: ['reflexão, pois as ondas batem no fundo e voltam.','difração, pois as ondas contornam as pedras da praia.','interferência, pois as ondas se somam perto da areia.','polarização, pois só uma direção de vibração chega à praia.','refração, pois a velocidade da onda diminui na água rasa.'], ans: 4,

          ['Curvatura', '<p>A parte da frente de onda que chega antes à água rasa freia primeiro; o resto “alcança”, e a frente gira até ficar paralela à praia. Mudança de velocidade com mudança de direção é <b>refração</b>.</p>']],

  warn: erros([['A)','as ondas não voltam: elas mudam de direção e seguem para a praia.'],['B)','difração é contornar obstáculos; aqui o efeito acontece mesmo sem pedras.'],['C)','interferência não muda a direção de propagação das frentes.'],['D)','ondas na água não “escolhem” direção de vibração ao chegar à praia.']]) },

{ src: 'Inédita', nivel: 'intermediário',
  text: '<p>Bolhas de sabão e manchas finas de óleo no asfalto molhado exibem faixas coloridas que mudam conforme o ângulo de observação, mesmo sendo iluminadas por luz branca e sem nenhum corante. Parte da luz é refletida na face de cima da película e parte na face de baixo, e as duas se encontram no olho do observador.</p><p>As cores aparecem por causa da</p>',
  opts: ['dispersão da luz, como no arco-íris.','interferência entre a luz refletida nas duas faces da película.','absorção seletiva das cores pelos pigmentos do sabão.','polarização da luz ao atravessar a película de água e sabão.','difração da luz pelas moléculas de sabão, que funcionam como pequenas fendas.'], ans: 1,
  hint: 'O enunciado diz que duas partes da luz se encontram no olho. Duas ondas que se encontram podem se reforçar ou se anular...',
  steps: [['Dois caminhos', '<p>A luz refletida na face de baixo percorre um caminho um pouco maior que a refletida na face de cima.</p>'],
          ['Interferência', '<p>Para cada espessura, algumas cores (comprimentos de onda) se reforçam (interferência construtiva) e outras se anulam (destrutiva). Por isso aparecem faixas coloridas que mudam com a espessura e com o ângulo.</p>']],
  alt: 'O mesmo efeito explica as cores de um CD, das asas de algumas borboletas e da película antirreflexo dos óculos.',
  warn: erros([['A)','dispersão separa cores na refração (prisma, arco-íris); aqui as cores vêm de duas reflexões.'],['C)','o enunciado diz que não há corante, e o sabão é transparente.'],['D)','polarização não cria cores na luz branca refletida.'],['E)','moléculas são pequenas demais para funcionar como fendas para a luz visível.']]) },

{ src: 'Inédita', nivel: 'intermediário',
  text: '<p>Óculos de sol polarizados reduzem o ofuscamento causado pela luz refletida na água e no asfalto, porque bloqueiam a luz que vibra em uma certa direção. Animado com a ideia, um estudante propõe fabricar protetores de ouvido com “filtros polarizadores para som”, que bloqueariam o barulho do trânsito.</p><p>A proposta não funciona porque</p>',
  opts: ['o som do trânsito tem frequência baixa demais para ser filtrado.','os filtros polarizadores só funcionam no vácuo.','o som é uma onda eletromagnética, como a luz, mas de menor energia.','o som no ar é longitudinal, e só ondas transversais são polarizáveis.','a polarização reduz só a frequência da onda, e não a intensidade, então o barulho não ficaria mais baixo.'], ans: 3,
  hint: 'Polarizar é “escolher” uma direção de vibração perpendicular à propagação. Em que direção vibram as moléculas do ar quando o som passa?',
  steps: [['Luz', '<p>A luz é transversal: o campo elétrico vibra perpendicular à direção de propagação, em várias direções. O filtro deixa passar só uma delas.</p>'],
          ['Som', '<p>No ar, o som é uma onda <b>longitudinal</b>: as moléculas vibram na mesma direção em que a onda se propaga. Não há “direções de vibração” para escolher, então o som <b>não pode ser polarizado</b>.</p>']],
  alt: 'Polarização é o teste clássico para saber se uma onda é transversal. Foi assim que se confirmou que a luz é transversal.',
  warn: erros([['A)','a frequência não tem relação com a possibilidade de polarizar.'],['B)','polarizadores funcionam no ar (os óculos de sol, por exemplo).'],['C)','o som é uma onda mecânica, não eletromagnética.'],['E)','polarização não muda a frequência; ela seleciona uma direção de vibração.']]) },

{ src: 'Inédita', nivel: 'intermediário',
  text: '<p>No exame de ultrassom com Doppler, usado para avaliar a circulação, um aparelho emite ultrassom de frequência conhecida em direção a uma artéria. As hemácias em movimento refletem a onda de volta, e o aparelho compara a frequência recebida com a emitida para calcular a velocidade do sangue.</p><p>Quando o sangue se move em direção ao aparelho, o fenômeno envolvido e a relação entre as frequências são:</p>',
  opts: ['efeito Doppler; a frequência refletida é maior que a emitida.','efeito Doppler; a frequência refletida é menor que a emitida.','ressonância; a frequência refletida é igual à emitida.','refração; a frequência refletida é maior que a emitida.','difração; a frequência refletida é menor, porque o sangue absorve parte da energia.'], ans: 0,
  hint: 'O nome do exame já dá metade da resposta. Para a outra metade: lembre do som de uma ambulância que se aproxima.',
  steps: [['Fenômeno', '<p>A mudança de frequência causada pelo movimento relativo entre a fonte (ou o refletor) e o receptor é o <b>efeito Doppler</b>.</p>'],
          ['Sentido', '<p>Com as hemácias se aproximando, as frentes de onda refletidas chegam mais juntas ao aparelho: comprimento de onda menor e <b>frequência maior</b> que a emitida.</p>']],
  alt: 'O radar de trânsito usa a mesma ideia com micro-ondas: a diferença entre a frequência emitida e a refletida pelo carro dá a velocidade dele.',

   <rect x="70" y="${y(120)}" width="20" height="${1.4*120}" rx="4" fill="url(#gdb)" stroke="var(--ink)" stroke-width="1.5"/>
   ${[0,20,40,60,80,100,120].map(d => `<line x1="64" y1="${y(d)}" x2="70" y2="${y(d)}" stroke="var(--ink)" stroke-width="1.4"/><text x="58" y="${y(d)+4}" text-anchor="end" class="pt">${d}</text>`).join('')}
   <text x="80" y="16" text-anchor="middle" class="pt pt-strong">nível sonoro (dB)</text>

/* ===================== LISTA 2 · Conceitos e fenômenos ===================== */
const ondaPiano = (() => { const p = []; for (let k = 0; k <= 160; k++){ const x = 8 * k / 160; p.push([+x.toFixed(3), +(Math.sin(2*Math.PI*x/4) + 0.25*Math.sin(4*Math.PI*x/4)).toFixed(3)]); } return p; })();
const ondaViolino = (() => { const p = []; for (let k = 0; k <= 160; k++){ const x = 8 * k / 160; let y = 0; for (let n = 1; n <= 7; n++) y += Math.sin(2*Math.PI*n*x/4) / n; p.push([+x.toFixed(3), +(0.7 * y).toFixed(3)]); } return p; })();

{ src: 'Inédita', nivel: 'básico',
  text: `<p>Um piano e um violino tocam a mesma nota, com a mesma intensidade. Mesmo de olhos fechados, qualquer pessoa sabe qual instrumento está tocando. O gráfico mostra, de forma simplificada, a variação da pressão do ar produzida por cada instrumento ao longo do tempo.</p>

{ src: 'Inédita', nivel: 'básico',

{ src: 'Inédita', nivel: 'intermediário',
  text: `<p>O nível de intensidade sonora é medido em decibéis (dB). A escala é logarítmica: cada aumento de 10 dB corresponde a uma intensidade 10 vezes maior. A escala mostra valores típicos de alguns ambientes.</p>
${FIG_DB}
<p>Em relação à conversa normal, a intensidade sonora do trânsito intenso é</p>`,
  opts: ['1,3 vez maior.','2 vezes maior.','20 vezes maior.','100 vezes maior.','1 000 vezes maior.'], ans: 3,
  hint: 'De 60 dB para 80 dB são dois “degraus” de 10 dB. Cada degrau multiplica a intensidade por 10.',
  steps: [['Diferença em dB', '<div class="eq">80 − 60 = 20 dB = 2 × 10 dB</div>'],
          ['Intensidade', '<div class="eq">10 × 10 = 100 vezes maior</div>']],
  alt: 'Por isso o show de rock (110 dB) é perigoso: são 50 dB acima da conversa, ou seja, uma intensidade 100 000 vezes maior. A exposição prolongada acima de cerca de 85 dB já pode causar perda auditiva.',
  deep: ['A mesma resposta pela fórmula com logaritmo', `<p>O enunciado descreve em palavras a definição do nível sonoro:</p>
<div class="eq">β = 10 · log ${f('I','I₀')}</div>
<p>β é o nível em dB, I é a intensidade (W/m²) e I₀ = 10⁻¹² W/m² é a intensidade mínima que o ouvido percebe. Lembre: <b>log x = n</b> significa <b>x = 10ⁿ</b>.</p>
<p><b>1. Conversa normal (60 dB)</b></p>
<div class="eq">60 = 10 · log ${f('I₁','I₀')}</div>
<div class="eq">log ${f('I₁','I₀')} = 6 → ${f('I₁','I₀')} = 10⁶</div>
<div class="eq">I₁ = 10⁶ × 10⁻¹²</div>
<div class="eq">I₁ = 10⁻⁶ W/m²</div>
<p><b>2. Trânsito intenso (80 dB)</b></p>
<div class="eq">log ${f('I₂','I₀')} = 8 → ${f('I₂','I₀')} = 10⁸</div>
<div class="eq">I₂ = 10⁻⁴ W/m²</div>
<p><b>3. Comparação</b></p>
<div class="eq">${f('I₂','I₁')} = ${f('10⁻⁴','10⁻⁶')} = 10²</div>
<div class="eq">${f('I₂','I₁')} = 100</div>
<p><b>Atalho:</b> subtraindo os dois níveis, I₀ some da conta (log a − log b = log a/b):</p>
<div class="eq">β₂ − β₁ = 10 · log ${f('I₂','I₁')}</div>
<div class="eq">80 − 60 = 10 · log ${f('I₂','I₁')}</div>
<div class="eq">log ${f('I₂','I₁')} = 2</div>
<div class="eq">${f('I₂','I₁')} = 10² = 100</div>
<p><b>De onde vem a “regra dos 10 dB”:</b> se a intensidade fica 10 vezes maior, o nível sobe 10 · log 10 = 10 × 1 = 10 dB. E se a intensidade só dobra, sobe 10 · log 2 ≈ 10 × 0,30 = 3 dB: duas caixas de som iguais não fazem o dobro de decibéis, só 3 dB a mais.</p>`],
  warn: erros([['A) 1,3 vez:','divide os decibéis (80/60), como se a escala fosse linear.'],['B) 2 vezes:','divide a diferença (20 dB) por 10 e usa o resultado como fator.'],['C) 20 vezes:','usa a diferença em dB como fator de multiplicação.'],['E) 1 000 vezes:','conta três degraus de 10 dB.']]) },

{ src: 'Inédita', nivel: 'intermediário',
  text: '<p>A nova geração de telefonia móvel no Brasil, a 5G, usa principalmente a faixa de 3,5 GHz, frequência bem mais alta que a das gerações anteriores. Quanto maior a frequência, menor o comprimento de onda, o que permite antenas menores e mais transmissão de dados, mas com menor alcance. Considere a velocidade das ondas eletromagnéticas no ar igual a 3,0 × 10⁸ m/s.</p><p>O comprimento de onda da 5G nessa faixa é de, aproximadamente,</p>',
  opts: ['0,086 mm.','8,6 mm.','8,6 cm.','86 cm.','1,1 × 10¹⁸ m.'], ans: 2,
  hint: 'Use v = λ · f. Lembre que 1 GHz = 10⁹ Hz.',
  steps: [['Frequência no SI', '<div class="eq">f = 3,5 GHz = 3,5 × 10⁹ Hz</div>'],
          ['Comprimento de onda', `<div class="eq">λ = ${f('v','f')} = ${f('3,0 × 10⁸','3,5 × 10⁹')} ≈ 0,086 m = 8,6 cm</div>`]],
  alt: 'Compare: a rádio FM (100 MHz) tem λ = 3 m. A 5G tem frequência 35 vezes maior e, portanto, λ 35 vezes menor. É por isso que ela precisa de muito mais antenas, mais próximas umas das outras.',
  warn: erros([['A) 0,086 mm:','erra a conversão de metros para milímetros.'],['B) 8,6 mm:','erra a conversão de metros para centímetros.'],['D) 86 cm:','usa 10⁸ Hz no lugar de 10⁹ Hz.'],['E) 1,1 × 10¹⁸ m:','multiplica a velocidade pela frequência.']]) },

{ src: 'Inédita', nivel: 'intermediário',
  text: '<p>Para afinar um violão, o músico gira a tarraxa e aumenta a tensão de uma corda, sem mudar o comprimento da parte que vibra. A nota tocada com a corda solta fica mais aguda.</p><p>A explicação física para esse efeito é que</p>',

  hint: 'Na corda presa nas pontas, o comprimento de onda do modo fundamental depende só do comprimento da corda. O que a tensão muda?',
  steps: [['O que fica fixo', '<p>O comprimento vibrante não muda; no modo fundamental, λ = 2L também não muda.</p>'],
          ['O que muda', '<p>A velocidade da onda numa corda cresce com a tensão (v = √(T/μ)). Com λ fixo, f = v/λ <b>aumenta</b>: o som fica mais agudo.</p>']],

  warn: erros([['B)','o comprimento de onda não muda (λ = 2L); e, se aumentasse com v fixa, f diminuiria.'],['C)','o som fica mais agudo, ou seja, a frequência aumenta.'],['D)','o comprimento é o mesmo, mas a velocidade da onda muda.'],['E)','a amplitude está ligada à intensidade (volume), não à altura.']]) },

{ src: 'Inédita', nivel: 'avançado',
  text: `<p>Na ultrassonografia, um detalhe só aparece bem na imagem se for maior que o comprimento de onda do ultrassom no tecido. Frequências mais altas mostram detalhes menores, mas penetram menos no corpo. Um médico quer visualizar estruturas de 0,25 mm, perto da pele, e dispõe dos transdutores do quadro. Considere a velocidade do ultrassom nos tecidos moles igual a 1 540 m/s.</p>

{ src: 'Inédita', nivel: 'básico',
  text: `<p>Em uma aula de laboratório, um estudante monta um circuito com uma pilha e uma pequena lâmpada. Ele quer medir, ao mesmo tempo, a corrente elétrica que atravessa a lâmpada e a tensão elétrica entre os terminais dela. Para isso, liga dois medidores, M₁ e M₂, como no esquema.</p>
${FIG_MEDIDORES}
<p>Para que as medidas fiquem corretas, M₁ e M₂ devem ser, respectivamente,</p>`,
  opts: ['dois amperímetros.','um voltímetro e um amperímetro.','um amperímetro e um voltímetro.','dois voltímetros.','um voltímetro e um amperímetro, ambos de resistência interna muito pequena.'], ans: 2,
  hint: 'Veja por onde passa a corrente da lâmpada: ela atravessa M₁? E M₂ está ligado entre quais pontos?',
  steps: [['M₁: em série', '<p>Toda a corrente que vai para a lâmpada atravessa M₁: ele está <b>em série</b>. Para medir corrente, a corrente precisa passar por dentro do medidor: M₁ é o <b>amperímetro</b>, de resistência muito pequena, para não alterar a corrente.</p>'],
          ['M₂: em paralelo', '<p>M₂ está ligado entre os dois terminais da lâmpada: está <b>em paralelo</b>. É o <b>voltímetro</b>, que compara o potencial de dois pontos e tem resistência muito grande, para quase não desviar corrente.</p>']],
  alt: 'Um amperímetro ligado em paralelo funciona como um curto-circuito (resistência quase nula): pode queimar o fusível do aparelho ou descarregar a pilha.',

{ src: 'Inédita', nivel: 'intermediário',
  text: '<p>Uma lanterna funciona com três pilhas de 1,5 V ligadas em série e uma lâmpada de 4,5 V e 0,9 W. Cada pilha tem capacidade de 2 000 mAh, ou seja, pode fornecer uma corrente de 2 000 mA durante 1 hora (ou uma corrente menor por mais tempo).</p><p>Com a lâmpada funcionando nas condições nominais, a lanterna fica acesa por, aproximadamente,</p>',
  opts: ['2,2 h.','3,3 h.','6,7 h.','10 h.','30 h.'], ans: 3,
  hint: 'Calcule a corrente na lâmpada (P = U · i). Em série, a mesma corrente atravessa as três pilhas.',
  steps: [['Corrente', `<div class="eq">i = ${f('P','U')} = ${f('0,9','4,5')} = 0,2 A = 200 mA</div>`],
          ['Série', '<p>Em série, a tensão das pilhas se soma (4,5 V), mas a mesma corrente atravessa todas elas: cada pilha fornece os 200 mA.</p>'],

{ src: 'Inédita', nivel: 'intermediário',
  text: '<p>Uma pessoa se muda para uma cidade onde a rede elétrica é de 220 V e leva seu chuveiro, de 5 500 W, fabricado para funcionar em 127 V. Antes de instalar, ela pergunta a um técnico o que aconteceria se o chuveiro fosse ligado diretamente na rede nova. Considere que a resistência do chuveiro não varia.</p><p>Ligado em 220 V, a potência do chuveiro passaria a ser de, aproximadamente,</p>',
  opts: ['3 200 W.','5 500 W.','9 500 W.','16 500 W.','28 600 W.'], ans: 3,
  hint: 'Com a resistência fixa, use P = U²/R: a potência é proporcional ao quadrado da tensão.',
  steps: [['Razão das tensões', `<div class="eq">${f('220','127')} ≈ 1,73</div>`],
          ['Potência', '<p>Com R fixa, P ∝ U²:</p><div class="eq">P′ = 5 500 × 1,73² ≈ 5 500 × 3 ≈ 16 500 W</div><p>O triplo da potência de projeto: a resistência queima em pouco tempo.</p>']],
  alt: 'Para usar a mesma potência em 220 V, a resistência teria de ser cerca de 3 vezes maior. Por isso existem chuveiros específicos para cada tensão, e a solução segura é trocar o aparelho, com instalação feita por profissional habilitado.',
  warn: erros([['A) 3 200 W:','inverte a razão das tensões (127/220) e esquece o quadrado.'],['B) 5 500 W:','acha que a potência não depende da tensão.'],['C) 9 500 W:','usa a razão das tensões sem elevar ao quadrado.'],['E) 28 600 W:','eleva a razão das tensões ao cubo.']]) },

{ src: 'Inédita', nivel: 'intermediário',
  text: `<p>Um aquecedor de ambiente tem dois resistores iguais, de 20 Ω cada, e uma chave seletora de três posições, descritas no quadro. Ele é ligado em 220 V.</p>
${tabela(['Posição','Ligação'],[['Mínima','os dois resistores em série'],['Média','apenas um resistor'],['Máxima','os dois resistores em paralelo']])}
<p>As potências do aquecedor nas posições mínima e máxima são, respectivamente,</p>`,

  hint: 'Calcule a resistência equivalente de cada posição e use P = U²/R. Atenção: menor resistência significa maior potência.',
  steps: [['Resistências equivalentes', '<p>Série: 20 + 20 = 40 Ω. Paralelo: 20/2 = 10 Ω.</p>'],
          ['Potências', `<div class="eq">P<sub>mín</sub> = ${f('220²','40')} = 1 210 W</div><div class="eq">P<sub>máx</sub> = ${f('220²','10')} = 4 840 W</div>`]],

  warn: erros([['A) 1 210 W e 2 420 W:','dá a potência da posição média como máxima.'],['C) 2 420 W e 4 840 W:','dá a posição média como mínima.'],['D) 4 840 W e 1 210 W:','acha que mais resistência dá mais calor.'],['E) 605 W e 2 420 W:','usa 80 Ω para a associação em série.']]) },

{ src: 'Inédita', nivel: 'intermediário',
  text: '<p>A bateria de um patinete elétrico tem tensão de 36 V e capacidade de 10 Ah. Em uso típico na cidade, o patinete consome 12 Wh de energia por quilômetro rodado.</p><p>Com a bateria totalmente carregada, a autonomia do patinete é de, aproximadamente,</p>',
  opts: ['0,83 km.','3,0 km.','30 km.','360 km.','4 320 km.'], ans: 2,
  hint: 'A energia guardada na bateria é tensão × carga. Com ela em Wh, compare com o consumo por quilômetro.',
  steps: [['Energia da bateria', '<div class="eq">E = U · Q = 36 V × 10 Ah = 360 Wh</div>'],
          ['Autonomia', `<div class="eq">${f('360 Wh','12 Wh/km')} = 30 km</div>`]],
  alt: 'Ampère-hora mede carga elétrica, não energia. Só multiplicando pela tensão se obtém a energia em watt-hora. É a mesma conta para celulares, notebooks e carros elétricos (que usam kWh).',
  warn: erros([['A) 0,83 km:','divide a carga (10 Ah) pelo consumo, sem usar a tensão.'],['B) 3,0 km:','divide a tensão pelo consumo.'],['D) 360 km:','lê a energia (360 Wh) como a distância.'],['E) 4 320 km:','multiplica a energia pelo consumo.']]) },

{ src: 'Inédita', nivel: 'avançado',
  text: `<p>Para iluminar uma maquete, um estudante montou o circuito da figura com três lâmpadas idênticas e uma bateria de resistência interna desprezível. Considere que a resistência das lâmpadas não varia.</p>

  hint: 'Calcule a resistência equivalente antes e depois. Depois compare a corrente em cada lâmpada: o brilho depende de P = R · i².',
  steps: [['Antes', '<p>R<sub>eq</sub> = R + R/2 = 1,5R → corrente total i = ε/1,5R ≈ 0,67 ε/R.<br>L1 recebe 0,67 ε/R; L2 recebe metade: 0,33 ε/R.</p>'],
          ['Depois', '<p>Sem L3, L1 e L2 ficam em série: R<sub>eq</sub> = 2R → i = 0,5 ε/R nas duas.</p>'],
          ['Comparação', '<p>L1: de 0,67 para 0,50 ε/R → <b>brilha menos</b>. L2: de 0,33 para 0,50 ε/R → <b>brilha mais</b>.</p>']],
  alt: 'Retirar uma lâmpada em paralelo aumenta a resistência total: a corrente da bateria diminui (L1 enfraquece), e a tensão que sobra para L2 aumenta (L2 fortalece). Pensar só “a corrente de L3 vai toda para L2” esquece que a corrente total também muda.',
  warn: erros([['A)','a resistência total aumenta; a corrente de L1 não pode crescer.'],['B)','L2 passa a ter mais tensão e mais corrente.'],['C)','inverte os dois efeitos.'],['E)','a corrente total da bateria muda; L1 é afetada.']]) },

{ src: 'Inédita', nivel: 'avançado',
  text: '<p>A bateria de um carro tem força eletromotriz de 12 V e resistência interna de 0,05 Ω. Ao dar a partida, o motor de arranque solicita uma corrente de 100 A. Muitos motoristas notam que, nesse momento, os faróis acesos ficam bem mais fracos.</p><p>Durante a partida, a tensão nos terminais da bateria e o efeito nos faróis são:</p>',
  opts: ['12 V; os faróis não mudam.','7,0 V; os faróis ficam mais fracos.','5,0 V; os faróis ficam mais fracos.','17 V; os faróis ficam mais fortes.','7,0 V; os faróis ficam mais fortes, pois a corrente total da bateria aumenta.'], ans: 1,
  hint: 'Num gerador real, parte da tensão “fica” na resistência interna: U = ε − r · i.',
  steps: [['Tensão nos terminais', '<div class="eq">U = ε − r · i = 12 − 0,05 × 100 = 12 − 5 = 7,0 V</div>'],
          ['Faróis', '<p>Os faróis estão ligados aos terminais da bateria. Com a tensão caindo de 12 V para 7 V, a potência deles (P = U²/R) cai para cerca de (7/12)² ≈ 34% do normal: brilham bem menos.</p>']],
  alt: 'Com a corrente pequena dos faróis, a queda na resistência interna é desprezível e a bateria entrega quase 12 V. Só a corrente enorme do motor de arranque torna a queda importante.',
  warn: erros([['A) 12 V:','ignora a resistência interna.'],['C) 5,0 V:','dá a queda na resistência interna, não a tensão nos terminais.'],['D) 17 V:','soma a queda em vez de subtrair.'],['E)','acerta a tensão, mas o brilho depende da tensão nos faróis, que diminuiu.']]) },
