const TOOLS_INDUCAO_2 = [
  ['Fluxo magnético', `Φ = B · A · cos θ<br><small>θ é o ângulo entre B e a <b>normal</b> ao plano da espira (não entre B e o plano!).</small>`],
  ['Lei de Faraday', `ε = N · ${f('|ΔΦ|','Δt')} &nbsp;·&nbsp; <small>se B inverte de sentido, |ΔB| = 2B</small>`],
  ['Lei de Lenz', `A corrente induzida se opõe à <b>variação</b> do fluxo: aproximação → repulsão; afastamento → atração.`],
  ['Barra em trilhos', `ε = B · L · v &nbsp;·&nbsp; i = ${f('ε','R')} &nbsp;·&nbsp; F<sub>mag</sub> = B · i · L &nbsp;·&nbsp; P = ε · i = R · i²`],
  ['Gerador', `ε<sub>máx</sub> = N · B · A · ω &nbsp;·&nbsp; R<sub>fio</sub> = ρ · ${f('comprimento','área da seção')}`],
  ['Transformador e transmissão', `${f('U<sub>1</sub>','U<sub>2</sub>')} = ${f('N<sub>1</sub>','N<sub>2</sub>')} &nbsp;·&nbsp; P = U · i &nbsp;·&nbsp; P<sub>perdida</sub> = R<sub>linha</sub> · i²`],
  ['Valores úteis', `π ≈ 3 &nbsp;·&nbsp; √3 ≈ 1,7 &nbsp;·&nbsp; cos 30° = ${f('√3','2')} &nbsp;·&nbsp; cos 60° = 0,5`]
];

const Q_INDUCAO_2 = [
{ src:'Original', nivel:'intermediário',
  text:`Uma espira circular de raio 10 cm está em um campo magnético uniforme de 0,40 T. As linhas de campo formam um ângulo de <b>60° com o plano</b> da espira, como na figura (vista de lado).${FIG_ANGULO}Usando π ≈ 3 e √3 ≈ 1,7, o fluxo magnético através da espira é aproximadamente:`,
  opts:[`6,0 × 10<sup>−3</sup> Wb`,`1,0 × 10<sup>−2</sup> Wb`,`1,2 × 10<sup>−2</sup> Wb`,`2,4 × 10<sup>−2</sup> Wb`,`1,2 × 10<sup>−1</sup> Wb`],
  ans:1,
  hint:`Cuidado com o ângulo: a fórmula usa o ângulo entre B e a <b>normal</b> ao plano. Se o campo faz 60° com o plano, quanto faz com a normal?`,
  steps:[['Área',`r = 10 cm = 0,10 m → A = π · r² ≈ 3 · 0,010 = 0,030 m²`],
         ['Ângulo certo',`60° com o plano → θ = 90° − 60° = 30° com a normal → cos 30° = ${f('√3','2')} ≈ 0,85`],
         ['Fluxo',`Φ = B · A · cos θ ≈ 0,40 · 0,030 · 0,85 ≈ <b>1,0 × 10<sup>−2</sup> Wb</b>`]],
  alt:`Pense na “sombra” da espira vista na direção do campo. Se o campo fosse rente ao plano (0° com o plano), não passaria nada; se fosse perpendicular ao plano, passaria tudo. 60° com o plano é bem perto de perpendicular, então o fluxo é quase o máximo (B · A = 1,2 × 10<sup>−2</sup> Wb), só um pouco menor.`,
  warn:`Usar cos 60° direto dá 6,0 × 10<sup>−3</sup> Wb (alternativa A) — é o erro clássico de medir o ângulo a partir do plano. Ignorar o ângulo dá 1,2 × 10<sup>−2</sup> Wb (C).` },

{ src:'Original', nivel:'intermediário',
  text:`Uma bobina de 20 espiras, cada uma com área de 0,020 m², está em um campo magnético perpendicular ao seu plano, de intensidade 0,30 T. Em 0,05 s, o campo tem seu <b>sentido invertido</b>, passando a valer 0,30 T no sentido oposto. O módulo da fem média induzida é:`,
  opts:[`zero`,`0,24 V`,`2,4 V`,`4,8 V`,`9,6 V`],
  ans:3,
  hint:`O campo não foi a zero: foi de +0,30 T a −0,30 T. Qual é a variação total?`,
  steps:[['Variação do campo',`ΔB = (−0,30) − (+0,30) = −0,60 T → |ΔB| = 0,60 T`],
         ['Variação do fluxo (uma espira)',`|ΔΦ| = |ΔB| · A = 0,60 · 0,020 = 0,012 Wb`],
         ['Faraday',`ε = N · ${f('|ΔΦ|','Δt')} = 20 · ${f('0,012','0,05')} = <b>4,8 V</b>`]],
  alt:`Divida em duas etapas: de 0,30 T até zero o fluxo cai 0,006 Wb; de zero até 0,30 T no outro sentido, cai mais 0,006 Wb. Total: 0,012 Wb por espira.`,
  warn:`“A intensidade inicial e a final são iguais, então não variou” leva a zero (A). Usar só 0,30 T de variação dá 2,4 V (C) — metade do valor certo.` },

{ src:'Original', nivel:'intermediário',
  text:`Uma barra condutora de 0,50 m desliza sem atrito sobre trilhos ligados por um resistor de 4,0 Ω, em um campo magnético uniforme de 0,80 T perpendicular ao plano dos trilhos. Para que a barra mantenha velocidade constante de 5,0 m/s, um agente externo deve puxá-la com uma força F, como na figura.${FIG_TRILHOS_L2}A intensidade da força aplicada pelo agente e a potência dissipada no resistor são, respectivamente:`,
  opts:[`zero e 1,0 W`,`0,20 N e 0,50 W`,`0,20 N e 1,0 W`,`0,40 N e 2,0 W`,`1,0 N e 0,20 W`],
  ans:2,
  hint:`Calcule a corrente; a força magnética sobre a barra (B · i · L) freia o movimento. Com velocidade constante, a força do agente equilibra exatamente essa força.`,
  steps:[['fem e corrente',`ε = B · L · v = 0,80 · 0,50 · 5,0 = 2,0 V &nbsp;→&nbsp; i = ${f('2,0','4,0')} = 0,50 A`],
         ['Força magnética',`F<sub>mag</sub> = B · i · L = 0,80 · 0,50 · 0,50 = 0,20 N, oposta à velocidade (Lenz). O agente aplica <b>0,20 N</b>.`],
         ['Potência',`P = R · i² = 4,0 · 0,50² = <b>1,0 W</b>`],
         ['Conferindo pela energia',`Potência do agente = F · v = 0,20 · 5,0 = 1,0 W — igual à dissipada no resistor.`]],
  alt:`Lenz em termos de energia: a corrente só existe porque alguém está empurrando a barra. Todo o trabalho do agente vira calor no resistor (1,0 W).`,
  warn:`“Velocidade constante, então a força é zero” (A) vale sem campo; aqui existe a força magnética de frenagem, que precisa ser equilibrada.` },

{ src:'Original', nivel:'intermediário',
  text:`Um pequeno ímã é solto dentro de um tubo vertical de cobre e leva vários segundos para atravessá-lo. Um bloco de madeira idêntico, solto no mesmo tubo, atravessa quase instantaneamente. Sabe-se que o cobre <b>não</b> é atraído por ímãs. A explicação para a queda lenta do ímã é que:`,
  opts:[`o cobre é atraído pelo ímã, que fica “grudando” nas paredes do tubo.`,`o ar dentro do tubo é comprimido pelo ímã, que é mais denso que a madeira.`,`correntes induzidas no tubo geram campos que freiam o ímã.`,`o ímã fica eletricamente carregado pelo atrito e é atraído pelo tubo.`,`dentro do tubo metálico a gravidade fica blindada e atua com menor intensidade.`],
  ans:2,
  hint:`O fluxo magnético através de cada “anel” do tubo muda enquanto o ímã passa. O que a Lei de Lenz diz sobre isso?`,
  steps:[['Fluxo variando',`Cada trecho do tubo funciona como uma espira fechada. Com o ímã passando, o fluxo nesses anéis varia.`],
         ['Correntes induzidas',`Surgem correntes induzidas no cobre (correntes de Foucault), que é bom condutor.`],
         ['Lenz',`Essas correntes geram campos que repelem o ímã acima e o atraem por trás: o efeito sempre se opõe ao movimento, e o ímã cai devagar.`],
         ['Energia',`A energia potencial perdida pelo ímã vira principalmente calor no tubo, e não energia cinética.`]],
  alt:`É o mesmo princípio do freio magnético de trens e de algumas montanhas-russas: metal condutor + ímã em movimento = frenagem sem contato.`,
  warn:`O cobre não é ferromagnético — ele não é atraído por ímãs parados (A é falsa). O efeito só aparece porque o ímã está em <b>movimento</b>; um ímã parado no tubo não sofre força nenhuma.` },

{ src:'Original', nivel:'intermediário',
  text:`Duas bobinas estão lado a lado, sem contato. A bobina 1 está ligada a uma pilha e a uma chave; a bobina 2, a um galvanômetro de zero central, como no esquema.${FIG_BOBINAS}O que se observa no galvanômetro ao <b>fechar</b> a chave, ao <b>mantê-la fechada</b> e ao <b>abri-la</b>?`,
  opts:[`Desvia ao fechar e permanece desviado enquanto a chave estiver fechada; volta a zero ao abrir.`,`Desvia rapidamente ao fechar, volta a zero e desvia ao contrário ao abrir.`,`Desvia momentaneamente ao fechar e ao abrir, sempre no mesmo sentido.`,`Não desvia em nenhum momento, pois as bobinas não estão ligadas entre si.`,`Permanece em zero ao fechar e só desvia quando a chave é aberta.`],
  ans:1,
  hint:`O galvanômetro só registra corrente enquanto o fluxo na bobina 2 está <b>mudando</b>. Em qual desses momentos a corrente na bobina 1 está variando?`,
  steps:[['Fechar a chave',`A corrente na bobina 1 sobe de zero ao valor final → o fluxo na bobina 2 <b>aumenta</b> → pulso de corrente induzida.`],
         ['Chave fechada',`Corrente constante na bobina 1 → fluxo constante → <b>nenhuma</b> corrente induzida.`],
         ['Abrir a chave',`O fluxo <b>diminui</b> até zero → pulso em sentido <b>oposto</b> ao do fechamento (Lenz).`]],
  alt:`Esse foi o experimento de Faraday em 1831: ele esperava corrente contínua na segunda bobina, mas só viu “trancos” do ponteiro ao ligar e ao desligar.`,
  warn:`A alternativa A troca “campo existindo” por “campo variando”. E o sentido não é o mesmo nos dois pulsos (C): aumentar e diminuir o fluxo provocam reações opostas.` },

{ src:'Original', nivel:'intermediário',
  text:`Uma usina deve enviar 100 kW a uma cidade por uma linha de transmissão de resistência total 2,0 Ω. A tabela mostra o que acontece com a transmissão em 1 000 V e propõe elevar a tensão para 10 000 V com um transformador, mantendo a potência enviada.${TAB_TRANSMISSAO}Com a transmissão em 10 000 V, a potência perdida na linha passa a ser:`,
  opts:[`20 kW`,`2,0 kW`,`200 W`,`20 W`,`200 kW`],
  ans:2,
  hint:`Com a potência fixa, a corrente na linha depende da tensão (P = U · i). E a perda depende do <b>quadrado</b> da corrente.`,
  steps:[['Corrente em 10 kV',`i = ${f('P','U')} = ${f('100 000','10 000')} = 10 A (antes era 100 A)`],
         ['Perda',`P<sub>perdida</sub> = R · i² = 2,0 · 10² = <b>200 W</b>`]],
  alt:`Tensão 10 vezes maior → corrente 10 vezes menor → perda 10² = 100 vezes menor: 20 kW ÷ 100 = 200 W. É por isso que as linhas de transmissão operam em altíssima tensão — e por isso precisamos de transformadores (e de corrente alternada).`,
  warn:`Dividir a perda só por 10 dá 2,0 kW (B). A perda cai com o <b>quadrado</b> da corrente. E não use U²/R com a tensão da usina: a queda de tensão na linha não é 10 000 V.` },

{ src:'Baseada no ENEM 2011', nivel:'intermediário',
  text:`O captador de um baixo elétrico é formado por uma bobina enrolada em torno de um ímã permanente, posicionada logo abaixo das cordas. Um músico trocou as cordas de aço por cordas de <b>cobre</b>, que é excelente condutor elétrico, e o amplificador praticamente deixou de emitir som. Isso aconteceu porque a corda de cobre:`,
  opts:[`conduz tão bem a eletricidade que a corrente induzida escapa por ela antes de chegar à bobina.`,`quase não se magnetiza, e sua vibração pouco altera o fluxo na bobina.`,`vibra com frequência alta demais para ser percebida pelo captador.`,`desmagnetiza o ímã do captador por estar muito próxima dele.`,`precisaria estar ligada eletricamente à bobina para transmitir a vibração.`],
  ans:1,
  hint:`Para induzir corrente, algo precisa fazer o fluxo magnético na bobina variar. Uma corda de aço vibrando faz isso. Por quê? O cobre tem essa mesma propriedade?`,
  steps:[['Como funciona o captador',`O ímã magnetiza a corda de aço logo acima dele: a corda vira um pequeno ímã.`],
         ['Vibração → fluxo variando',`Quando a corda magnetizada vibra, o fluxo na bobina varia no mesmo ritmo, induzindo uma corrente que vai ao amplificador.`],
         ['Com cobre',`O cobre não é ferromagnético: quase não se magnetiza. A corda vibra, mas o fluxo na bobina praticamente não muda → quase nenhuma corrente induzida.`]],
  alt:`O captador “escuta” o magnetismo da corda, não a eletricidade dela. Ser bom condutor não ajuda; o que importa é ser magnetizável (ferro, aço, níquel).`,
  warn:`A armadilha é achar que “bom condutor = bom para eletricidade = bom para o captador”. A corda não faz parte do circuito; a ligação dela com a bobina é só magnética.` },

{ src:'Baseada no ENEM 2014', nivel:'intermediário',
  text:`Na figura, um ímã com o polo norte voltado para uma espira parada se aproxima dela, e surge na espira uma corrente induzida i.${FIG_LENZ2}Usando os mesmos materiais, qual procedimento também produz na espira uma corrente de <b>mesmo sentido</b> que i?`,
  opts:[`Afastar o ímã da espira, mantendo a polaridade.`,`Inverter a polaridade do ímã e aproximá-lo da espira.`,`Inverter a polaridade do ímã e afastá-lo da espira.`,`Mover o ímã e a espira juntos, para a direita, com a mesma velocidade.`,`Deixar o ímã parado bem perto da espira, com a mesma polaridade.`],
  ans:2,
  hint:`Na figura, o fluxo através da espira (linhas saindo do N, apontando para a direita) está <b>aumentando</b>. Procure a situação em que a corrente induzida precise criar o mesmo campo que na figura.`,
  steps:[['Situação da figura',`O campo do ímã na espira aponta para a direita e cresce. Pela Lei de Lenz, a corrente i cria na espira um campo para a <b>esquerda</b>.`],
         ['Polaridade invertida e afastando',`Com o S voltado para a espira, o campo do ímã nela aponta para a esquerda (entrando no polo S). Afastando o ímã, esse campo para a esquerda <b>diminui</b>.`],
         ['Reação',`Para compensar a perda, a corrente induzida cria um campo para a <b>esquerda</b> — o mesmo da figura → mesmo sentido de i. Alternativa C.`]],
  alt:`Duas inversões se cancelam: inverter a polaridade troca o sentido da corrente, e trocar aproximar por afastar troca de novo. Inverter só uma das duas coisas (A ou B) dá o sentido oposto.`,
  warn:`Em D o ímã e a espira andam juntos: não há movimento <b>relativo</b>, o fluxo não muda e não há corrente. Em E o ímã parado também não induz nada.` },

{ src:'Baseada no ENEM 2020', nivel:'intermediário',
  text:`Em um pequeno gerador de uma usina, a tensão de pico nos terminais das bobinas é de 60 V quando o eixo gira a 900 rotações por minuto. Durante uma cheia, a turbina passou a girar a 1 200 rotações por minuto. Mantidos o ímã, as bobinas e as demais características, a nova tensão de pico é:`,
  opts:[`45 V`,`60 V`,`80 V`,`107 V`,`120 V`],
  ans:2,
  hint:`A fem depende da <b>rapidez</b> com que o fluxo varia. O fluxo máximo através das bobinas mudou? E a rapidez?`,
  steps:[['O que não muda',`O fluxo máximo (N · B · A) é o mesmo: mesmo ímã, mesmas bobinas.`],
         ['O que muda',`Girando mais rápido, o fluxo vai do máximo ao mínimo em menos tempo: ε<sub>máx</sub> = N · B · A · ω é proporcional à rotação.`],
         ['Proporção',`ε = 60 · ${f('1 200','900')} = 60 · ${f('4','3')} = <b>80 V</b>`]],
  alt:`Mesma variação de fluxo em 3/4 do tempo → fem 4/3 maior. É a Lei de Faraday aplicada ao gerador: ΔΦ igual, Δt menor.`,
  warn:`Achar que a tensão não muda porque “o ímã é o mesmo” (B) confunde fluxo com variação de fluxo. Elevar a razão ao quadrado dá ≈ 107 V (D) — a dependência com a rotação é linear.` },

{ src:'Baseada no ENEM 2017', nivel:'intermediário',

const lorentz = (f0, g, a, b) => { const p = []; for (let k = 0; k <= 100; k++){ const x = a + (b - a) * k / 100; p.push([+x.toFixed(1), +(1 / (1 + ((x - f0) / g) ** 2)).toFixed(4)]); } return p; };

const ondaPiano = (() => { const p = []; for (let k = 0; k <= 160; k++){ const x = 8 * k / 160; p.push([+x.toFixed(3), +(Math.sin(2*Math.PI*x/4) + 0.25*Math.sin(4*Math.PI*x/4)).toFixed(3)]); } return p; })();
const ondaViolino = (() => { const p = []; for (let k = 0; k <= 160; k++){ const x = 8 * k / 160; let y = 0; for (let n = 1; n <= 7; n++) y += Math.sin(2*Math.PI*n*x/4) / n; p.push([+x.toFixed(3), +(0.7 * y).toFixed(3)]); } return p; })();

  opts: ['I.','II.','III.','IV.','V.'], ans: 1,
  hint: 'Pela segunda lei de Ohm, R = ρ · L/A. Como o material é o mesmo, compare a razão L/A de cada extensão.',
  steps: [['Segunda lei de Ohm', '<p>Mesmo material (mesmo ρ): a resistência é proporcional a L/A. Fio <b>curto</b> e <b>grosso</b> tem menor resistência.</p>'],

{ src: 'Inédita', nivel: 'básico',
  text: '<p>Em uma aula de laboratório, um estudante monta um circuito com uma pilha e uma pequena lâmpada. Ele quer medir, ao mesmo tempo, a corrente elétrica que atravessa a lâmpada e a tensão elétrica entre os terminais dela, usando um amperímetro e um voltímetro.</p><p>Para fazer as medidas corretamente, ele deve ligar</p>',
  opts: ['o amperímetro e o voltímetro em série com a lâmpada.','o amperímetro em paralelo e o voltímetro em série com a lâmpada.','o amperímetro em série e o voltímetro em paralelo com a lâmpada.','o amperímetro e o voltímetro em paralelo com a lâmpada.','o amperímetro em paralelo com a pilha e o voltímetro em série com a lâmpada, para não interferir na corrente.'], ans: 2,
  hint: 'Para medir corrente, ela precisa passar por dentro do medidor. Para medir tensão, o medidor compara dois pontos.',
  steps: [['Amperímetro', '<p>A corrente da lâmpada tem de atravessar o aparelho: ligação <b>em série</b>. Ele tem resistência muito pequena, para não alterar a corrente.</p>'],
          ['Voltímetro', '<p>Mede a diferença de potencial entre os terminais da lâmpada: ligação <b>em paralelo</b>. Ele tem resistência muito grande, para quase não desviar corrente.</p>']],
  alt: 'Um amperímetro ligado em paralelo funciona como um curto-circuito (resistência quase nula): pode queimar o fusível do aparelho ou descarregar a pilha.',
  warn: erros([['A)','em série, o voltímetro, de resistência enorme, praticamente corta a corrente.'],['B)','inverte as duas ligações.'],['D)','em paralelo, o amperímetro provoca um curto-circuito.'],['E)','amperímetro em paralelo com a pilha é um curto-circuito.']]) },

{ src: 'Inédita', nivel: 'intermediário',
  text: '<p>Uma lanterna funciona com três pilhas de 1,5 V ligadas em série e uma lâmpada de 4,5 V e 0,9 W. Cada pilha tem capacidade de 2 000 mAh, ou seja, pode fornecer uma corrente de 2 000 mA durante 1 hora (ou uma corrente menor por mais tempo).</p><p>Com a lâmpada funcionando nas condições nominais, a lanterna fica acesa por, aproximadamente,</p>',
  opts: ['2,2 h.','3,3 h.','6,7 h.','10 h.','30 h.'], ans: 3,
  hint: 'Calcule a corrente na lâmpada (P = U · i). Em série, a mesma corrente atravessa as três pilhas.',
  steps: [['Corrente', `<div class="eq">i = ${f('P','U')} = ${f('0,9','4,5')} = 0,2 A = 200 mA</div>`],
          ['Série', '<p>Em série, a tensão das pilhas se soma (4,5 V), mas a mesma corrente atravessa todas elas: cada pilha fornece os 200 mA.</p>'],
          ['Duração', `<div class="eq">Δt = ${f('2 000 mAh','200 mA')} = 10 h</div>`]],
  alt: 'Associar pilhas em série aumenta a tensão; em paralelo, a tensão fica a de uma pilha, mas a carga disponível (e a duração) aumenta.',
  warn: erros([['A) 2,2 h:','divide a capacidade (2 Ah) pela potência (0,9 W), misturando grandezas.'],['B) 3,3 h:','divide o tempo pelas três pilhas.'],['E) 30 h:','soma a capacidade das três pilhas, como se estivessem em paralelo.']]) },

{ src: 'Inédita', nivel: 'intermediário',
  text: '<p>Uma pessoa se muda para uma cidade onde a rede elétrica é de 220 V e leva seu chuveiro, de 5 500 W, fabricado para funcionar em 127 V. Antes de instalar, ela pergunta a um técnico o que aconteceria se o chuveiro fosse ligado diretamente na rede nova. Considere que a resistência do chuveiro não varia.</p><p>Ligado em 220 V, a potência do chuveiro passaria a ser de, aproximadamente,</p>',
  opts: ['3 200 W.','5 500 W.','9 500 W.','16 500 W.','28 600 W.'], ans: 3,
  hint: 'Com a resistência fixa, use P = U²/R: a potência é proporcional ao quadrado da tensão.',
  steps: [['Razão das tensões', `<div class="eq">${f('220','127')} ≈ 1,73</div>`],
          ['Potência', '<p>Com R fixa, P ∝ U²:</p><div class="eq">P′ = 5 500 × 1,73² ≈ 5 500 × 3 ≈ 16 500 W</div><p>O triplo da potência de projeto: a resistência queima em pouco tempo.</p>']],
  alt: 'Para usar a mesma potência em 220 V, a resistência teria de ser cerca de 3 vezes maior. Por isso existem chuveiros específicos para cada tensão, e a solução segura é trocar o aparelho, com instalação feita por profissional habilitado.',
  warn: erros([['A) 3 200 W:','inverte a razão das tensões (127/220) e esquece o quadrado.'],['B) 5 500 W:','acha que a potência não depende da tensão.'],['C) 9 500 W:','usa a razão das tensões sem elevar ao quadrado.'],['E) 28 600 W:','eleva a razão das tensões ao cubo.']]) },

{ src: 'Inédita', nivel: 'intermediário',
  text: `<p>Um aquecedor de ambiente tem dois resistores iguais, de 20 Ω cada, e uma chave seletora de três posições, descritas no quadro. Ele é ligado em 220 V.</p>
${tabela(['Posição','Ligação'],[['Mínima','os dois resistores em série'],['Média','apenas um resistor'],['Máxima','os dois resistores em paralelo']])}
<p>As potências do aquecedor nas posições mínima e máxima são, respectivamente,</p>`,
  opts: ['1 210 W e 2 420 W.','1 210 W e 4 840 W.','2 420 W e 4 840 W.','4 840 W e 1 210 W.','605 W e 2 420 W.'], ans: 1,
  hint: 'Calcule a resistência equivalente de cada posição e use P = U²/R. Atenção: menor resistência significa maior potência.',
  steps: [['Resistências equivalentes', '<p>Série: 20 + 20 = 40 Ω. Paralelo: 20/2 = 10 Ω.</p>'],
          ['Potências', `<div class="eq">P<sub>mín</sub> = ${f('220²','40')} = 1 210 W</div><div class="eq">P<sub>máx</sub> = ${f('220²','10')} = 4 840 W</div>`]],
  alt: 'Com tensão fixa, quanto menor a resistência, maior a corrente e maior a potência. Por isso a posição “mais quente” é a de resistores em paralelo, e não em série.',
  warn: erros([['A) 1 210 W e 2 420 W:','dá a potência da posição média como máxima.'],['C) 2 420 W e 4 840 W:','dá a posição média como mínima.'],['D) 4 840 W e 1 210 W:','acha que mais resistência dá mais calor.'],['E) 605 W e 2 420 W:','usa 80 Ω para a associação em série.']]) },

{ src: 'Inédita', nivel: 'intermediário',
  text: '<p>A bateria de um patinete elétrico tem tensão de 36 V e capacidade de 10 Ah. Em uso típico na cidade, o patinete consome 12 Wh de energia por quilômetro rodado.</p><p>Com a bateria totalmente carregada, a autonomia do patinete é de, aproximadamente,</p>',
  opts: ['0,83 km.','3,0 km.','30 km.','360 km.','4 320 km.'], ans: 2,
  hint: 'A energia guardada na bateria é tensão × carga. Com ela em Wh, compare com o consumo por quilômetro.',
  steps: [['Energia da bateria', '<div class="eq">E = U · Q = 36 V × 10 Ah = 360 Wh</div>'],
          ['Autonomia', `<div class="eq">${f('360 Wh','12 Wh/km')} = 30 km</div>`]],
  alt: 'Ampère-hora mede carga elétrica, não energia. Só multiplicando pela tensão se obtém a energia em watt-hora. É a mesma conta para celulares, notebooks e carros elétricos (que usam kWh).',
  warn: erros([['A) 0,83 km:','divide a carga (10 Ah) pelo consumo, sem usar a tensão.'],['B) 3,0 km:','divide a tensão pelo consumo.'],['D) 360 km:','lê a energia (360 Wh) como a distância.'],['E) 4 320 km:','multiplica a energia pelo consumo.']]) },

{ src: 'Inédita', nivel: 'avançado',
  text: `<p>Para iluminar uma maquete, um estudante montou o circuito da figura com três lâmpadas idênticas e uma bateria de resistência interna desprezível. Considere que a resistência das lâmpadas não varia.</p>
${FIG_LAMPADAS}
<p>Se a lâmpada L3 for retirada do soquete, o brilho das lâmpadas L1 e L2 passa a ser:</p>`,
  opts: ['L1 e L2 brilham mais.','L1 e L2 brilham menos.','L1 brilha mais e L2 brilha menos.','L1 brilha menos e L2 brilha mais.','L1 não muda e L2 brilha mais, pois recebe a corrente que ia para L3.'], ans: 3,
  hint: 'Calcule a resistência equivalente antes e depois. Depois compare a corrente em cada lâmpada: o brilho depende de P = R · i².',
  steps: [['Antes', '<p>R<sub>eq</sub> = R + R/2 = 1,5R → corrente total i = ε/1,5R ≈ 0,67 ε/R.<br>L1 recebe 0,67 ε/R; L2 recebe metade: 0,33 ε/R.</p>'],
          ['Depois', '<p>Sem L3, L1 e L2 ficam em série: R<sub>eq</sub> = 2R → i = 0,5 ε/R nas duas.</p>'],
          ['Comparação', '<p>L1: de 0,67 para 0,50 ε/R → <b>brilha menos</b>. L2: de 0,33 para 0,50 ε/R → <b>brilha mais</b>.</p>']],
  alt: 'Retirar uma lâmpada em paralelo aumenta a resistência total: a corrente da bateria diminui (L1 enfraquece), e a tensão que sobra para L2 aumenta (L2 fortalece). Pensar só “a corrente de L3 vai toda para L2” esquece que a corrente total também muda.',
  warn: erros([['A)','a resistência total aumenta; a corrente de L1 não pode crescer.'],['B)','L2 passa a ter mais tensão e mais corrente.'],['C)','inverte os dois efeitos.'],['E)','a corrente total da bateria muda; L1 é afetada.']]) },

{ src: 'Inédita', nivel: 'avançado',
  text: '<p>A bateria de um carro tem força eletromotriz de 12 V e resistência interna de 0,05 Ω. Ao dar a partida, o motor de arranque solicita uma corrente de 100 A. Muitos motoristas notam que, nesse momento, os faróis acesos ficam bem mais fracos.</p><p>Durante a partida, a tensão nos terminais da bateria e o efeito nos faróis são:</p>',
  opts: ['12 V; os faróis não mudam.','7,0 V; os faróis ficam mais fracos.','5,0 V; os faróis ficam mais fracos.','17 V; os faróis ficam mais fortes.','7,0 V; os faróis ficam mais fortes, pois a corrente total da bateria aumenta.'], ans: 1,
  hint: 'Num gerador real, parte da tensão “fica” na resistência interna: U = ε − r · i.',
  steps: [['Tensão nos terminais', '<div class="eq">U = ε − r · i = 12 − 0,05 × 100 = 12 − 5 = 7,0 V</div>'],
          ['Faróis', '<p>Os faróis estão ligados aos terminais da bateria. Com a tensão caindo de 12 V para 7 V, a potência deles (P = U²/R) cai para cerca de (7/12)² ≈ 34% do normal: brilham bem menos.</p>']],
  alt: 'Com a corrente pequena dos faróis, a queda na resistência interna é desprezível e a bateria entrega quase 12 V. Só a corrente enorme do motor de arranque torna a queda importante.',
  warn: erros([['A) 12 V:','ignora a resistência interna.'],['C) 5,0 V:','dá a queda na resistência interna, não a tensão nos terminais.'],['D) 17 V:','soma a queda em vez de subtrair.'],['E)','acerta a tensão, mas o brilho depende da tensão nos faróis, que diminuiu.']]) },

{ src: 'Inédita', nivel: 'avançado',
  text: `<p>Em uma estufa, a temperatura é monitorada por um sensor resistivo R<sub>S</sub> instalado em uma ponte de Wheatstone, como no esquema. O técnico ajusta o circuito e percebe que o galvanômetro G não indica corrente (ponte em equilíbrio).</p>

const getAluno = () => { try { const a = JSON.parse(localStorage.getItem(ID_KEY) || 'null'); return a && a.email ? a : null; } catch(e){ return null; } };

function enviar(ev){
  const a = getAluno(); if (!CONFIG.registro || !a) return;
  const item = Object.assign({ email: a.email, turma: a.turma, quando: new Date().toISOString(), dispositivo: /mobi|android|iphone|ipad/i.test(navigator.userAgent) ? 'celular/tablet' : 'computador' }, ev);

  enviarFila();
}
let enviando = false;
async function enviarFila(){
  if (!CONFIG.registro || enviando || navigator.onLine === false) return;
  enviando = true;
  try {
    let fila = []; try { fila = JSON.parse(localStorage.getItem(FILA_KEY) || '[]'); } catch(e){}
    while (fila.length){
      await fetch(CONFIG.registro, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(fila[0]) });
      fila.shift(); try { localStorage.setItem(FILA_KEY, JSON.stringify(fila)); } catch(e){}
    }
  } catch(e){} finally { enviando = false; }
}
window.addEventListener('online', enviarFila);
function registrarAcessoDoDia(){
  const a = getAluno(); if (!CONFIG.registro || !a) return;

const lvKey = n => ({'básico':'b','básico+':'bp','intermediário':'i','avançado':'a'})[n] || 'b';
function levelGroups(){
  const g = [];
  LI.Q.forEach((q, i) => { if (!q.nivel) return; const last = g[g.length-1]; if (last && last.n === q.nivel && last.end === i) last.end = i + 1; else g.push({ n: q.nivel, start: i, end: i + 1 }); });
  return g;
}
function levelRow(){
  const g = levelGroups(); if (!g.length) return '';
  return `<div class="lvrow" style="grid-template-columns:repeat(${LI.Q.length},1fr)">${g.map(x => `<span class="lv-${lvKey(x.n)}" style="grid-column:${x.start+1} / ${x.end+1}">${x.n}</span>`).join('')}</div>`;
}
function levelSummary(){
  const g = levelGroups(); if (!g.length) return '';
  const c = {}; g.forEach(x => c[x.n] = (c[x.n] || 0) + (x.end - x.start));
  return `<div class="row" style="gap:6px">${Object.keys(c).map(n => `<span class="lvl lvl-${lvKey(n)}">${c[n]} ${n === 'básico' ? (c[n]>1?'básicas':'básica') : n === 'básico+' ? 'Básico+' : n === 'intermediário' ? (c[n]>1?'intermediárias':'intermediária') : (c[n]>1?'avançadas':'avançada')}</span>`).join('')}</div>`;
}
const save = () => store(LI.key, st);
function resumoLista(){
  const porNivel = n => { const idx = LI.Q.map((q,i) => i).filter(i => LI.Q[i].nivel === n); return idx.length ? idx.filter(i => status(i) === 'ok').length + '/' + idx.length : ''; };
  return {
    evento: 'lista concluída', tema: T.nome, lista: 'Lista ' + LI.num,
    acertos: correctCount(), total: LI.Q.length,
    basico: [porNivel('básico'), porNivel('básico+')].filter(Boolean).join(' + '), intermediario: porNivel('intermediário'), avancado: porNivel('avançado'),
    erradas: LI.Q.map((q,i) => i).filter(i => status(i) !== 'ok').map(i => i + 1).join(', '),
    dicas: Object.keys(st.hints || {}).filter(k => st.hints[k]).length,
    tempoMin: Math.round((st.tempo || 0) / 6) / 10
  };
}
function status(i){ const a = st.answers[i]; if (a === undefined) return 'none'; return a === LI.Q[i].ans ? 'ok' : 'bad'; }
function correctCount(){ return LI.Q.reduce((n,_,i)=> n + (status(i)==='ok'?1:0), 0); }
function answeredCount(){ return LI.Q.reduce((n,_,i)=> n + (status(i)!=='none'?1:0), 0); }

function renderRoad(){
  const Q = LI.Q;
  $('marks').innerHTML = Q.map((_,i)=>{
    const s = status(i);
    const cls = ['mk', s==='ok'?'ok':s==='bad'?'bad':'', st.cur===i?'cur':''].join(' ');
    const lab = s==='ok'?'certa':s==='bad'?'errada':'não respondida';
    return `<button class="${cls}" data-go="${i}" aria-label="Questão ${i+1}, ${lab}">${i+1}</button>`;
  }).join('');
  const pos = st.cur < 0 ? 0 : st.cur >= Q.length ? Q.length - 0.5 : st.cur + 0.5;
  const lane = $('lane'), pct = (pos/Q.length)*100;
  if (lane.dataset.estilo === 'estrada') $('car').style.left = `calc(${pct}% + ${st.cur<0?17:0}px)`;
  else { lane.style.setProperty('--p', pct.toFixed(2)); lane.querySelector('.ln-fill').style.clipPath = `inset(0 ${(100 - pct).toFixed(2)}% 0 0)`; }
  const n = answeredCount();
  $('roadLabel').textContent = st.cur>=0 && st.cur<Q.length ? `Questão ${st.cur+1} de ${Q.length}` : `Percurso: ${Q.length} questões`;
  $('roadScore').textContent = n ? `${correctCount()} de ${n} certas` : '';
}

function renderIntro(){
  const Q = LI.Q, n = answeredCount();
  $('qa').innerHTML = `
  <section class="card intro">
    <div class="qnum">Antes de começar</div>
    <p>São <b>${Q.length} questões</b> sobre ${LI.titulo.toLowerCase()}. ${LI.intro || ''}</p>${levelSummary()}
    <ul>
      <li>Responda uma questão por vez. Logo depois, aparece a <b>resolução detalhada</b>, passo a passo.</li>
      <li>Travou? Use o botão <b>Ver dica</b> antes de responder.</li>
      <li>A <b>caixa de ferramentas</b> acima tem as fórmulas e conversões que você vai usar.</li>
      <li>Tenha papel e lápis à mão e tente resolver antes de clicar na alternativa.</li>
    </ul>
    <div class="row">
      <button class="btn primary" id="startBtn">${n && n < Q.length ? 'Continuar de onde parei' : n === Q.length ? 'Ver meu resultado' : 'Começar a questão 1'}</button>
      ${n ? `<span class="small">${n} de ${Q.length} questões respondidas neste aparelho.</span>` : ''}
    </div>
  </section>`;
  $('startBtn').onclick = () => {
    if (n === Q.length) goQ(Q.length);
    else { const next = Q.findIndex((_,i)=>status(i)==='none'); goQ(next < 0 ? 0 : next); }
  };
}

function renderQuestion(i){
  const Q = LI.Q, q = Q[i], a = st.answers[i], done = a !== undefined, skipped = a === -1;
  const opts = q.opts.map((o,k)=>{
    let cls = 'opt', tag = '';
    if (done){
      if (k === q.ans){ cls += ' is-correct'; tag = '<span class="tag">✓ correta</span>'; }
      else if (k === a){ cls += ' is-wrong'; tag = '<span class="tag">✗ sua resposta</span>'; }
      else cls += ' is-dim';
    }
    return `<li><button class="${cls}" data-pick="${k}" ${done?'disabled':''}><span class="letter">${L[k]}</span><span>${o}</span>${tag}</button></li>`;
  }).join('');
  let fb = '';
  if (done){
    fb = a === q.ans
      ? `<div class="feedback good" role="status"><span class="ico">✓</span>Correto! Confira a resolução para ver se o seu raciocínio bate.</div>`
      : skipped
        ? `<div class="feedback bad" role="status"><span class="ico">→</span>Sem problema. Acompanhe a resolução com calma e tente refazer no papel.</div>`
        : `<div class="feedback bad" role="status"><span class="ico">✗</span>Não foi dessa vez. A resposta certa é a ${L[q.ans]}. Veja onde o raciocínio muda.</div>`;
  }
  const sol = done ? `
    <section class="sol" aria-label="Resolução detalhada">
      <h3>Resolução detalhada</h3>
      <ol class="steps">
        ${q.steps.map(([lab,html])=>`<li class="step"><div class="step-body"><div class="step-label">${lab}</div>${html}</div></li>`).join('')}
      </ol>
      <div class="answer"><span class="letter">${L[q.ans]}</span><span>Resposta: alternativa ${L[q.ans]} (${q.opts[q.ans]})</span></div>
      ${q.alt ? `<div class="alt"><b class="lbl">Outro jeito de pensar</b>${q.alt}</div>` : ''}
      ${q.warn ? `<div class="warn"><b class="lbl">Cuidado com a pegadinha</b>${q.warn}</div>` : ''}
    </section>` : '';
  const showHint = st.hints[i] && !done;
  const last = i === Q.length - 1;
  $('qa').innerHTML = `
  <article class="card">
    <div class="qhead">
      <div class="qnum">Questão ${i+1} <span>/ ${Q.length}</span></div>
      <span class="row" style="gap:6px">${q.nivel ? `<span class="lvl lvl-${lvKey(q.nivel)}">Nível ${q.nivel === 'básico+' ? 'Básico+' : q.nivel}</span>` : ''}<span class="src">${q.src}</span></span>
    </div>
    <div class="stmt">${q.text}</div>
    <ul class="opts">${opts}</ul>
    ${!done ? `<div class="row">
        ${showHint ? '' : `<button class="btn" id="hintBtn">Ver dica</button>`}
        <span class="spacer"></span>
        <button class="btn ghost" id="skipBtn">Não sei, mostrar a resolução</button>
      </div>` : ''}
    ${showHint ? `<div class="tip"><b>Dica</b>${q.hint}</div>` : ''}
    ${fb}
    ${sol}
    <div class="row">
      ${i > 0 ? `<button class="btn" id="prevBtn">← Anterior</button>` : ''}
      <span class="spacer"></span>
      ${done ? `<button class="btn primary" id="nextBtn">${last ? 'Ver meu resultado' : 'Próxima questão →'}</button>`
             : (!last ? `<button class="btn ghost" id="jumpBtn">Pular por enquanto</button>` : '')}
    </div>
  </article>`;
  $('qa').querySelectorAll('[data-pick]').forEach(b => b.onclick = () => answer(i, +b.dataset.pick));
  const h = $('hintBtn'); if (h) h.onclick = () => { st.hints[i] = true; save(); renderQuestion(i); };
  const s = $('skipBtn'); if (s) s.onclick = () => answer(i, -1);
  const p = $('prevBtn'); if (p) p.onclick = () => goQ(i - 1);
  const n = $('nextBtn'); if (n) n.onclick = () => goQ(i + 1);
  const j = $('jumpBtn'); if (j) j.onclick = () => goQ(i + 1);
}

function answer(i, k){
  if (st.answers[i] !== undefined) return;
  st.answers[i] = k; save();
  if (answeredCount() === LI.Q.length && !st.enviado){ contarTempo(); st.enviado = true; save(); enviar(resumoLista()); }
  renderRoad(); renderQuestion(i);
  const fb = $('qa').querySelector('.feedback');
  if (fb) fb.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
}

function renderEnd(){
  const Q = LI.Q, c = correctCount(), n = answeredCount();
  const msg = n < Q.length
    ? `Você ainda tem ${Q.length - n} questão(ões) sem responder. Toque nelas abaixo para terminar.`
    : c >= Math.ceil(Q.length * 0.9) ? 'Excelente! Você domina este conteúdo. Releia as pegadinhas para chegar ao ENEM ainda mais seguro.'
    : c >= Math.ceil(Q.length * 0.6) ? 'Bom trabalho. Revise as questões que errou e leia com atenção as pegadinhas: é onde mais se perde ponto.'
    : 'Vale revisar a caixa de ferramentas e refazer as questões com calma, acompanhando cada passo da resolução, antes do ENEM.';
  $('qa').innerHTML = `
  <section class="card">
    <div class="qnum">Resultado</div>
    <div class="score">${c}<span> / ${Q.length}</span></div>
    <p style="margin:0">${msg}</p>
    <ul class="reslist">
      ${Q.map((q,i)=>{ const s = status(i); const t = s==='ok'?'✓ certa':s==='bad'?(st.answers[i]===-1?'→ vista':'✗ errada'):'— pendente';
        return `<li><button class="res ${s}" data-go="${i}"><b>Questão ${i+1}</b><span class="st">${t}</span></button></li>`; }).join('')}
    </ul>
    <div class="row">
      <button class="btn" id="resetBtn">Refazer a lista do zero</button>
      <button class="btn primary" data-nav="tema">Voltar para ${T.nome}</button>
      <span class="small" id="resetNote"></span>
    </div>
  </section>`;
  const r = $('resetBtn'); let armed = false;
  r.onclick = () => {
    if (!armed){ armed = true; r.textContent = 'Confirmar: apagar minhas respostas'; $('resetNote').textContent = 'Toque de novo para confirmar.'; return; }
    st = { answers:{}, hints:{}, cur:-1, tempo:0 }; save(); goQ(-1);
  };
}

function goQ(i){
  st.cur = i; save();
  renderRoad();
  if (i < 0) renderIntro();
  else if (i >= LI.Q.length) renderEnd();
  else renderQuestion(i);
  toTop();
}

  abrirConsulta('Pegadinhas clássicas', 'Os erros que mais derrubam e como evitar cada um.', migConsulta('Pegadinhas clássicas'));
  $('view').innerHTML = `
    <section class="card intro"><p>As alternativas erradas do ENEM costumam ser exatamente o resultado destes erros. Antes de marcar, confira se não caiu em nenhum deles.</p>
      <div class="row" style="gap:6px">${PEGADINHAS.map((s, i) => `<a class="chip chip-link" href="#/consulta/pegadinhas" data-sec="${i}">${s.nome}</a>`).join('')}</div></section>
    ${PEGADINHAS.map((s, i) => `<section class="card formsec" id="sec${i}"><h2 class="formh">${s.nome}</h2>
      <div class="tools-grid form-grid">${s.itens.map(([t, h]) => `<div class="tool tool-main"><h4>${t}</h4><div>${h}</div></div>`).join('')}</div></section>`).join('')}
    ${outrasConsultas('pegadinhas')}`;
  toTop();
}

/* ===== Navegação com endereço próprio (#/tema/lista) e botão Voltar do celular ===== */
function go(h){ if (location.hash === h) route(); else location.hash = h; }
function openLogin(){
  contarTempo(); tMarca = null; T = LI = null;
  plate(`Física · ${SITE.escola}`, SITE.apelido, `${SITE.turma} · ${SITE.turmas.replace('Turmas ', '')} · ${SITE.prof}`);
  crumbs(null);
  $('view').innerHTML = `
    <form class="card intro" id="loginForm" novalidate>
      <p class="sect-label">Identificação</p>
      <p>Para usar as listas, informe o seu <b>e-mail do colégio</b> e a sua turma. Você só faz isso uma vez neste aparelho.</p>
      <label class="fld"><span>E-mail do colégio <small class="fld-dica">(só a parte antes do @)</small></span>
        <span class="emailbox">
          <input id="loginEmail" type="text" inputmode="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="nome.sobrenome" required>
          <span class="dom" aria-hidden="true">@${CONFIG.dominio.replace('.', '.<wbr>')}</span>
        </span></label>
      <label class="fld"><span>Turma</span>
        <select id="loginTurma" required><option value="">Escolha</option>${CONFIG.turmas.map(t => `<option value="${t}">${t}</option>`).join('')}</select></label>
      <p class="small" id="loginErro" role="alert"></p>
      <div class="row"><button class="btn primary" type="submit">Entrar</button></div>
      <p class="note">O professor recebe o seu e-mail, a turma, a data de acesso e os resultados das listas (acertos, tempo e dicas usadas), só para acompanhar os estudos da turma.</p>
    </form>`;
  $('loginForm').onsubmit = e => {
    e.preventDefault();
    let usuario = $('loginEmail').value.trim().toLowerCase().replace(/\s+/g, '');
    const dom = '@' + CONFIG.dominio.toLowerCase().replace(/^@/, '');
    if (usuario.endsWith(dom)) usuario = usuario.slice(0, -dom.length);   // se digitou o e-mail inteiro, aproveita
    const email = usuario + dom, turma = $('loginTurma').value;
    if (!usuario){ $('loginErro').textContent = 'Escreva a parte do seu e-mail antes do @.'; $('loginEmail').focus(); return; }
    if (usuario.includes('@') || !emailValido(email)){ $('loginErro').textContent = `Escreva só a parte antes do @. O resto (${dom}) já está preenchido.`; $('loginEmail').focus(); return; }
    if (!turma){ $('loginErro').textContent = 'Escolha a sua turma.'; $('loginTurma').focus(); return; }
    setAluno({ email, turma }); registrarAcessoDoDia(); route();
  };
  toTop();
}
function route(){
  if (precisaLogin()){ openLogin(); return; }
  registrarAcessoDoDia(); enviarFila();
  const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  document.documentElement.classList.remove('th-form');
  if (p[0] === 'formulario'){ location.replace('#/consulta/formulario'); return; }
  if (p[0] === 'consulta'){
    const pg = { formulario: openFormulario, prefixos: openPrefixos, grandezas: openGrandezas, constantes: openConstantes, pistas: openPistas, pegadinhas: openPegadinhas }[p[1]];
    (pg || openConsultaHub)(); return;
  }
  const ti = SITE.temas.findIndex(t => t.id === p[0]);
  if (ti < 0){ openHome(); return; }
  if (!p[1]){ openTema(ti); return; }
  const li = SITE.temas[ti].listas.findIndex(l => l.id === p[1]);
  if (li < 0){ openTema(ti); return; }
  T = SITE.temas[ti]; openLista(li);
}
window.addEventListener('hashchange', route);
document.addEventListener('click', e => {
  const cs = e.target.closest('[data-consulta]'); if (cs){ go('#/consulta' + (cs.dataset.consulta ? '/' + cs.dataset.consulta : '')); return; }
  const sc = e.target.closest('[data-sec]'); if (sc){ e.preventDefault(); const el = $('sec' + sc.dataset.sec); if (el) el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); return; }
  const act = e.target.closest('[data-act="sair"]'); if (act){ setAluno(null); try { localStorage.removeItem(DIA_KEY); } catch(err){} go('#/'); route(); return; }
  const nav = e.target.closest('[data-nav]');
  if (nav){ go(nav.dataset.nav === 'tema' && T ? '#/' + T.id : '#/'); return; }
  const t = e.target.closest('[data-tema]'); if (t){ go('#/' + SITE.temas[+t.dataset.tema].id); return; }
  const l = e.target.closest('[data-lista]'); if (l){ go('#/' + T.id + '/' + T.listas[+l.dataset.lista].id); return; }
  const g = e.target.closest('[data-go]'); if (g && LI){ goQ(+g.dataset.go); }
});

/* ===== Instalação como aplicativo ===== */
let installEvt = null;
const standalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; showInstall(); });
window.addEventListener('appinstalled', () => { installEvt = null; const c = $('installCard'); if (c) c.hidden = true; });
function showInstall(){
  const c = $('installCard'); if (!c || standalone()) return;
  if (installEvt){
    c.hidden = false;
    c.innerHTML = `<p class="sect-label">Instale no celular</p><p>Tenha as listas como um aplicativo: ícone na tela inicial e funcionando mesmo sem internet.</p><div class="row"><button class="btn primary" id="instBtn">Instalar o app</button></div>`;
    $('instBtn').onclick = async () => { installEvt.prompt(); try { await installEvt.userChoice; } catch(e){} installEvt = null; c.hidden = true; };
  } else if (isIOS){
    c.hidden = false;
    c.innerHTML = `<p class="sect-label">Instale no iPhone</p><p>No Safari, toque em <b>Compartilhar</b> (o quadrado com a seta para cima) e depois em <b>Adicionar à Tela de Início</b>.</p>`;
  }
}

if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
route();

</script>
