<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Física 3ª Série CIB</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7A1F2B">
<meta name="description" content="Aulão de Física e listas interativas para a reta final do ENEM, 3ª série do Colégio Israelita Brasileiro.">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Física 3ª">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
--bg:#EDF0F3; --surface:#FFFFFF; --ink:#141B22; --muted:#55616D; --line:#D2D9E0;
--sign:#1D4E89; --sign-ink:#FFFFFF; --lane:#F2B705; --road:#2A3037; --road-ink:#F3F5F7;
--ok:#1B7A45; --ok-bg:#E2F2E8; --bad:#B23A25; --bad-bg:#FAE8E3;
--tip-bg:#FFF5D6; --tip-ink:#5E4500; --mark-ok:#2FA463; --mark-bad:#D9553B;
--eq-bg:#F3F5F8;
--f-display:'Barlow Condensed','Arial Narrow',sans-serif;
--f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
--f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){
--bg:#0F141A; --surface:#17202A; --ink:#E6ECF2; --muted:#98A5B2; --line:#2A3542;
--sign:#2C63A8; --sign-ink:#FFFFFF; --lane:#F2C230; --road:#0A0E12; --road-ink:#F3F5F7;
--ok:#5CCB8D; --ok-bg:#15301F; --bad:#F28C74; --bad-bg:#3A1C16;
--tip-bg:#2D2610; --tip-ink:#F2D27A; --mark-ok:#2FA463; --mark-bad:#D9553B;
--eq-bg:#111922; color-scheme:dark;
}
}
:root[data-theme="dark"]{
--bg:#0F141A; --surface:#17202A; --ink:#E6ECF2; --muted:#98A5B2; --line:#2A3542;
--sign:#2C63A8; --sign-ink:#FFFFFF; --lane:#F2C230; --road:#0A0E12; --road-ink:#F3F5F7;
--ok:#5CCB8D; --ok-bg:#15301F; --bad:#F28C74; --bad-bg:#3A1C16;
--tip-bg:#2D2610; --tip-ink:#F2D27A; --mark-ok:#2FA463; --mark-bad:#D9553B;
--eq-bg:#111922; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--lane);outline-offset:2px}
.plate{background:var(--sign);color:var(--sign-ink);border-radius:12px;padding:6px}
.plate-inner{border:2px solid var(--sign-ink);border-radius:8px;padding:14px 18px 16px;display:flex;flex-direction:column;gap:2px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.plate h1{font-family:var(--f-display);font-weight:700;font-size:clamp(38px,9vw,52px);line-height:1;margin:6px 0 0;letter-spacing:.01em;text-wrap:balance}
.plate p{margin:4px 0 0;font-size:17px;opacity:.95}
.road{background:var(--road);color:var(--road-ink);border-radius:10px;padding:10px 10px 12px;position:relative;overflow:hidden}
.road-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.85;margin-bottom:6px}
.lane{position:relative;height:26px}
.lane::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;transform:translateY(-50%);background:repeating-linear-gradient(90deg,var(--lane) 0 14px,transparent 14px 26px);opacity:.9}
.car{position:absolute;top:50%;transform:translate(-50%,-50%);transition:left .5s ease;width:34px;height:20px}
.marks{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:6px}
.mk{height:32px;border-radius:5px;border:1.5px solid rgba(243,245,247,.35);background:transparent;color:var(--road-ink);font-family:var(--f-mono);font-size:13px;font-weight:600;padding:0;min-width:0}
.mk.ok{background:var(--mark-ok);border-color:var(--mark-ok)}
.mk.bad{background:var(--mark-bad);border-color:var(--mark-bad)}
.mk.cur{outline:2.5px solid var(--lane);outline-offset:1px}
.tools{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.tools summary{padding:14px 18px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
.tools summary::-webkit-details-marker{display:none}
.tools summary .chev{font-family:var(--f-mono);color:var(--muted);transition:transform .2s}
.tools[open] summary .chev{transform:rotate(90deg)}
.tools-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px;padding:0 18px 18px}
.tool{background:var(--eq-bg);border-radius:8px;padding:12px 14px;min-width:0}
.tool h4{margin:0 0 6px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tool div{font-size:16px;line-height:1.9}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qnum{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1}
.qnum span{color:var(--muted);font-weight:600}
.src{font-family:var(--f-mono);font-size:12.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.stmt{margin:0;font-size:18px;line-height:1.6}
.opts{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--sign)}
.opt:disabled{cursor:default}
.letter{flex:none;width:30px;height:30px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:14px;background:var(--eq-bg);color:var(--ink)}
.opt.is-correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.is-correct .letter{background:var(--ok);color:var(--surface)}
.opt.is-wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.is-wrong .letter{background:var(--bad);color:var(--surface)}
.opt.is-dim{opacity:.55}
.opt .tag{margin-left:auto;font-size:13px;font-weight:700;white-space:nowrap}
.opt.is-correct .tag{color:var(--ok)}
.opt.is-wrong .tag{color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border-radius:9px;padding:11px 18px;font-weight:700;border:1.5px solid var(--line);background:var(--surface)}
.btn:hover{border-color:var(--sign)}
.btn.primary{background:var(--sign);color:var(--sign-ink);border-color:var(--sign)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding-inline:8px;text-decoration:underline;text-underline-offset:3px}
.spacer{flex:1}
.tip{background:var(--tip-bg);color:var(--tip-ink);border-radius:10px;padding:12px 16px;font-size:16px}
.tip b{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:2px}
.feedback{border-radius:10px;padding:12px 16px;font-weight:700;display:flex;gap:10px;align-items:center}
.feedback.good{background:var(--ok-bg);color:var(--ok)}
.feedback.bad{background:var(--bad-bg);color:var(--bad)}
.feedback .ico{font-family:var(--f-mono);font-size:18px}
.sol{border-top:2px dashed var(--line);padding-top:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sol h3{font-family:var(--f-display);font-size:28px;margin:0;line-height:1}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:st}
.step{display:grid;grid-template-columns:30px 1fr;gap:12px;counter-increment:st;min-width:0}
.step::before{content:counter(st);width:30px;height:30px;border-radius:50%;background:var(--sign);color:var(--sign-ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:14px}
.step-body{min-width:0}
.step-label{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:4px 0 4px}
.step-body p{margin:0 0 8px}
.step-body p:last-child{margin-bottom:0}
.step-body ul{margin:0;padding-left:20px}
.eq{background:var(--eq-bg);border-radius:8px;padding:10px 14px;margin:8px 0;overflow-x:auto;white-space:nowrap;font-size:17px;line-height:2.3;font-variant-numeric:tabular-nums}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.25;margin:0 .15em}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .3em 1px}
.frac>span:last-child{padding:2px .3em 0}
.hl{background:var(--tip-bg);color:var(--tip-ink);padding:0 .25em;border-radius:3px;font-weight:700}
.answer{display:flex;align-items:center;gap:12px;background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:12px 16px;font-weight:700}
.answer .letter{background:var(--ok);color:var(--surface)}
.alt{border:1.5px solid var(--line);border-radius:10px;padding:12px 16px;font-size:16px}
.alt b.lbl,.warn b.lbl{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:4px}
.alt b.lbl{color:var(--sign)}
.warn{background:var(--bad-bg);border-radius:10px;padding:12px 16px;font-size:16px}
.warn b.lbl{color:var(--bad)}
.tblwrap{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px;min-width:100%}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:center;white-space:nowrap}
th{background:var(--eq-bg);font-weight:700}
td.meet{background:var(--ok-bg);color:var(--ok);font-weight:700}
.intro p{margin:0}
.intro ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.score{font-family:var(--f-display);font-size:72px;line-height:.9;font-weight:700}
.score span{color:var(--muted);font-size:40px}
.reslist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px}
.res{display:flex;align-items:center;gap:8px;width:100%;border:1.5px solid var(--line);border-radius:9px;padding:9px 12px;background:var(--surface);text-align:left}
.res:hover{border-color:var(--sign)}
.res .st{margin-left:auto;font-family:var(--f-mono);font-weight:600;font-size:13px}
.res.ok .st{color:var(--ok)} .res.bad .st{color:var(--bad)} .res.none .st{color:var(--muted)}
.small{font-size:14px;color:var(--muted)}
@media (max-width:480px){
body{font-size:16px}
.card{padding:18px 16px}
.stmt{font-size:17px}
.mk{font-size:11.5px;height:30px}
.marks{gap:3px}
}
@media (prefers-reduced-motion: reduce){ .car,.tools summary .chev{transition:none} }
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12.5px;letter-spacing:.04em;color:var(--muted)}
.crumbs button{background:none;border:0;padding:4px 2px;color:var(--sign);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.crumbs .sep{opacity:.6}
.crumbs .here{color:var(--ink);font-weight:600}
.sect-label{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
.cards{display:flex;flex-direction:column;gap:12px}
.tile{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--sign)}
.tile:active{transform:scale(.99)}
.tile .ico{width:52px;height:52px;border-radius:10px;background:var(--sign);color:var(--sign-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px;border:2px solid var(--sign-ink);outline:3px solid var(--sign)}
.tile .ico.lane{background:var(--road);color:var(--lane);outline-color:var(--road);border-color:var(--lane);font-family:var(--f-mono);font-size:16px}
.tile .tt{display:block;margin:0;font-family:var(--f-display);font-size:24px;line-height:1.05}
.tile .ds{display:block;margin:4px 0 0;font-size:15px;color:var(--muted);line-height:1.4}
.tile .go{font-family:var(--f-mono);font-weight:600;color:var(--sign);font-size:20px}
.tile .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-family:var(--f-mono);font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.note{font-size:14.5px;color:var(--muted);margin:0}
@media (max-width:480px){.tile{grid-template-columns:44px 1fr auto;padding:14px}.tile .ico{width:44px;height:44px;font-size:20px}.tile .tt{display:block;font-size:21px}}
:root{--lvi-bg:#E1EAF6;--lvi-ink:#1D4E89;--lva-bg:#2A3037;--lva-ink:#F2B705;--plot2:#B4540A;--lvb-line:#F2B705;--lvi-line:#8DB6EA;--lva-line:#F3F5F7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--lvi-bg:#1A2B44;--lvi-ink:#9CC0EE;--lva-bg:#0A0E12;--lva-ink:#F2C230;--plot2:#F2A65A}}
:root[data-theme="dark"]{--lvi-bg:#1A2B44;--lvi-ink:#9CC0EE;--lva-bg:#0A0E12;--lva-ink:#F2C230;--plot2:#F2A65A}
.lvl{font-family:var(--f-mono);font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;letter-spacing:.02em}
.lvl-b{background:var(--tip-bg);color:var(--tip-ink)}
.lvl-i{background:var(--lvi-bg);color:var(--lvi-ink)}
.lvl-a{background:var(--lva-bg);color:var(--lva-ink);box-shadow:inset 0 0 0 1px var(--lva-ink)}
.lvrow{display:grid;gap:4px;margin-top:6px}
.lvrow span{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;text-align:center;padding-top:4px;border-top:2px solid;color:var(--road-ink);opacity:.85;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv-b{border-color:var(--lvb-line)}.lv-i{border-color:var(--lvi-line)}.lv-a{border-color:var(--lva-line)}
.stmt{display:block}
.stmt>.fig,.stmt>.tblwrap{margin:12px 0}
.fig{margin:4px 0 0;background:var(--eq-bg);border-radius:10px;padding:10px 8px 6px;max-width:400px;width:100%}
.plot{display:block;width:100%;height:auto}
.plot .pt{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.plot .pt-strong{fill:var(--ink);font-weight:600}
.plot .pt-lab{font-size:14px;font-weight:600}
.plot .pt-car{fill:#FFFFFF;font-size:12px;font-weight:600}
.step-body .fig{margin:8px 0}
.fld{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px}
.fld input,.fld select{font:inherit;font-weight:400;font-size:17px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%}
.fld input:focus,.fld select:focus{outline:3px solid var(--lane);outline-offset:1px;border-color:var(--sign)}
#loginErro{color:var(--bad);min-height:1em;margin:0}
.fld-dica{font-weight:400;color:var(--muted);font-size:13.5px}
.emailbox{display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.emailbox:focus-within{outline:3px solid var(--lane);outline-offset:1px;border-color:var(--sign)}
.fld .emailbox input{border:0;border-radius:0;outline:none}
.fld .emailbox input:focus{outline:none}
.emailbox .dom{font-size:14px;font-weight:700;color:var(--muted);background:var(--eq-bg);padding:9px 14px;border-top:1px solid var(--line);overflow-wrap:anywhere}
.note b{overflow-wrap:anywhere}
/* ===== 3ª série CIB: identidade por tema ===== */
:root{--sign:#7A1F2B;--ray:#B85C00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sign:#9A3343;--ray:#FFC24A}}
:root[data-theme="dark"]{--sign:#9A3343;--ray:#FFC24A}
.th-enem, :root.th-enem{--sign:#7A1F2B;--lane:#F2B705;--road:#2A1C1E;--road-ink:#F7F0F1;--lvb-line:#F2B705}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]).th-enem, :root:not([data-theme="light"]) .th-enem{--sign:#9A3343;--road:#160E0F}}
:root[data-theme="dark"].th-enem, :root[data-theme="dark"] .th-enem{--sign:#9A3343;--road:#160E0F}
.th-inducao, :root.th-inducao{--sign:#8F4618;--lane:#F2B00A;--road:#23170F;--road-ink:#F8EFE6;--lvb-line:#F2B00A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]).th-inducao, :root:not([data-theme="light"]) .th-inducao{--sign:#A9561F;--road:#140C07}}
:root[data-theme="dark"].th-inducao, :root[data-theme="dark"] .th-inducao{--sign:#A9561F;--road:#140C07}
.th-form, :root.th-form{--sign:#1F4E5F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]).th-form, :root:not([data-theme="light"]) .th-form{--sign:#2B6A80}}
:root[data-theme="dark"].th-form, :root[data-theme="dark"] .th-form{--sign:#2B6A80}
.plate{position:relative;overflow:hidden}
.plate-inner{position:relative;z-index:1}
.plate-deco{position:absolute;right:10px;bottom:8px;width:min(44%,220px);color:var(--sign-ink);opacity:.32;pointer-events:none}
.plate-deco svg{display:block;width:100%;height:auto}
.th-inducao .plate-deco{opacity:.5}
/* Trilhas de progresso: onda numa corda e raio de luz */
.lane2{position:relative;height:30px;margin:0 6px 0 22px;--p:0}
.lane2 svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lane2 .ln-base line{stroke:var(--road-ink);stroke-width:2;opacity:.3;vector-effect:non-scaling-stroke}
.ln-raio .ln-base line{stroke-dasharray:4 6}
.lane2 .ln-fill{clip-path:inset(0 100% 0 0);transition:clip-path .6s ease}
.ln-onda .ln-fill path{fill:none;stroke:var(--lane);stroke-width:3;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.ln-raio .ln-fill line{stroke:var(--lane);stroke-width:4;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 3px var(--lane))}
.ln-head{position:absolute;top:50%;left:calc(var(--p) * 1%);transition:left .6s ease}
.ln-onda .ln-head{width:12px;height:12px;border-radius:50%;background:var(--lane);transform:translate(-50%,-50%);box-shadow:0 0 0 4px rgba(255,255,255,.12)}
.ln-raio .ln-head{width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:12px solid var(--lane);transform:translate(-30%,-50%)}
.ln-src{position:absolute;left:-18px;top:50%;transform:translateY(-50%)}
.ln-onda .ln-src{width:4px;height:24px;border-radius:2px;background:var(--road-ink);opacity:.7}
.ln-raio .ln-src{width:12px;height:12px;border-radius:50%;background:var(--lane);box-shadow:0 0 8px 2px var(--lane)}
@media (prefers-reduced-motion: reduce){.lane2 .ln-fill,.ln-head{transition:none}}
/* Revisão do professor */
.mod{border:1.5px dashed var(--muted);border-radius:10px;padding:10px 14px;font-size:15px;color:var(--muted)}
.mod b{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:2px;color:var(--ink)}
.tbl-txt td,.tbl-txt th{white-space:normal}
.tbl-txt table{min-width:0;width:100%}
.tbl-esq td:last-child{text-align:left}
.tbl-esq td{vertical-align:top}
@media (max-width:480px){.tbl-txt table{font-size:13.5px}.tbl-txt td,.tbl-txt th{padding:6px 7px}}
:root.th-enem .plate-inner, :root.th-inducao .plate-inner{padding-bottom:50px}
.plate-deco{width:150px;bottom:12px;right:14px}
/* Telas grandes (projetor): um pouco mais largo e maior */
@media (min-width:1100px){.wrap{max-width:880px}body{font-size:19px}.stmt{font-size:20px}.fig{max-width:520px}}

/* Nível Básico+ */
:root{--lvbp-bg:#FDEECD;--lvbp-ink:#7D5200;--lvbp-line:#F7C97A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--lvbp-bg:#33270C;--lvbp-ink:#F5C566}}
:root[data-theme="dark"]{--lvbp-bg:#33270C;--lvbp-ink:#F5C566}
.lvl-bp{background:var(--lvbp-bg);color:var(--lvbp-ink);box-shadow:inset 0 0 0 1px var(--lvbp-ink)}
.lv-bp{border-color:var(--lvbp-line)}
/* Figuras com fundo claro (imagens e esquemas coloridos), legíveis também no tema escuro */
.fig.figw{background:#FFFFFF;border:1px solid var(--line);padding:8px;margin-left:auto;margin-right:auto}
.fig.figw img{display:block;width:100%;height:auto}
.fig.figw .plot{max-width:100%}
.stmt p{margin:0 0 10px}
.stmt p:last-child{margin-bottom:0}
.stmt .small{font-size:13.5px}
/* Pegadinha: origem de cada alternativa errada */
.erros{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.erros b{white-space:nowrap}
/* Tabelas das listas de indução */
.dtab{width:auto;min-width:0;margin:0 auto}
/* Formulário */
.formnav{gap:10px}
.chip-link{text-decoration:none;color:var(--sign);border-color:var(--sign);font-size:12.5px;padding:4px 10px}
.formh{font-family:var(--f-display);font-size:28px;line-height:1;margin:0}
.formsec{gap:12px;scroll-margin-top:12px}
.form-grid{padding:0}
.form-grid .tool div small{display:block;font-size:13px;line-height:1.4;color:var(--muted);margin-top:4px}
.tile.th-form .ico{background:var(--sign);outline-color:var(--sign);font-style:italic;font-family:Georgia,serif}
/* Contas longas quebram a linha no celular, em vez de ficarem escondidas */
.eq{white-space:normal;overflow-wrap:anywhere}

.install{border-color:var(--sign)}
.install p{margin:0}
@media (display-mode: standalone){.wrap{padding-top:max(20px,env(safe-area-inset-top,0px))}}

</style>
</head>
<body>
<div class="wrap">
<header class="plate"><div class="plate-deco" id="deco" aria-hidden="true"></div><div class="plate-inner"><div class="eyebrow" id="eyebrow"></div><h1 id="ptitle"></h1><p id="psub"></p></div></header>
<nav class="crumbs" id="crumbs" aria-label="Você está em" hidden></nav>
<main id="view" style="display:flex;flex-direction:column;gap:18px"></main>
</div>
<script>
/* ===== Ajudantes usados em todas as listas ===== */
const f = (n, d) => `<span class="frac"><span>${n}</span><span>${d}</span></span>`;
const L = ['A','B','C','D','E'];
const nf = v => String(v).replace('.', ',');
let _uid = 0;

/* Figura SVG genérica (segue o tema claro/escuro). vb = "0 0 L A" */
const fig = (vb, aria, inner, w) => `<figure class="fig"${w ? ` style="max-width:${w}px"` : ''}><svg viewBox="${vb}" class="plot" role="img" aria-label="${aria}">${inner}</svg></figure>`;
/* Ponta de seta: devolve [defs, url] com id único */
function seta(cor){ const id = 'sa' + (++_uid); return [`<defs><marker id="${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="${cor}"/></marker></defs>`, `url(#${id})`]; }

/* Pontos de uma senoide: y = A·sen(2π(x − x0)/λ + fase) */
function sen(A, lam, xa, xb, fase, n){ n = n || 120; fase = fase || 0; const p = []; for (let k = 0; k <= n; k++){ const x = xa + (xb - xa) * k / n; p.push([+x.toFixed(4), +(A * Math.sin(2 * Math.PI * x / lam + fase)).toFixed(4)]); } return p; }

/* Gráfico cartesiano. o = {aria, xmin, xmax, ymin, ymax, xt, yt, xl, yl, L:[{p, c, dash, w, lab, lp}], pts, ann:[[x,y,txt,anchor,cor]], dims:[[x1,y1,x2,y2,txt,dx,dy]], H, W} */
function plot(o){
  const W = o.W || 340, H = o.H || 236, l = o.l || 46, r = 18, t = 28, b = 40;
  const x0 = o.xmin || 0, y0 = o.ymin || 0;
  const sx = x => +(l + (x - x0) / (o.xmax - x0) * (W - l - r)).toFixed(1);
  const sy = y => +(H - b - (y - y0) / (o.ymax - y0) * (H - t - b)).toFixed(1);
  const [defs, mk] = seta('var(--ink)');
  let s = `<svg viewBox="0 0 ${W} ${H}" class="plot" role="img" aria-label="${o.aria}">${defs}`;
  (o.xt || []).forEach(x => { s += `<line x1="${sx(x)}" y1="${sy(y0)}" x2="${sx(x)}" y2="${sy(o.ymax)}" stroke="var(--line)"/>`; if (!o.noxl) s += `<text x="${sx(x)}" y="${sy(y0)+16}" text-anchor="middle" class="pt">${nf(x)}</text>`; });
  (o.yt || []).forEach(y => { s += `<line x1="${sx(x0)}" y1="${sy(y)}" x2="${sx(o.xmax)}" y2="${sy(y)}" stroke="var(--line)"/><text x="${sx(x0)-7}" y="${sy(y)+4}" text-anchor="end" class="pt">${nf(y)}</text>`; });
  const yax = (y0 < 0 && o.ymax > 0) ? 0 : y0;
  s += `<line x1="${sx(x0)}" y1="${sy(yax)}" x2="${sx(o.xmax)}" y2="${sy(yax)}" stroke="var(--muted)" stroke-width="1.5"/><line x1="${sx(x0)}" y1="${sy(y0)}" x2="${sx(x0)}" y2="${sy(o.ymax)}" stroke="var(--muted)" stroke-width="1.5"/>`;
  s += `<text x="${W-r}" y="${H-6}" text-anchor="end" class="pt">${o.xl}</text><text x="${sx(x0)}" y="16" text-anchor="middle" class="pt">${o.yl}</text>`;
  o.L.forEach(ln => {
    s += `<polyline points="${ln.p.map(([x,y]) => sx(x)+','+sy(y)).join(' ')}" fill="none" stroke="${ln.c}" stroke-width="${ln.w || 3}" stroke-linecap="round" stroke-linejoin="round"${ln.dash ? ` stroke-dasharray="${ln.dash}"` : ''}/>`;
    if (ln.lab){ const [x, y] = ln.lp || ln.p[ln.p.length-1]; s += `<text x="${sx(x)}" y="${sy(y)}" class="pt pt-lab" fill="${ln.c}">${ln.lab}</text>`; }
  });
  (o.dims || []).forEach(([xa, ya, xb, yb, txt, dx, dy]) => {
    s += `<line x1="${sx(xa)}" y1="${sy(ya)}" x2="${sx(xb)}" y2="${sy(yb)}" stroke="var(--ink)" stroke-width="1.4" marker-start="${mk}" marker-end="${mk}"/>`;
    if (txt) s += `<text x="${(sx(xa)+sx(xb))/2 + (dx||0)}" y="${(sy(ya)+sy(yb))/2 + (dy||-6)}" text-anchor="middle" class="pt pt-strong">${txt}</text>`;
  });
  (o.pts || []).forEach(([x, y]) => { s += `<circle cx="${sx(x)}" cy="${sy(y)}" r="4.5" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/>`; });
  (o.ann || []).forEach(([x, y, txt, a, c]) => { s += `<text x="${sx(x)}" y="${sy(y)}" text-anchor="${a || 'middle'}" class="pt pt-strong"${c ? ` fill="${c}"` : ''}>${txt}</text>`; });
  return `<figure class="fig">${s}</svg></figure>`;
}

/* Tabela simples: cab = [..], linhas = [[..],[..]] */
const tabela = (cab, linhas, esq) => `<div class="tblwrap tbl-txt${esq ? ' tbl-esq' : ''}"><table>${cab ? `<tr>${cab.map(c => `<th>${c}</th>`).join('')}</tr>` : ''}${linhas.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;

/* ===== Revisão ENEM · listas do aulão (3 listas de 10, por área) ===== */
/* Figura em imagem (pasta img/) com fundo claro, legível nos dois temas */
const foto = (n, aria, w) => `<figure class="fig figw"${w ? ` style="max-width:${w}px"` : ''}><img src="img/${n}.png" alt="${aria}" loading="lazy"></figure>`;
/* Pegadinha: de onde vem cada alternativa errada (gabarito comentado do professor) */
const erros = linhas => `De onde vem cada alternativa errada:<ul class="erros">${linhas.map(([a, t]) => `<li><b>${a}</b> ${t}</li>`).join('')}</ul>`;
const src = n => `Lista do aulão · Q${String(n).padStart(2, '0')}`;

/* ---------- Lista 1 · Eletricidade e energia ---------- */
const TOOLS_E1 = [
  ['Leis de Ohm', `U = R · i<br>R = ρ · ${f('L','A')}`],
  ['Potência e energia', `P = U · i = R · i² = ${f('U²','R')}<br>E = P · Δt (kWh: P em kW, Δt em h)`],
  ['Associação de resistores', `Série: R<sub>eq</sub> = R₁ + R₂ + …<br>Paralelo: ${f('1','R<sub>eq</sub>')} = ${f('1','R₁')} + ${f('1','R₂')} + …`],
  ['Transformador ideal', `${f('U₁','U₂')} = ${f('N₁','N₂')} = ${f('i₂','i₁')}`],
  ['Energia mecânica', `E<sub>p</sub> = m · g · h<br>P = ${f('ΔE','Δt')} &nbsp;·&nbsp; d = ${f('m','V')}`],
  ['Eletrostática', `F = k · ${f('|q₁| · |q₂|','d²')}<br>Esferas iguais em contato: Q′ = ${f('Q<sub>A</sub> + Q<sub>B</sub>','2')}`],
  ['Conversões', `1 mA = 10⁻³ A · 1 kΩ = 10³ Ω<br>1 MW = 10⁶ W · 30 min = 0,5 h`]
];

const Q_E1 = [
{ src: src(1), nivel: 'básico',
  text: `<p>Ao reformar o banheiro, uma família comprou um chuveiro elétrico cuja embalagem traz os dados abaixo. O eletricista explicou que o disjuntor do circuito deve ter corrente nominal imediatamente acima da maior corrente de operação do aparelho: um disjuntor abaixo desse valor desarma durante o banho, e um muito acima deixa de proteger a fiação contra superaquecimento.</p>
${tabela(['Dado do chuveiro','Valor'],[['Tensão','220 V'],['Potência na posição verão','4 400 W'],['Potência na posição inverno','6 600 W']])}
<p>Os disjuntores disponíveis na loja são de 16 A, 20 A, 25 A, 32 A e 40 A. Qual deles deve ser instalado?</p>`,
  opts: ['16 A','20 A','25 A','32 A','40 A'], ans: 3,
  hint: 'Em qual posição a corrente é maior? Calcule essa corrente com P = U · i.',
  steps: [['Maior corrente', '<p>A maior potência (6 600 W) é a da posição inverno: é nela que a corrente é máxima.</p>'],
          ['Cálculo', `<div class="eq">i = ${f('P','U')} = ${f('6 600','220')} = 30 A</div>`],
          ['Escolha', '<p>O disjuntor imediatamente acima de 30 A é o de <b>32 A</b>.</p>']],
  alt: 'Com a tensão fixa, corrente e potência são proporcionais: 4 400 W dão 20 A; 6 600 W (1,5 vez mais) dão 1,5 × 20 = 30 A.',
  warn: erros([['A) 16 A:','muito abaixo da corrente de operação; desarma em qualquer posição.'],['B) 20 A:','dimensiona pela posição verão (4 400/220 = 20 A).'],['C) 25 A:','abaixo de 30 A; desarma no inverno.'],['E) 40 A:','superdimensionado; não protege a fiação.']]) },

{ src: src(6), nivel: 'básico',
  text: '<p>Um LED vermelho funciona corretamente com tensão de 2,0 V e corrente de 20 mA. Para ligá-lo a uma bateria de 9,0 V, um estudante coloca um resistor em série com o LED, que fica com a parte da tensão que o LED não deve receber. Qual deve ser a resistência desse resistor?</p>',
  opts: ['100 Ω','350 Ω','450 Ω','550 Ω','3 500 Ω'], ans: 1,
  hint: 'Em série, a corrente é a mesma no LED e no resistor, e as tensões se somam. Que tensão sobra para o resistor?',
  steps: [['Tensão no resistor', '<div class="eq">U<sub>R</sub> = 9,0 − 2,0 = 7,0 V</div>'],
          ['Corrente', '<p>Em série, a corrente no resistor é a do LED: 20 mA = 0,020 A.</p>'],
          ['Resistência', `<div class="eq">R = ${f('U','i')} = ${f('7,0','0,020')} = 350 Ω</div>`]],
  alt: 'O resistor “segura” o excesso: a bateria fornece 9 V, o LED aceita 2 V e o resistor fica com os 7 V restantes, deixando passar só os 20 mA que o LED suporta.',
  warn: erros([['A) 100 Ω:','usa a tensão do LED (2,0/0,020).'],['C) 450 Ω:','usa a tensão total da bateria (9,0/0,020).'],['D) 550 Ω:','soma as tensões em vez de subtrair (11/0,020).'],['E) 3 500 Ω:','converte 20 mA para 0,002 A.']]) },

{ src: src(26), nivel: 'básico',
  text: '<p>Em um carregador antigo de celular, um transformador reduz a tensão alternada da tomada, de 220 V, para 5 V. O enrolamento primário tem 880 espiras. Considerando o transformador ideal, o número de espiras do enrolamento secundário é</p>',
  opts: ['20.','44.','176.','880.','38 720.'], ans: 0,
  hint: 'No transformador ideal, a razão entre as tensões é igual à razão entre os números de espiras.',
  steps: [['Relação', `<div class="eq">${f('U₁','U₂')} = ${f('N₁','N₂')} → ${f('220','5')} = ${f('880','N₂')}</div>`],
          ['Cálculo', `<div class="eq">N₂ = ${f('880 × 5','220')} = 20 espiras</div>`],
          ['Por que corrente alternada', '<p>O transformador só funciona com corrente alternada: a tensão no secundário é induzida pela <b>variação</b> do fluxo magnético (lei de Faraday).</p>']],
  alt: 'A tensão foi reduzida 44 vezes (220 ÷ 5). O número de espiras do secundário é 44 vezes menor que o do primário: 880 ÷ 44 = 20.',
  warn: erros([['B) 44:','dá a razão entre as tensões (220/5).'],['C) 176:','divide as espiras pela tensão de saída (880/5).'],['D) 880:','acha que o número de espiras não muda.'],['E) 38 720:','inverte a proporção (880 × 220/5).']]) },

{ src: src(2), nivel: 'intermediário',
  text: `<p>Ao receber uma conta de luz mais alta que o esperado, um estudante decidiu estimar o consumo dos principais aparelhos de casa. Ele anotou a potência de cada um e o tempo diário de funcionamento. No caso da geladeira, cujo compressor liga e desliga ao longo do dia, usou a potência média informada pelo fabricante.</p>
${tabela(['Aparelho','Potência','Uso diário'],[['Chuveiro','5 000 W','30 min'],['Geladeira (potência média)','150 W','24 h'],['Televisor','100 W','5 h'],['6 lâmpadas LED','10 W cada','5 h']])}
<p>Considere um mês de 30 dias e a tarifa de R$ 0,80 por kWh. O custo mensal estimado para esses aparelhos é</p>`,
  opts: ['R$ 5,52.','R$ 60,00.','R$ 79,20.','R$ 141,60.','R$ 165,60.'], ans: 4,
  hint: 'Calcule a energia de cada aparelho em kWh por dia (P em kW, tempo em horas). Cuidado: 30 min não é 0,3 h.',
  steps: [['Energia por dia', '<p>Chuveiro: 5,0 × 0,5 = 2,5 kWh · Geladeira: 0,15 × 24 = 3,6 kWh · Televisor: 0,1 × 5 = 0,5 kWh · Lâmpadas: 0,06 × 5 = 0,3 kWh</p>'],
          ['Total', '<p>Por dia: 6,9 kWh. No mês: 6,9 × 30 = 207 kWh.</p>'],
          ['Custo', '<div class="eq">207 × 0,80 = R$ 165,60</div>']],
  alt: 'A geladeira tem potência pequena, mas fica ligada 24 h: é o aparelho que mais gasta na tabela (3,6 kWh por dia, mais que o chuveiro). Potência baixa não significa consumo baixo; o que conta é P × tempo.',
  warn: erros([['A) R$ 5,52:','calcula o custo de um só dia.'],['B) R$ 60,00:','considera apenas o chuveiro.'],['C) R$ 79,20:','esquece a geladeira (ou acha que ela gasta pouco por ter potência baixa).'],['D) R$ 141,60:','converte 30 min em 0,3 h no chuveiro.']]) },

{ src: src(3), nivel: 'intermediário',
  text: `<p>A corrente elétrica que atravessa o corpo humano depende da tensão aplicada e da resistência elétrica do corpo, que diminui muito quando a pele está molhada. O quadro relaciona a intensidade da corrente aos danos físicos.</p>
${tabela(['Corrente elétrica','Dano físico'],[['Até 10 mA','Dor e contração muscular'],['De 10 mA até 20 mA','Aumento das contrações musculares'],['De 20 mA até 100 mA','Parada respiratória'],['De 100 mA até 3 A','Fibrilação ventricular'],['Acima de 3 A','Parada cardíaca e queimaduras']], true)}
<p class="small">DURAN, J. E. R. <i>Biofísica: fundamentos e aplicações</i>. São Paulo: Pearson Prentice Hall, 2003 (adaptado).</p>
<p>Um técnico, com as mãos molhadas, toca ao mesmo tempo os terminais extremos de um conjunto de baterias de 9 V associadas em série. Considere que, com a pele molhada, a resistência elétrica do corpo entre as mãos seja de 1 kΩ. Qual é o número mínimo de baterias para que o choque já possa provocar parada respiratória?</p>`,
  opts: ['1','2','3','11','12'], ans: 2,
  hint: 'Ache a tensão que produz 20 mA em 1 kΩ. Quantas baterias de 9 V em série são necessárias para chegar a ela?',
  steps: [['Limite', '<p>A parada respiratória começa em 20 mA = 0,020 A.</p>'],
          ['Tensão mínima', '<div class="eq">U = R · i = 1 000 × 0,020 = 20 V</div>'],
          ['Baterias', '<p>Em série, as tensões se somam: 2 baterias dão 18 V (não bastam); 3 baterias dão 27 V, que produzem 27 mA, já na faixa de parada respiratória. Resposta: <b>3</b>.</p>']],
  alt: 'Teste direto: com n baterias, a corrente é 9n/1 000 A, ou seja, 9n mA. Com n = 2, 18 mA (ainda contrações); com n = 3, 27 mA (parada respiratória).',
  warn: erros([['A) 1:','9 V geram 9 mA: só dor e contração.'],['B) 2:','arredonda 20/9 ≈ 2,2 para baixo (18 V não bastam).'],['D) 11:','usa o limite superior, 100 mA (100/9 ≈ 11).'],['E) 12:','usa 100 mA e arredonda para cima.']]) },

{ src: src(7), nivel: 'intermediário',
  text: '<p>A resistência de um chuveiro é um fio metálico enrolado em espiral, com três terminais. Na posição verão, a corrente percorre o fio inteiro, cuja resistência é 22 Ω. Na posição inverno, a corrente percorre apenas metade do comprimento do mesmo fio. O chuveiro é ligado em 220 V. Qual é a potência do chuveiro na posição inverno?</p>',
  opts: ['1 100 W','2 200 W','3 300 W','4 400 W','8 800 W'], ans: 3,
  hint: 'Metade do comprimento do fio dá que resistência? E, com a tensão fixa, qual fórmula de potência é a mais direta?',
  steps: [['Resistência', `<p>Pela segunda lei de Ohm, R = ρ · ${f('L','A')}: com metade do comprimento, R = 11 Ω.</p>`],
          ['Potência', `<div class="eq">P = ${f('U²','R')} = ${f('220²','11')} = 4 400 W</div>`],
          ['Conferência', '<p>No verão: 220²/22 = 2 200 W. Menor resistência, maior potência.</p>']],
  alt: 'Com U constante, P é inversamente proporcional a R: se R cai pela metade, P dobra (2 200 W → 4 400 W). Por isso o inverno usa o pedaço menor do fio.',
  warn: erros([['A) 1 100 W:','acha que P é proporcional a R (metade da potência).'],['B) 2 200 W:','calcula a potência da posição verão.'],['C) 3 300 W:','estima um aumento de 50% sem usar P = U²/R.'],['E) 8 800 W:','acha que P é proporcional a 1/R².']]) },

{ src: src(27), nivel: 'intermediário',
  text: '<p>Em uma usina hidrelétrica, 100 m³ de água passam pelas turbinas a cada segundo, depois de descer um desnível de 50 m. O conjunto turbina-gerador converte 80% da energia potencial gravitacional da água em energia elétrica. Considere a densidade da água igual a 1 000 kg/m³ e g = 10 m/s². A potência elétrica gerada é</p>',
  opts: ['40 MW.','50 MW.','62,5 MW.','400 MW.','500 MW.'], ans: 0,
  hint: 'Calcule a massa de água que desce a cada segundo e a energia potencial que ela perde nesse segundo. Depois aplique os 80%.',
  steps: [['Massa por segundo', '<p>100 m³ × 1 000 kg/m³ = 1,0 × 10⁵ kg a cada segundo.</p>'],
          ['Potência disponível', `<div class="eq">${f('m · g · h','Δt')} = 1,0 × 10⁵ × 10 × 50 = 5,0 × 10⁷ W = 50 MW</div>`],
          ['Potência elétrica', '<div class="eq">0,80 × 50 = 40 MW</div>']],
  alt: 'O rendimento sempre reduz: a potência elétrica tem de ser menor que os 50 MW disponíveis. Isso já elimina 50; 62,5; 400 e 500 MW.',
  warn: erros([['B) 50 MW:','ignora o rendimento.'],['C) 62,5 MW:','divide pelo rendimento em vez de multiplicar.'],['D) 400 MW:','converte W em MW com 1 MW = 10⁵ W.'],['E) 500 MW:','ignora o rendimento e erra a conversão para MW.']]) },

{ src: src(4), nivel: 'avançado',
  text: `<p>Para iluminar uma maquete, uma estudante montou o circuito da figura, ligado a uma fonte de 12 V de resistência interna desprezível.</p>
${foto('q04', 'Circuito: fonte de 12 V em série com R1 = 4 ohms; em seguida, R3 = 6 ohms e R2 = 12 ohms ligados em paralelo entre si.', 340)}
<p>A intensidade da corrente elétrica no resistor R₃ é</p>`,
  opts: ['0,5 A.','1,0 A.','1,5 A.','2,0 A.','3,0 A.'], ans: 1,
  hint: 'Resolva primeiro o paralelo entre R₂ e R₃ e some R₁. Com a corrente total, ache a tensão no paralelo.',
  steps: [['Paralelo', `<div class="eq">R₂₃ = ${f('12 · 6','12 + 6')} = 4 Ω</div>`],
          ['Corrente total', '<div class="eq">R<sub>eq</sub> = 4 + 4 = 8 Ω → i = 12/8 = 1,5 A</div>'],

  text:`Uma espira de área 0,020 m² está inicialmente com seu plano perpendicular a um campo magnético uniforme de 0,40 T. Em 0,10 s, ela é girada até que seu plano fique <b>paralelo</b> às linhas de campo. O módulo da fem média induzida nesse intervalo é:`,
  opts:[`zero, pois o campo não mudou`,`0,008 V`,`0,08 V`,`0,16 V`,`0,8 V`],
  ans:2,
  hint:`Quando o plano da espira fica paralelo às linhas de campo, quantas linhas a atravessam?`,
  steps:[['Fluxo inicial',`Plano ⟂ campo (máximo): Φ<sub>i</sub> = B · A = 0,40 · 0,020 = 0,0080 Wb`],
         ['Fluxo final',`Plano ∥ campo: nenhuma linha atravessa (θ = 90° entre B e a normal) → Φ<sub>f</sub> = 0`],
         ['Faraday',`|ε| = ${f('0,0080','0,10')} = <b>0,080 V</b>`]],
  alt:`Pense numa peneira na chuva: de frente, pega toda a água; de lado, nenhuma. Girar a espira muda o fluxo mesmo com B constante.`,
  warn:`O campo não mudou, mas o <b>fluxo</b> mudou — por isso a fem não é zero. E 0,16 V corresponderia a um giro de 180° (fluxo de +Φ a −Φ), não de 90°.` },

{ src:'Original', nivel:'básico+',
  text:`Uma bobina de 100 espiras, cada uma com área de 0,010 m², está em um campo magnético perpendicular ao seu plano. O gráfico mostra a intensidade do campo em função do tempo.${FIG_GRAF}O módulo da fem induzida nos intervalos de 0 a 0,3 s e de 0,3 s a 0,5 s é, respectivamente:`,
  opts:[`2,0 V e zero`,`2,0 V e 2,0 V`,`0,020 V e zero`,`zero e 2,0 V`,`0,60 V e 0,60 V`],
  ans:0,
  hint:`A fem depende da <b>inclinação</b> do gráfico (rapidez da variação), não da altura.`,
  steps:[['De 0 a 0,3 s',`ΔΦ por espira = ΔB · A = 0,60 · 0,010 = 0,0060 Wb<br>ε = N · ${f('ΔΦ','Δt')} = 100 · ${f('0,0060','0,3')} = <b>2,0&nbsp;V</b>`],
         ['De 0,3 s a 0,5 s',`B constante → ΔΦ = 0 → <b>ε = 0</b>`]],
  alt:`Leitura rápida do gráfico: rampa = há fem; trecho horizontal = não há fem. Quanto mais inclinada a rampa, maior a fem.`,
  warn:`No trecho horizontal o campo é o maior possível, mas a fem é zero. E 0,020 V esqueceu as 100 espiras.` },

{ src:'Original', nivel:'básico+',
  text:`Um transformador ideal tem 1000 espiras no primário, ligado à rede de 220 V (corrente alternada), e 50 espiras no secundário. Uma lâmpada ligada ao secundário é percorrida por corrente de 2,0 A, como no esquema.${FIG_TRAFO}A tensão no secundário e a corrente no primário valem, respectivamente:`,
  opts:[`11 V e 0,10 A`,`11 V e 40 A`,`11 V e 2,0 A`,`4400 V e 0,10 A`,`4400 V e 40 A`],
  ans:0,
  hint:`A tensão segue a razão entre as espiras. Para a corrente, lembre que o transformador ideal não cria nem perde energia: a potência é a mesma nos dois lados.`,
  steps:[['Tensão',`U<sub>2</sub> = U<sub>1</sub> · ${f('N<sub>2</sub>','N<sub>1</sub>')} = 220 · ${f('50','1000')} = <b>11 V</b>`],
         ['Potência',`P = U<sub>2</sub> · i<sub>2</sub> = 11 · 2,0 = 22 W`],
         ['Corrente no primário',`i<sub>1</sub> = ${f('P','U<sub>1</sub>')} = ${f('22','220')} = <b>0,10 A</b>`],
         ['Por que CA?',`O transformador só funciona com corrente alternada: é a <b>variação</b> do fluxo no núcleo que induz tensão no secundário.`]],
  alt:`O transformador “troca” tensão por corrente: a tensão caiu 20 vezes (220 → 11 V), então a corrente no primário é 20 vezes menor que a do secundário (2,0 → 0,10 A).`,
  warn:`Usar a razão de espiras do mesmo jeito para a corrente dá 40 A — a corrente varia ao <b>contrário</b> da tensão. Inverter a razão na tensão dá 4400 V.` }
];

/* ===== Indução, Lista 2 — intermediário ===== */

const TOOLS_INDUCAO_2 = [
  ['Fluxo magnético', `Φ = B · A · cos θ<br><small>θ é o ângulo entre B e a <b>normal</b> ao plano da espira (não entre B e o plano!).</small>`],
  ['Lei de Faraday', `ε = N · ${f('|ΔΦ|','Δt')} &nbsp;·&nbsp; <small>se B inverte de sentido, |ΔB| = 2B</small>`],
  ['Lei de Lenz', `A corrente induzida se opõe à <b>variação</b> do fluxo: aproximação → repulsão; afastamento → atração.`],
  ['Barra em trilhos', `ε = B · L · v &nbsp;·&nbsp; i = ${f('ε','R')} &nbsp;·&nbsp; F<sub>mag</sub> = B · i · L &nbsp;·&nbsp; P = ε · i = R · i²`],
  ['Gerador', `ε<sub>máx</sub> = N · B · A · ω &nbsp;·&nbsp; R<sub>fio</sub> = ρ · ${f('comprimento','área da seção')}`],
  ['Transformador e transmissão', `${f('U<sub>1</sub>','U<sub>2</sub>')} = ${f('N<sub>1</sub>','N<sub>2</sub>')} &nbsp;·&nbsp; P = U · i &nbsp;·&nbsp; P<sub>perdida</sub> = R<sub>linha</sub> · i²`],
  ['Valores úteis', `π ≈ 3 &nbsp;·&nbsp; √3 ≈ 1,7 &nbsp;·&nbsp; cos 30° = ${f('√3','2')} &nbsp;·&nbsp; cos 60° = 0,5`]
];

const Q_INDUCAO_2 = [
{ src:'Original', nivel:'intermediário',
  text:`Uma espira circular de raio 10 cm está em um campo magnético uniforme de 0,40 T. As linhas de campo formam um ângulo de <b>60° com o plano</b> da espira, como na figura (vista de lado).${FIG_ANGULO}Usando π ≈ 3 e √3 ≈ 1,7, o fluxo magnético através da espira é aproximadamente:`,
  opts:[`6,0 × 10<sup>−3</sup> Wb`,`1,0 × 10<sup>−2</sup> Wb`,`1,2 × 10<sup>−2</sup> Wb`,`2,4 × 10<sup>−2</sup> Wb`,`1,2 × 10<sup>−1</sup> Wb`],
  ans:1,
  hint:`Cuidado com o ângulo: a fórmula usa o ângulo entre B e a <b>normal</b> ao plano. Se o campo faz 60° com o plano, quanto faz com a normal?`,
  steps:[['Área',`r = 10 cm = 0,10 m → A = π · r² ≈ 3 · 0,010 = 0,030 m²`],
         ['Ângulo certo',`60° com o plano → θ = 90° − 60° = 30° com a normal → cos 30° = ${f('√3','2')} ≈ 0,85`],
         ['Fluxo',`Φ = B · A · cos θ ≈ 0,40 · 0,030 · 0,85 ≈ <b>1,0 × 10<sup>−2</sup> Wb</b>`]],
  alt:`Pense na “sombra” da espira vista na direção do campo. Se o campo fosse rente ao plano (0° com o plano), não passaria nada; se fosse perpendicular ao plano, passaria tudo. 60° com o plano é bem perto de perpendicular, então o fluxo é quase o máximo (B · A = 1,2 × 10<sup>−2</sup> Wb), só um pouco menor.`,
  warn:`Usar cos 60° direto dá 6,0 × 10<sup>−3</sup> Wb (alternativa A) — é o erro clássico de medir o ângulo a partir do plano. Ignorar o ângulo dá 1,2 × 10<sup>−2</sup> Wb (C).` },

{ src:'Original', nivel:'intermediário',
  text:`Uma bobina de 20 espiras, cada uma com área de 0,020 m², está em um campo magnético perpendicular ao seu plano, de intensidade 0,30 T. Em 0,05 s, o campo tem seu <b>sentido invertido</b>, passando a valer 0,30 T no sentido oposto. O módulo da fem média induzida é:`,
  opts:[`zero`,`0,24 V`,`2,4 V`,`4,8 V`,`9,6 V`],
  ans:3,
  hint:`O campo não foi a zero: foi de +0,30 T a −0,30 T. Qual é a variação total?`,
  steps:[['Variação do campo',`ΔB = (−0,30) − (+0,30) = −0,60 T → |ΔB| = 0,60 T`],
         ['Variação do fluxo (uma espira)',`|ΔΦ| = |ΔB| · A = 0,60 · 0,020 = 0,012 Wb`],
         ['Faraday',`ε = N · ${f('|ΔΦ|','Δt')} = 20 · ${f('0,012','0,05')} = <b>4,8 V</b>`]],
  alt:`Divida em duas etapas: de 0,30 T até zero o fluxo cai 0,006 Wb; de zero até 0,30 T no outro sentido, cai mais 0,006 Wb. Total: 0,012 Wb por espira.`,
  warn:`“A intensidade inicial e a final são iguais, então não variou” leva a zero (A). Usar só 0,30 T de variação dá 2,4 V (C) — metade do valor certo.` },

{ src:'Original', nivel:'intermediário',
  text:`Uma barra condutora de 0,50 m desliza sem atrito sobre trilhos ligados por um resistor de 4,0 Ω, em um campo magnético uniforme de 0,80 T perpendicular ao plano dos trilhos. Para que a barra mantenha velocidade constante de 5,0 m/s, um agente externo deve puxá-la com uma força F, como na figura.${FIG_TRILHOS_L2}A intensidade da força aplicada pelo agente e a potência dissipada no resistor são, respectivamente:`,
  opts:[`zero e 1,0 W`,`0,20 N e 0,50 W`,`0,20 N e 1,0 W`,`0,40 N e 2,0 W`,`1,0 N e 0,20 W`],
  ans:2,
  hint:`Calcule a corrente; a força magnética sobre a barra (B · i · L) freia o movimento. Com velocidade constante, a força do agente equilibra exatamente essa força.`,
  steps:[['fem e corrente',`ε = B · L · v = 0,80 · 0,50 · 5,0 = 2,0 V &nbsp;→&nbsp; i = ${f('2,0','4,0')} = 0,50 A`],
         ['Força magnética',`F<sub>mag</sub> = B · i · L = 0,80 · 0,50 · 0,50 = 0,20 N, oposta à velocidade (Lenz). O agente aplica <b>0,20 N</b>.`],
         ['Potência',`P = R · i² = 4,0 · 0,50² = <b>1,0 W</b>`],
         ['Conferindo pela energia',`Potência do agente = F · v = 0,20 · 5,0 = 1,0 W — igual à dissipada no resistor.`]],
  alt:`Lenz em termos de energia: a corrente só existe porque alguém está empurrando a barra. Todo o trabalho do agente vira calor no resistor (1,0 W).`,
  warn:`“Velocidade constante, então a força é zero” (A) vale sem campo; aqui existe a força magnética de frenagem, que precisa ser equilibrada.` },

{ src:'Original', nivel:'intermediário',
  text:`Um pequeno ímã é solto dentro de um tubo vertical de cobre e leva vários segundos para atravessá-lo. Um bloco de madeira idêntico, solto no mesmo tubo, atravessa quase instantaneamente. Sabe-se que o cobre <b>não</b> é atraído por ímãs. A explicação para a queda lenta do ímã é que:`,
  opts:[`o cobre é atraído pelo ímã, que fica “grudando” nas paredes do tubo.`,`o ar dentro do tubo é comprimido pelo ímã, que é mais denso que a madeira.`,`correntes induzidas no tubo geram campos que freiam o ímã.`,`o ímã fica eletricamente carregado pelo atrito e é atraído pelo tubo.`,`dentro do tubo metálico a gravidade fica blindada e atua com menor intensidade.`],
  ans:2,
  hint:`O fluxo magnético através de cada “anel” do tubo muda enquanto o ímã passa. O que a Lei de Lenz diz sobre isso?`,
  steps:[['Fluxo variando',`Cada trecho do tubo funciona como uma espira fechada. Com o ímã passando, o fluxo nesses anéis varia.`],
         ['Correntes induzidas',`Surgem correntes induzidas no cobre (correntes de Foucault), que é bom condutor.`],
         ['Lenz',`Essas correntes geram campos que repelem o ímã acima e o atraem por trás: o efeito sempre se opõe ao movimento, e o ímã cai devagar.`],
         ['Energia',`A energia potencial perdida pelo ímã vira principalmente calor no tubo, e não energia cinética.`]],
  alt:`É o mesmo princípio do freio magnético de trens e de algumas montanhas-russas: metal condutor + ímã em movimento = frenagem sem contato.`,
  warn:`O cobre não é ferromagnético — ele não é atraído por ímãs parados (A é falsa). O efeito só aparece porque o ímã está em <b>movimento</b>; um ímã parado no tubo não sofre força nenhuma.` },

{ src:'Original', nivel:'intermediário',
  text:`Duas bobinas estão lado a lado, sem contato. A bobina 1 está ligada a uma pilha e a uma chave; a bobina 2, a um galvanômetro de zero central, como no esquema.${FIG_BOBINAS}O que se observa no galvanômetro ao <b>fechar</b> a chave, ao <b>mantê-la fechada</b> e ao <b>abri-la</b>?`,
  opts:[`Desvia ao fechar e permanece desviado enquanto a chave estiver fechada; volta a zero ao abrir.`,`Desvia rapidamente ao fechar, volta a zero e desvia ao contrário ao abrir.`,`Desvia momentaneamente ao fechar e ao abrir, sempre no mesmo sentido.`,`Não desvia em nenhum momento, pois as bobinas não estão ligadas entre si.`,`Permanece em zero ao fechar e só desvia quando a chave é aberta.`],
  ans:1,
  hint:`O galvanômetro só registra corrente enquanto o fluxo na bobina 2 está <b>mudando</b>. Em qual desses momentos a corrente na bobina 1 está variando?`,
  steps:[['Fechar a chave',`A corrente na bobina 1 sobe de zero ao valor final → o fluxo na bobina 2 <b>aumenta</b> → pulso de corrente induzida.`],
         ['Chave fechada',`Corrente constante na bobina 1 → fluxo constante → <b>nenhuma</b> corrente induzida.`],
         ['Abrir a chave',`O fluxo <b>diminui</b> até zero → pulso em sentido <b>oposto</b> ao do fechamento (Lenz).`]],
  alt:`Esse foi o experimento de Faraday em 1831: ele esperava corrente contínua na segunda bobina, mas só viu “trancos” do ponteiro ao ligar e ao desligar.`,
  warn:`A alternativa A troca “campo existindo” por “campo variando”. E o sentido não é o mesmo nos dois pulsos (C): aumentar e diminuir o fluxo provocam reações opostas.` },

{ src:'Original', nivel:'intermediário',
  text:`Uma usina deve enviar 100 kW a uma cidade por uma linha de transmissão de resistência total 2,0 Ω. A tabela mostra o que acontece com a transmissão em 1 000 V e propõe elevar a tensão para 10 000 V com um transformador, mantendo a potência enviada.${TAB_TRANSMISSAO}Com a transmissão em 10 000 V, a potência perdida na linha passa a ser:`,
  opts:[`20 kW`,`2,0 kW`,`200 W`,`20 W`,`200 kW`],
  ans:2,
  hint:`Com a potência fixa, a corrente na linha depende da tensão (P = U · i). E a perda depende do <b>quadrado</b> da corrente.`,
  steps:[['Corrente em 10 kV',`i = ${f('P','U')} = ${f('100 000','10 000')} = 10 A (antes era 100 A)`],
         ['Perda',`P<sub>perdida</sub> = R · i² = 2,0 · 10² = <b>200 W</b>`]],
  alt:`Tensão 10 vezes maior → corrente 10 vezes menor → perda 10² = 100 vezes menor: 20 kW ÷ 100 = 200 W. É por isso que as linhas de transmissão operam em altíssima tensão — e por isso precisamos de transformadores (e de corrente alternada).`,
  warn:`Dividir a perda só por 10 dá 2,0 kW (B). A perda cai com o <b>quadrado</b> da corrente. E não use U²/R com a tensão da usina: a queda de tensão na linha não é 10 000 V.` },

{ src:'Baseada no ENEM 2011', nivel:'intermediário',
  text:`O captador de um baixo elétrico é formado por uma bobina enrolada em torno de um ímã permanente, posicionada logo abaixo das cordas. Um músico trocou as cordas de aço por cordas de <b>cobre</b>, que é excelente condutor elétrico, e o amplificador praticamente deixou de emitir som. Isso aconteceu porque a corda de cobre:`,
  opts:[`conduz tão bem a eletricidade que a corrente induzida escapa por ela antes de chegar à bobina.`,`quase não se magnetiza, e sua vibração pouco altera o fluxo na bobina.`,`vibra com frequência alta demais para ser percebida pelo captador.`,`desmagnetiza o ímã do captador por estar muito próxima dele.`,`precisaria estar ligada eletricamente à bobina para transmitir a vibração.`],
  ans:1,
  hint:`Para induzir corrente, algo precisa fazer o fluxo magnético na bobina variar. Uma corda de aço vibrando faz isso. Por quê? O cobre tem essa mesma propriedade?`,
  steps:[['Como funciona o captador',`O ímã magnetiza a corda de aço logo acima dele: a corda vira um pequeno ímã.`],
         ['Vibração → fluxo variando',`Quando a corda magnetizada vibra, o fluxo na bobina varia no mesmo ritmo, induzindo uma corrente que vai ao amplificador.`],
         ['Com cobre',`O cobre não é ferromagnético: quase não se magnetiza. A corda vibra, mas o fluxo na bobina praticamente não muda → quase nenhuma corrente induzida.`]],
  alt:`O captador “escuta” o magnetismo da corda, não a eletricidade dela. Ser bom condutor não ajuda; o que importa é ser magnetizável (ferro, aço, níquel).`,
  warn:`A armadilha é achar que “bom condutor = bom para eletricidade = bom para o captador”. A corda não faz parte do circuito; a ligação dela com a bobina é só magnética.` },

{ src:'Baseada no ENEM 2014', nivel:'intermediário',
  text:`Na figura, um ímã com o polo norte voltado para uma espira parada se aproxima dela, e surge na espira uma corrente induzida i.${FIG_LENZ2}Usando os mesmos materiais, qual procedimento também produz na espira uma corrente de <b>mesmo sentido</b> que i?`,
  opts:[`Afastar o ímã da espira, mantendo a polaridade.`,`Inverter a polaridade do ímã e aproximá-lo da espira.`,`Inverter a polaridade do ímã e afastá-lo da espira.`,`Mover o ímã e a espira juntos, para a direita, com a mesma velocidade.`,`Deixar o ímã parado bem perto da espira, com a mesma polaridade.`],
  ans:2,
  hint:`Na figura, o fluxo através da espira (linhas saindo do N, apontando para a direita) está <b>aumentando</b>. Procure a situação em que a corrente induzida precise criar o mesmo campo que na figura.`,
  steps:[['Situação da figura',`O campo do ímã na espira aponta para a direita e cresce. Pela Lei de Lenz, a corrente i cria na espira um campo para a <b>esquerda</b>.`],
         ['Polaridade invertida e afastando',`Com o S voltado para a espira, o campo do ímã nela aponta para a esquerda (entrando no polo S). Afastando o ímã, esse campo para a esquerda <b>diminui</b>.`],
         ['Reação',`Para compensar a perda, a corrente induzida cria um campo para a <b>esquerda</b> — o mesmo da figura → mesmo sentido de i. Alternativa C.`]],
  alt:`Duas inversões se cancelam: inverter a polaridade troca o sentido da corrente, e trocar aproximar por afastar troca de novo. Inverter só uma das duas coisas (A ou B) dá o sentido oposto.`,
  warn:`Em D o ímã e a espira andam juntos: não há movimento <b>relativo</b>, o fluxo não muda e não há corrente. Em E o ímã parado também não induz nada.` },

{ src:'Baseada no ENEM 2020', nivel:'intermediário',
  text:`Em um pequeno gerador de uma usina, a tensão de pico nos terminais das bobinas é de 60 V quando o eixo gira a 900 rotações por minuto. Durante uma cheia, a turbina passou a girar a 1 200 rotações por minuto. Mantidos o ímã, as bobinas e as demais características, a nova tensão de pico é:`,
  opts:[`45 V`,`60 V`,`80 V`,`107 V`,`120 V`],
  ans:2,
  hint:`A fem depende da <b>rapidez</b> com que o fluxo varia. O fluxo máximo através das bobinas mudou? E a rapidez?`,
  steps:[['O que não muda',`O fluxo máximo (N · B · A) é o mesmo: mesmo ímã, mesmas bobinas.`],
         ['O que muda',`Girando mais rápido, o fluxo vai do máximo ao mínimo em menos tempo: ε<sub>máx</sub> = N · B · A · ω é proporcional à rotação.`],
         ['Proporção',`ε = 60 · ${f('1 200','900')} = 60 · ${f('4','3')} = <b>80 V</b>`]],
  alt:`Mesma variação de fluxo em 3/4 do tempo → fem 4/3 maior. É a Lei de Faraday aplicada ao gerador: ΔΦ igual, Δt menor.`,
  warn:`Achar que a tensão não muda porque “o ímã é o mesmo” (B) confunde fluxo com variação de fluxo. Elevar a razão ao quadrado dá ≈ 107 V (D) — a dependência com a rotação é linear.` },

{ src:'Baseada no ENEM 2017', nivel:'intermediário',
  text:`Um estudante montou um gerador com um fio de cobre de diâmetro D enrolado em N espiras circulares de área A, que giram com frequência f entre dois ímãs que produzem um campo uniforme B. Ele mediu a tensão máxima V e a corrente de curto-circuito i (terminais ligados diretamente). Ele quer <b>aumentar a corrente de curto-circuito sem alterar a tensão máxima</b>. Para isso, deve:`,
  opts:[`dobrar o número N de espiras, mantendo o mesmo fio.`,`dobrar a frequência f com que as espiras giram.`,`dobrar a intensidade B do campo entre os ímãs.`,`usar fio mais grosso, com as mesmas N espiras.`,`dobrar a área A de cada uma das N espiras.`],
  ans:3,
  hint:`Separe as grandezas em dois grupos: as que mudam a tensão (fem) e as que mudam só a resistência do fio. Em curto-circuito, i = V/R.`,
  steps:[['Tensão',`V = N · B · A · ω → depende de N, B, A e f. Para não mudar V, nenhuma delas pode mudar.`],
         ['Resistência',`R = ρ · ${f('comprimento do fio','área da seção do fio')}. Um fio mais grosso tem seção maior → R menor.`],
         ['Corrente',`i = V/R: V igual e R menor → <b>i maior</b>. Alternativa D.`]],
  alt:`Por que dobrar N não serve? Dobra a tensão, mas o fio fica com o dobro do comprimento e a resistência também dobra: a corrente de curto fica igual. Já f, B e A mudam a tensão — o estudante queria V constante.`,
  warn:`Dobrar N é a resposta de uma pergunta parecida (dobrar V mantendo i). Leia com atenção o que deve mudar e o que deve ficar constante.` }
];

const lvKey = n => ({'básico':'b','básico+':'bp','intermediário':'i','avançado':'a'})[n] || 'b';
function levelGroups(){
  const g = [];
  LI.Q.forEach((q, i) => { if (!q.nivel) return; const last = g[g.length-1]; if (last && last.n === q.nivel && last.end === i) last.end = i + 1; else g.push({ n: q.nivel, start: i, end: i + 1 }); });
  return g;
}
function levelRow(){
  const g = levelGroups(); if (!g.length) return '';
  return `<div class="lvrow" style="grid-template-columns:repeat(${LI.Q.length},1fr)">${g.map(x => `<span class="lv-${lvKey(x.n)}" style="grid-column:${x.start+1} / ${x.end+1}">${x.n}</span>`).join('')}</div>`;
}
function levelSummary(){
  const g = levelGroups(); if (!g.length) return '';
  const c = {}; g.forEach(x => c[x.n] = (c[x.n] || 0) + (x.end - x.start));
  return `<div class="row" style="gap:6px">${Object.keys(c).map(n => `<span class="lvl lvl-${lvKey(n)}">${c[n]} ${n === 'básico' ? (c[n]>1?'básicas':'básica') : n === 'básico+' ? 'Básico+' : n === 'intermediário' ? (c[n]>1?'intermediárias':'intermediária') : (c[n]>1?'avançadas':'avançada')}</span>`).join('')}</div>`;
}
const save = () => store(LI.key, st);
function resumoLista(){
  const porNivel = n => { const idx = LI.Q.map((q,i) => i).filter(i => LI.Q[i].nivel === n); return idx.length ? idx.filter(i => status(i) === 'ok').length + '/' + idx.length : ''; };
  return {
    evento: 'lista concluída', tema: T.nome, lista: 'Lista ' + LI.num,
    acertos: correctCount(), total: LI.Q.length,
    basico: [porNivel('básico'), porNivel('básico+')].filter(Boolean).join(' + '), intermediario: porNivel('intermediário'), avancado: porNivel('avançado'),
    erradas: LI.Q.map((q,i) => i).filter(i => status(i) !== 'ok').map(i => i + 1).join(', '),
    dicas: Object.keys(st.hints || {}).filter(k => st.hints[k]).length,
    tempoMin: Math.round((st.tempo || 0) / 6) / 10
  };
}
function status(i){ const a = st.answers[i]; if (a === undefined) return 'none'; return a === LI.Q[i].ans ? 'ok' : 'bad'; }
function correctCount(){ return LI.Q.reduce((n,_,i)=> n + (status(i)==='ok'?1:0), 0); }
function answeredCount(){ return LI.Q.reduce((n,_,i)=> n + (status(i)!=='none'?1:0), 0); }

function renderRoad(){
  const Q = LI.Q;
  $('marks').innerHTML = Q.map((_,i)=>{
    const s = status(i);
    const cls = ['mk', s==='ok'?'ok':s==='bad'?'bad':'', st.cur===i?'cur':''].join(' ');
    const lab = s==='ok'?'certa':s==='bad'?'errada':'não respondida';
    return `<button class="${cls}" data-go="${i}" aria-label="Questão ${i+1}, ${lab}">${i+1}</button>`;
  }).join('');
  const pos = st.cur < 0 ? 0 : st.cur >= Q.length ? Q.length - 0.5 : st.cur + 0.5;
  const lane = $('lane'), pct = (pos/Q.length)*100;
  if (lane.dataset.estilo === 'estrada') $('car').style.left = `calc(${pct}% + ${st.cur<0?17:0}px)`;
  else { lane.style.setProperty('--p', pct.toFixed(2)); lane.querySelector('.ln-fill').style.clipPath = `inset(0 ${(100 - pct).toFixed(2)}% 0 0)`; }
  const n = answeredCount();
  $('roadLabel').textContent = st.cur>=0 && st.cur<Q.length ? `Questão ${st.cur+1} de ${Q.length}` : `Percurso: ${Q.length} questões`;
  $('roadScore').textContent = n ? `${correctCount()} de ${n} certas` : '';
}

  $('startBtn').onclick = () => {

  };

function renderQuestion(i){
  const Q = LI.Q, q = Q[i], a = st.answers[i], done = a !== undefined, skipped = a === -1;
  const opts = q.opts.map((o,k)=>{
    let cls = 'opt', tag = '';
    if (done){
      if (k === q.ans){ cls += ' is-correct'; tag = '<span class="tag">✓ correta</span>'; }
      else if (k === a){ cls += ' is-wrong'; tag = '<span class="tag">✗ sua resposta</span>'; }
      else cls += ' is-dim';
    }
    return `<li><button class="${cls}" data-pick="${k}" ${done?'disabled':''}><span class="letter">${L[k]}</span><span>${o}</span>${tag}</button></li>`;
  }).join('');
  let fb = '';
  if (done){
    fb = a === q.ans
      ? `<div class="feedback good" role="status"><span class="ico">✓</span>Correto! Confira a resolução para ver se o seu raciocínio bate.</div>`
      : skipped
        ? `<div class="feedback bad" role="status"><span class="ico">→</span>Sem problema. Acompanhe a resolução com calma e tente refazer no papel.</div>`
        : `<div class="feedback bad" role="status"><span class="ico">✗</span>Não foi dessa vez. A resposta certa é a ${L[q.ans]}. Veja onde o raciocínio muda.</div>`;
  }
  const sol = done ? `
    <section class="sol" aria-label="Resolução detalhada">
      <h3>Resolução detalhada</h3>
      <ol class="steps">
        ${q.steps.map(([lab,html])=>`<li class="step"><div class="step-body"><div class="step-label">${lab}</div>${html}</div></li>`).join('')}
      </ol>
      <div class="answer"><span class="letter">${L[q.ans]}</span><span>Resposta: alternativa ${L[q.ans]} (${q.opts[q.ans]})</span></div>
      ${q.alt ? `<div class="alt"><b class="lbl">Outro jeito de pensar</b>${q.alt}</div>` : ''}
      ${q.warn ? `<div class="warn"><b class="lbl">Cuidado com a pegadinha</b>${q.warn}</div>` : ''}
    </section>` : '';
  const showHint = st.hints[i] && !done;
  const last = i === Q.length - 1;
  $('qa').innerHTML = `
  <article class="card">
    <div class="qhead">
      <div class="qnum">Questão ${i+1} <span>/ ${Q.length}</span></div>
      <span class="row" style="gap:6px">${q.nivel ? `<span class="lvl lvl-${lvKey(q.nivel)}">Nível ${q.nivel === 'básico+' ? 'Básico+' : q.nivel}</span>` : ''}<span class="src">${q.src}</span></span>
    </div>
    <div class="stmt">${q.text}</div>
    <ul class="opts">${opts}</ul>
    ${!done ? `<div class="row">
        ${showHint ? '' : `<button class="btn" id="hintBtn">Ver dica</button>`}
        <span class="spacer"></span>
        <button class="btn ghost" id="skipBtn">Não sei, mostrar a resolução</button>
      </div>` : ''}
    ${showHint ? `<div class="tip"><b>Dica</b>${q.hint}</div>` : ''}
    ${fb}
    ${sol}
    <div class="row">
      ${i > 0 ? `<button class="btn" id="prevBtn">← Anterior</button>` : ''}
      <span class="spacer"></span>
      ${done ? `<button class="btn primary" id="nextBtn">${last ? 'Ver meu resultado' : 'Próxima questão →'}</button>`
             : (!last ? `<button class="btn ghost" id="jumpBtn">Pular por enquanto</button>` : '')}
    </div>
  </article>`;
  $('qa').querySelectorAll('[data-pick]').forEach(b => b.onclick = () => answer(i, +b.dataset.pick));
  const h = $('hintBtn'); if (h) h.onclick = () => { st.hints[i] = true; save(); renderQuestion(i); };
  const s = $('skipBtn'); if (s) s.onclick = () => answer(i, -1);
  const p = $('prevBtn'); if (p) p.onclick = () => goQ(i - 1);
  const n = $('nextBtn'); if (n) n.onclick = () => goQ(i + 1);
  const j = $('jumpBtn'); if (j) j.onclick = () => goQ(i + 1);
}

function answer(i, k){
  if (st.answers[i] !== undefined) return;
  st.answers[i] = k; save();
  if (answeredCount() === LI.Q.length && !st.enviado){ contarTempo(); st.enviado = true; save(); enviar(resumoLista()); }
  renderRoad(); renderQuestion(i);
  const fb = $('qa').querySelector('.feedback');
  if (fb) fb.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
}

function renderEnd(){
  const Q = LI.Q, c = correctCount(), n = answeredCount();
  const msg = n < Q.length
    ? `Você ainda tem ${Q.length - n} questão(ões) sem responder. Toque nelas abaixo para terminar.`
    : c >= Math.ceil(Q.length * 0.9) ? 'Excelente! Você domina este conteúdo. Releia as pegadinhas para chegar ao ENEM ainda mais seguro.'
    : c >= Math.ceil(Q.length * 0.6) ? 'Bom trabalho. Revise as questões que errou e leia com atenção as pegadinhas: é onde mais se perde ponto.'
    : 'Vale revisar a caixa de ferramentas e refazer as questões com calma, acompanhando cada passo da resolução, antes do ENEM.';
  $('qa').innerHTML = `
  <section class="card">
    <div class="qnum">Resultado</div>
    <div class="score">${c}<span> / ${Q.length}</span></div>
    <p style="margin:0">${msg}</p>
    <ul class="reslist">
      ${Q.map((q,i)=>{ const s = status(i); const t = s==='ok'?'✓ certa':s==='bad'?(st.answers[i]===-1?'→ vista':'✗ errada'):'— pendente';
        return `<li><button class="res ${s}" data-go="${i}"><b>Questão ${i+1}</b><span class="st">${t}</span></button></li>`; }).join('')}
    </ul>
    <div class="row">
      <button class="btn" id="resetBtn">Refazer a lista do zero</button>
      <button class="btn primary" data-nav="tema">Voltar para ${T.nome}</button>
      <span class="small" id="resetNote"></span>
    </div>
  </section>`;
  const r = $('resetBtn'); let armed = false;
  r.onclick = () => {
    if (!armed){ armed = true; r.textContent = 'Confirmar: apagar minhas respostas'; $('resetNote').textContent = 'Toque de novo para confirmar.'; return; }
    st = { answers:{}, hints:{}, cur:-1, tempo:0 }; save(); goQ(-1);
  };
}

function goQ(i){
  st.cur = i; save();
  renderRoad();
  if (i < 0) renderIntro();
  else if (i >= LI.Q.length) renderEnd();
  else renderQuestion(i);
  toTop();
}

/* ===== Formulário do aulão ===== */
function openFormulario(){
  contarTempo(); tMarca = null; T = LI = null;
  plate(`Física · ${SITE.turma} · Aulão`, 'Formulário', 'Todas as fórmulas da lista do aulão, por assunto.');
  document.documentElement.classList.add('th-form');
  crumbs([{ label:'Início', nav:'home' }, { label:'Formulário' }]);
  $('view').innerHTML = `
    <nav class="card formnav" aria-label="Assuntos do formulário"><p class="sect-label">Ir para</p><div class="row" style="gap:6px">${FORMULARIO.map(([sec], i) => `<a class="chip chip-link" href="#/formulario" data-sec="${i}">${sec}</a>`).join('')}</div></nav>
    ${FORMULARIO.map(([sec, itens], i) => `<section class="card formsec" id="sec${i}"><h2 class="formh">${sec}</h2><div class="tools-grid form-grid">${itens.map(([t, h]) => `<div class="tool"><h4>${t}</h4><div>${h}</div></div>`).join('')}</div></section>`).join('')}`;
  toTop();
}

/* ===== Navegação com endereço próprio (#/tema/lista) e botão Voltar do celular ===== */
function go(h){ if (location.hash === h) route(); else location.hash = h; }
function openLogin(){
  contarTempo(); tMarca = null; T = LI = null;
  plate(`Física · ${SITE.escola}`, SITE.turma, `${SITE.turmas} · ${SITE.prof}`);
  crumbs(null);
  $('view').innerHTML = `
    <form class="card intro" id="loginForm" novalidate>
      <p class="sect-label">Identificação</p>
      <p>Para usar as listas, informe o seu <b>e-mail do colégio</b> e a sua turma. Você só faz isso uma vez neste aparelho.</p>
      <label class="fld"><span>E-mail do colégio <small class="fld-dica">(só a parte antes do @)</small></span>
        <span class="emailbox">
          <input id="loginEmail" type="text" inputmode="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="nome.sobrenome" required>
          <span class="dom" aria-hidden="true">@${CONFIG.dominio.replace('.', '.<wbr>')}</span>
        </span></label>
      <label class="fld"><span>Turma</span>
        <select id="loginTurma" required><option value="">Escolha</option>${CONFIG.turmas.map(t => `<option value="${t}">${t}</option>`).join('')}</select></label>
      <p class="small" id="loginErro" role="alert"></p>
      <div class="row"><button class="btn primary" type="submit">Entrar</button></div>
      <p class="note">O professor recebe o seu e-mail, a turma, a data de acesso e os resultados das listas (acertos, tempo e dicas usadas), só para acompanhar os estudos da turma.</p>
    </form>`;
  $('loginForm').onsubmit = e => {
    e.preventDefault();
    let usuario = $('loginEmail').value.trim().toLowerCase().replace(/\s+/g, '');
    const dom = '@' + CONFIG.dominio.toLowerCase().replace(/^@/, '');
    if (usuario.endsWith(dom)) usuario = usuario.slice(0, -dom.length);   // se digitou o e-mail inteiro, aproveita
    const email = usuario + dom, turma = $('loginTurma').value;
    if (!usuario){ $('loginErro').textContent = 'Escreva a parte do seu e-mail antes do @.'; $('loginEmail').focus(); return; }
    if (usuario.includes('@') || !emailValido(email)){ $('loginErro').textContent = `Escreva só a parte antes do @. O resto (${dom}) já está preenchido.`; $('loginEmail').focus(); return; }
    if (!turma){ $('loginErro').textContent = 'Escolha a sua turma.'; $('loginTurma').focus(); return; }
    setAluno({ email, turma }); registrarAcessoDoDia(); route();
  };
  toTop();
}
function route(){
  if (precisaLogin()){ openLogin(); return; }
  registrarAcessoDoDia(); enviarFila();
  const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  document.documentElement.classList.remove('th-form');
  if (p[0] === 'formulario'){ openFormulario(); return; }
  const ti = SITE.temas.findIndex(t => t.id === p[0]);
  if (ti < 0){ openHome(); return; }
  if (!p[1]){ openTema(ti); return; }
  const li = SITE.temas[ti].listas.findIndex(l => l.id === p[1]);
  if (li < 0){ openTema(ti); return; }
  T = SITE.temas[ti]; openLista(li);
}
window.addEventListener('hashchange', route);
document.addEventListener('click', e => {
  const fm = e.target.closest('[data-form]'); if (fm){ go('#/formulario'); return; }
  const sc = e.target.closest('[data-sec]'); if (sc){ e.preventDefault(); const el = $('sec' + sc.dataset.sec); if (el) el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); return; }
  const act = e.target.closest('[data-act="sair"]'); if (act){ setAluno(null); try { localStorage.removeItem(DIA_KEY); } catch(err){} go('#/'); route(); return; }
  const nav = e.target.closest('[data-nav]');
  if (nav){ go(nav.dataset.nav === 'tema' && T ? '#/' + T.id : '#/'); return; }
  const t = e.target.closest('[data-tema]'); if (t){ go('#/' + SITE.temas[+t.dataset.tema].id); return; }
  const l = e.target.closest('[data-lista]'); if (l){ go('#/' + T.id + '/' + T.listas[+l.dataset.lista].id); return; }
  const g = e.target.closest('[data-go]'); if (g && LI){ goQ(+g.dataset.go); }
});

/* ===== Instalação como aplicativo ===== */
let installEvt = null;
const standalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; showInstall(); });
window.addEventListener('appinstalled', () => { installEvt = null; const c = $('installCard'); if (c) c.hidden = true; });
function showInstall(){
  const c = $('installCard'); if (!c || standalone()) return;
  if (installEvt){
    c.hidden = false;
    c.innerHTML = `<p class="sect-label">Instale no celular</p><p>Tenha as listas como um aplicativo: ícone na tela inicial e funcionando mesmo sem internet.</p><div class="row"><button class="btn primary" id="instBtn">Instalar o app</button></div>`;
    $('instBtn').onclick = async () => { installEvt.prompt(); try { await installEvt.userChoice; } catch(e){} installEvt = null; c.hidden = true; };
  } else if (isIOS){
    c.hidden = false;
    c.innerHTML = `<p class="sect-label">Instale no iPhone</p><p>No Safari, toque em <b>Compartilhar</b> (o quadrado com a seta para cima) e depois em <b>Adicionar à Tela de Início</b>.</p>`;
  }
}

if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
route();

</script>
